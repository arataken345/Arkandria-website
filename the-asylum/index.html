/* ================= 4. SYSTEMS ================= */
/* Clean contracts, event-emitting. Canon behavior preserved exactly.
   UI subscribes to events; systems never touch the DOM (except via
   UI.* presentation calls passed in — none here). */

const MENTAL_TIERS = ["Tenang", "Tegang", "Gelisah", "Panik", "Hancur"];
const REST_FULL = 30, REST_HALF = 15, REST_CD = 10;
const FAINT_W = { killed: 15, stolen: 30, wounded: 25, safe: 30 };

/* ---------- 4a. STATUS (tiers, effects, emotions, mental) ---------- */
const Status = {
  tierGet(name){ const t = Store.get('tiers'); return (t && t[name]!=null) ? t[name] : -1; },
  tierSet(name, v){
    v = parseInt(v);
    const tiers = Object.assign({}, Store.get('tiers')||{});
    if(isNaN(v) || v<0) delete tiers[name];
    else tiers[name] = Math.min(3, v);
    Store.set('tiers', tiers, {event:'status:changed', data:{tier:name}});
  },
  tierUp(name){ const t=this.tierGet(name); this.tierSet(name, t<0?0:t+1); },
  tierDown(name){ const t=this.tierGet(name); if(t>=0) this.tierSet(name, t-1); },
  /* derived conditions (computed, never stored) */
  isLemas(){ return this.tierGet("Kelelahan")===3; },
  isBingung(){ return this.tierGet("Stress")===3; },
  isWoundedLike(){ return Store.get('status')==="wounded" || this.isLemas(); },
  isShaken(){ /* Goyah: mental Panik/Hancur, atau Takut>=2 */
    return (Store.get('mental')||0)>=3 || this.emotionGet("Takut")>=2;
  },
  setStatus(s){ Store.set('status', s, {event:'status:changed'}); },
  addTemp(n, nodes){
    const temp = (Store.get('temp')||[]).map(t=>Object.assign({},t));
    const ex = temp.find(t=>t.n===n);
    if(ex) ex.left = Math.max(ex.left, Math.max(1, nodes||1));
    else temp.push({ n, left: Math.max(1, nodes||1) });
    Store.set('temp', temp, {event:'status:changed'});
  },
  tempActive(n){ return !!((Store.get('temp')||[]).find(t=>t.n===n && t.left>0)); },
  tickTemp(){
    const temp = (Store.get('temp')||[]).map(t=>({n:t.n, left:t.left-1})).filter(t=>t.left>0);
    Store.set('temp', temp, {silent:true});
  },
  addEmotion(name, amt){
    const em = Object.assign({}, Store.get('emotions')||{});
    const v = clamp((em[name]||0)+(amt||1), 0, 3);
    if(v<=0) delete em[name]; else em[name]=v;
    Store.set('emotions', em, {event:'status:changed'});
  },
  emotionGet(name){ return (Store.get('emotions')||{})[name] || 0; },
  tickEmotions(){
    const em = Object.assign({}, Store.get('emotions')||{});
    let changed = false;
    for(const k of Object.keys(em)){ em[k]--; if(em[k]<=0){ delete em[k]; } changed=true; }
    if(changed) Store.set('emotions', em, {event:'status:changed'});
  },
  rollDecayAt(){ return 5 + Math.floor(Math.random()*6); },
  decayTick(){
    const S = Store._raw();
    if(S.decayCount==null) S.decayCount = 0;
    if(S.decayAt==null) S.decayAt = this.rollDecayAt();
    S.decayCount++;
    if(S.decayCount >= S.decayAt){
      S.decayCount = 0;
      S.decayAt = this.rollDecayAt();
      this.tickEmotions();
      if((Store.get('mental')||0) > 0) this.mentalBetter(1);
    }
  },
  mentalWorse(n){ Store.set('mental', Math.min(MENTAL_TIERS.length-1, (Store.get('mental')||0)+(n||1)), {event:'status:changed'}); },
  mentalBetter(n){ Store.set('mental', Math.max(0, (Store.get('mental')||0)-(n||1)), {event:'status:changed'}); },
  mentalName(){ return MENTAL_TIERS[Store.get('mental')||0] || MENTAL_TIERS[0]; },
  favorAdd(name, n){
    const f = Object.assign({}, Store.get('favor')||{});
    f[name] = (f[name]||0) + (n||0);
    Store.set('favor', f, {event:'status:changed'});
  },
  favorGet(name){ return (Store.get('favor')||{})[name] || 0; },
  setObjective(text, textEn){
    Store.patch({objective: text||null, objectiveEn: textEn||null}, 'status:changed');
  },
  clearObjective(){ Store.patch({objective:null, objectiveEn:null}, 'status:changed'); }
};

/* ---------- 4b. ENERGY ---------- */
const Energy = {
  get(){ const e = Store.get('energy'); return e==null?100:e; },
  set(v){ Store.set('energy', clamp(Math.round(v),0,100), {event:'energy:changed'}); },
  /* canon: every choice drains 4 */
  drain(n, x, y){
    const S = Store._raw();
    if(!S.registered) return;
    const cost = (n==null?4:n);
    const before = this.get();
    this.set(before - cost);
    Bus.emit('energy:drained', {cost, x, y});
    if(this.get()<=0){
      const tb = Status.tierGet("Kelelahan");
      Status.tierUp("Kelelahan");
      if(Status.tierGet("Kelelahan")!==tb) Bus.emit('toast', {key:'toast_energy_empty'});
    }
  },
  restore(n){
    this.set(this.get() + (n||0));
    Bus.emit('energy:restored', {amount:n});
  },
  /* canon: faint chance curve */
  chance(){
    const e = this.get();
    if(e>40) return 0;
    if(e<=0) return 0.6;
    return (40-e)/40*0.6;
  },
  rollFaint(){ return Math.random() < this.chance(); },
  faintStealable(){
    const S = Store._raw();
    const eq = [];
    Object.values(S.equipment||{}).forEach(x=>{ if(x&&x.id) eq.push(x.id); });
    return (S.items||[]).filter(it=>it && !it.story && eq.indexOf(it.id)<0);
  },
  rollFaintOutcome(){
    const pool = ["killed","stolen","wounded","safe"].filter(id=> id!=="stolen" || this.faintStealable().length>0);
    const tot = pool.reduce((a,id)=>a+FAINT_W[id],0);
    let r = Math.random()*tot;
    for(const id of pool){ r-=FAINT_W[id]; if(r<=0) return id; }
    return pool[pool.length-1];
  },
  /* canon: faint flow. Returns outcome id; caller routes. */
  doFaint(){
    Bus.emit('faint:start', {});
    Audio.play("faint"); Audio.play("breath",{gain:0.5});
    const out = this.rollFaintOutcome();
    if(out==="wounded") Audio.play("growl",{gain:0.4});
    return out;
  },
  /* canon: REST flow. Returns 'ok' | 'full' | 'risky' | 'killed' */
  rest(){
    const S = Store._raw();
    if(!S.registered) return 'inactive';
    if(S.node && NODES[S.node] && NODES[S.node].kind==="death") return 'dead';
    if(Screens.has('faint') || Screens.has('death')) return 'blocked';
    if(this.get()>=100){ Bus.emit('toast',{key:'rest_full'}); return 'full'; }
    if(S.restCd<=0){
      this.restore(REST_FULL);
      Status.tierDown("Kelelahan");
      Store.patch({restCd: REST_CD, restRisk: 0});
      Audio.play("heal");
      Bus.emit('toast',{key:'rest_done'});
      Bus.emit('rest:done',{safe:true});
      return 'ok';
    }
    /* forced rest during cooldown — risk climbs */
    const risk = (S.restRisk||0)+1;
    Store.set('restRisk', risk);
    this.restore(REST_HALF);
    if(risk>=4){
      Store.set('faintReturn', S.node); // respawn where rested (was NODES mutation)
      return 'killed';
    }
    const pct = [25,50,75][risk-1];
    Bus.emit('rest:done',{safe:false, risk});
    if(Math.random()*100 < pct) return 'attack';
    Audio.play("heal");
    Bus.emit('toast',{key:'rest_risky_ok'});
    return 'risky';
  },
  restAttack(){
    const stealable = this.faintStealable();
    const kind = (stealable.length>0 && Math.random()<0.5) ? "robbed" : "wounded";
    let stolenId = null;
    if(kind==="robbed"){
      const victim = pick(stealable);
      stolenId = victim.id;
      Inventory.remove(victim.id, 1);
    } else {
      Status.setStatus("wounded");
    }
    Bus.emit('rest:attacked',{kind, stolenId});
    return {kind, stolenId};
  },
  tickRestCd(){
    const cd = Store.get('restCd')||0;
    if(cd>0) Store.set('restCd', cd-1, {silent:true});
  },
  /* narrative energy tier (for UI/audio cues) */
  tier(){
    const e = this.get();
    if(e>=60) return "fit";
    if(e>=40) return "tired";
    if(e>=20) return "weary";
    if(e>0) return "critical";
    return "empty";
  }
};

/* ---------- 4c. INVENTORY ---------- */
const Inventory = {
  list(){ return Store.get('items')||[]; },
  find(id){ return this.list().find(x=>x.id===id); },
  count(){ return this.list().reduce((a,i)=>a+(i.qty||1),0); },
  /* grantItems with seen-guard: one-time node grants never double-apply */
  grant(items, nodeId){
    const S = Store._raw();
    if(nodeId){
      const g = S.grantedNodes||[];
      if(g.includes(nodeId)) return [];
      S.grantedNodes = g.concat([nodeId]);
    }
    const granted = [];
    for(const item of (items||[])){
      Audio.play(item.id==="boneka" ? "teddy" : item.id==="koin_logam" ? "coins" : "pickup");
      this._addRaw(item);
      granted.push(item.id);
      /* collection dex (was collAdd) */
      if(typeof ITEM_DEX!=="undefined" && ITEM_DEX.some(d=>d.id===item.id)){
        const S2 = Store._raw();
        if(!(S2.collection||[]).includes(item.id)){
          S2.collection = (S2.collection||[]).concat([item.id]);
          Bus.emit('collection:add', {id:item.id});
        }
      }
    }
    Bus.emit('items:changed', {items:this.list()});
    return granted;
  },
  _addRaw(item){
    const S = Store._raw();
    const ex = S.items.find(x=>x.id===item.id);
    if(ex){ ex.qty=(ex.qty||1)+1; if(item.use && !ex.use) ex.use=item.use; }
    else S.items.push({
      id:item.id, name:item.name, note:item.note||"", icon:item.icon||"🎒",
      kind:item.kind||"consumable", slot:item.slot||null, qty:1, use:item.use||null,
      story:!!item.story, storyHint:item.storyHint||null, storyHintEn:item.storyHintEn||null,
      nameEn:item.nameEn||null, noteEn:item.noteEn||null
    });
    Bus.emit('item:added', {id:item.id});
  },
  remove(id, qty){
    const S = Store._raw();
    const it = S.items.find(x=>x.id===id);
    if(!it) return false;
    it.qty = (it.qty||1)-(qty||1);
    if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id);
    Bus.emit('items:changed', {items:S.items});
    return true;
  },
  /* canon: use consumable */
  use(id){
    const it = this.find(id);
    if(!it || !it.use) return false;
    const u = it.use;
    if(u.energy) Energy.restore(u.energy);
    if(u.heal && Store.get('status')==="wounded"){ Store.patch({status:null, body:null}, 'status:changed'); }
    if(u.tierUp) u.tierUp.forEach(t=>Status.tierUp(t));
    if(u.tierDown) u.tierDown.forEach(t=>Status.tierDown(t));
    if(u.mentalBetter) Status.mentalBetter(u.mentalBetter);
    if(u.mentalWorse) Status.mentalWorse(u.mentalWorse);
    if(u.addEmotion) u.addEmotion.forEach(e=>Status.addEmotion(e.n, e.amt));
    if(id==="perban_kotor" && u.heal) Achievements.unlock("wounded_heal");
    if(id==="surat_terlipat") Achievements.unlock("reader");
    const _before = Reactions.snapshot();
    this.remove(id, 1);
    Reactions.process(_before, "use", id);
    Bus.emit('toast',{key:'toast_use', param:itemNameL(it)+" 🩸"});
    Bus.emit('item:used',{id});
    return true;
  },
  /* canon: equip/unequip */
  equip(id){
    const S = Store._raw();
    const it = S.items.find(x=>x.id===id);
    if(!it || it.kind!=="equipment") return false;
    Audio.play("cloth",{gain:0.6});
    const slot = it.slot || "senjata";
    const cur = S.equipment[slot];
    if(cur){
      const ex = S.items.find(x=>x.id===cur.id);
      if(ex) ex.qty=(ex.qty||1)+1;
      else S.items.push(Object.assign({}, cur, {qty:1}));
    }
    it.qty=(it.qty||1)-1;
    if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id);
    const _before = Reactions.snapshot();
    S.equipment[slot] = { id:it.id, name:it.name, note:it.note||"", icon:it.icon||"🗡", kind:"equipment", slot };
    Bus.emit('items:changed', {items:S.items});
    Bus.emit('equipment:changed', {equipment:S.equipment});
    Reactions.process(_before, "equipment", id);
    return true;
  },
  unequip(slot){
    const S = Store._raw();
    const cur = S.equipment[slot];
    if(!cur) return false;
    const ex = S.items.find(x=>x.id===cur.id);
    if(ex) ex.qty=(ex.qty||1)+1;
    else S.items.push(Object.assign({}, cur, {qty:1}));
    const _before = Reactions.snapshot();
    S.equipment[slot] = null;
    Bus.emit('items:changed', {items:S.items});
    Bus.emit('equipment:changed', {equipment:S.equipment});
    Reactions.process(_before, "equipment", slot);
    return true;
  },
  equippedIn(slot){ return (Store.get('equipment')||{})[slot] || null; },
  hasEquipped(id){ return Object.values(Store.get('equipment')||{}).some(e=>e&&e.id===id); }
};

/* ---------- 4d. ACHIEVEMENTS ---------- */
const Achievements = {
  defs(){ return ACHV; },
  has(id){ return (Store.get('achievements')||[]).includes(id); },
  list(){ return Store.get('achievements')||[]; },
  unlock(id){
    const a = ACHV.find(x=>x.id===id);
    if(!a || this.has(id)) return false;
    Store.set('achievements', this.list().concat([id]), {event:'achievement:unlocked', data:{id}});
    Audio.play("achievement");
    return true;
  },
  /* import from legacy v1 key (migration) */
  importLegacy(map){
    const ids = Object.keys(map||{});
    const cur = this.list();
    const add = ids.filter(id=>!cur.includes(id) && ACHV.some(a=>a.id===id));
    if(add.length) Store.set('achievements', cur.concat(add), {silent:true});
    return add;
  }
};

/* ---------- 4e. FLAGS / VARS ---------- */
const Flags = {
  get(k){ return (Store.get('flags')||{})[k]; },
  set(k,v){
    const f = Object.assign({}, Store.get('flags')||{});
    f[k]=!!v;
    Store.set('flags', f, {event:'flags:changed'});
  },
  setMany(obj){
    const f = Object.assign({}, Store.get('flags')||{});
    for(const k of Object.keys(obj)) f[k]=!!obj[k];
    Store.set('flags', f, {event:'flags:changed'});
  },
  clear(k){
    const f = Object.assign({}, Store.get('flags')||{});
    delete f[k];
    Store.set('flags', f, {event:'flags:changed'});
  }
};
const Vars = {
  get(k){ return (Store.get('vars')||{})[k]; },
  set(k,v){
    const vs = Object.assign({}, Store.get('vars')||{});
    vs[k]=v;
    Store.set('vars', vs, {silent:true});
  }
};

/* ---------- 4f. AUDIO FACADE ---------- */
/* Clean facade over the existing Web Audio engine (kept verbatim).
   Emits events so UI can react; never throws if engine absent. */
const Audio = {
  _sys(){ return (typeof globalThis!=="undefined" && globalThis.AudioSys) ? globalThis.AudioSys : null; },
  init(){ try{ const s=this._sys(); if(s) s.init(); }catch(e){} },
  play(name, opts){
    Bus.emit('audio:play', {name, opts});
    try{ const s=this._sys(); if(s) s.sfx(name, opts); }catch(e){}
  },
  ambient(name){ try{ const s=this._sys(); if(s) s.setAmbient(name); }catch(e){} },
  heartbeat(on){ try{ const s=this._sys(); if(s) s.heartbeat(on); }catch(e){} },
  muted(){ try{ const s=this._sys(); return s ? !!s.isMuted() : false; }catch(e){ return false; } },
  toggleMute(){ try{ const s=this._sys(); if(s) s.toggleMute(); }catch(e){} Bus.emit('audio:mute', {muted:this.muted()}); }
};

/* ================= 4g. REACTIONS ================= */
/* Derives semantic events from before/after state diffs (was deriveEvents
   + presentReaction + achvCheck + tutPopForEvents). Emits on Bus; shows
   the reaction bar; checks achievements; fires contextual tutorial pops. */
const TIER_NAMES = ["Ringan","Sedang","Tinggi","Ekstrim"];

const Reactions = {
  seq: 0,
  snapshot(){
    const S = Store._raw();
    const items = {};
    (S.items||[]).forEach(it=>{ items[it.id] = (items[it.id]||0) + (it.qty||1); });
    const equipment = {};
    Object.keys(S.equipment||{}).forEach(k=>{ equipment[k] = S.equipment[k] ? S.equipment[k].id : null; });
    return { status:S.status, mental:S.mental||0, deathCount:S.deathCount||0,
             items, equipment, effects:[...(S.effects||[])],
             tiers:{...(S.tiers||{})}, temp:(S.temp||[]).map(t=>t.n).sort(),
             emotions:{...(S.emotions||{})}, favor:{...(S.favor||{})},
             objective:S.objective||null, objectiveEn:S.objectiveEn||null,
             body:S.body||null, energyTier:Energy.tier() };
  },
  derive(before, after, source){
    const evts = [];
    const push = (type, severity, changes, reactionKey)=>{
      evts.push({ id:"ev"+(++this.seq), type, severity, changes,
                  source, context:{ node:Store.get('node') }, reactionKey });
    };
    if(after.deathCount > before.deathCount)
      push("death", "critical",
           { from:before.deathCount, to:after.deathCount, deathCount:after.deathCount },
           "death");
    if(after.status !== before.status){
      const to = after.status;
      const sev = (to==="danger"||to==="wounded") ? "high" : "moderate";
      push("status_changed", sev, { from:before.status, to }, "status_"+(to||"safe"));
    }
    if(after.mental !== before.mental){
      const worse = after.mental > before.mental;
      push("mental_changed", worse ? (after.mental>=4 ? "high" : "moderate") : "low",
           { from:before.mental, to:after.mental, label:MENTAL_TIERS[after.mental]||"" },
           "mental_"+(worse?"worse":"better"));
    }
    const ids = new Set([...Object.keys(before.items), ...Object.keys(after.items)]);
    ids.forEach(id=>{
      const b = before.items[id]||0, a = after.items[id]||0;
      if(a > b) push("item_gained", "low",
                     { id, name:itemDispName(id), from:b, to:a, qty:a-b }, "item_gained");
      else if(a < b) push("item_lost", "low",
                     { id, name:itemDispName(id), from:b, to:a, qty:b-a }, "item_lost");
    });
    Object.keys(after.equipment).forEach(slot=>{
      if(after.equipment[slot] !== before.equipment[slot]){
        const equipped = !!after.equipment[slot];
        push("equipment_changed", "low",
             { slot, slotName:eqSlotNameL(slot),
               from:before.equipment[slot], to:after.equipment[slot],
               name:itemDispName(after.equipment[slot]||before.equipment[slot]) },
             equipped ? "equipment_equipped" : "equipment_unequipped");
      }
    });
    after.effects.forEach(ef=>{
      if(!before.effects.includes(ef))
        push("effect_started", "moderate", { effect:ef }, "effect_started");
    });
    const tnames = new Set([...Object.keys(before.tiers), ...Object.keys(after.tiers)]);
    tnames.forEach(name=>{
      const b = before.tiers[name], a = after.tiers[name];
      if(b===a) return;
      const bl = (b===undefined) ? "—" : TIER_NAMES[b];
      const al = (a===undefined) ? "Hilang" : TIER_NAMES[a];
      push("tier_changed", (a===3||b===3) ? "high" : "moderate",
           { name, from:bl, to:al, label:al }, "tier_changed");
      if(name==="Kelelahan" && a===3 && b!==3)
        push("derived", "high", { name:"Lemas",
          note:"Kelelahan mencapai Ekstrim — tubuhmu Lemas, setara Terluka." }, "derived_lemas");
      if(name==="Stress" && a===3 && b!==3)
        push("derived", "high", { name:"Kebingungan Akut",
          note:"Stress mencapai Ekstrim — pilihanmu berikutnya ditentukan dadu." }, "derived_bingung");
      if(name==="Kelelahan" && b===3 && a!==3)
        push("derived", "low", { name:"Lemas", note:"Rasa lemasmu mereda." }, "derived_lemas_end");
      if(name==="Stress" && b===3 && a!==3)
        push("derived", "low", { name:"Kebingungan Akut", note:"Pikiranmu kembali jernih." }, "derived_bingung_end");
    });
    const enames = new Set([...Object.keys(before.emotions), ...Object.keys(after.emotions)]);
    enames.forEach(name=>{
      const b = before.emotions[name]||0, a = after.emotions[name]||0;
      if(a===b) return;
      push("emotion_changed", (a>b && a>=2) ? "moderate" : "low",
           { name, from:b, to:a, dir: a>b ? "naik" : "turun" }, "emotion_changed");
    });
    const fnames = new Set([...Object.keys(before.favor), ...Object.keys(after.favor)]);
    fnames.forEach(name=>{
      const b = before.favor[name]||0, a = after.favor[name]||0;
      if(a!==b){
        const d = a-b;
        push("favor_changed", "low",
             { name, from:b, to:a, delta:d, dstr:(d>0?"+":"")+d }, "favor_changed");
      }
    });
    if(after.objective!==before.objective)
      push("objective_changed", "moderate",
           { from:before.objective||"—", to:after.objective||"—",
             objective:after.objective||"", objectiveEn:after.objectiveEn||null }, "objective_changed");
    const bt = new Set(before.temp), at = new Set(after.temp);
    at.forEach(t=>{ if(!bt.has(t)) push("temp_started", "low", { name:t }, "temp_started"); });
    bt.forEach(t=>{ if(!at.has(t)) push("temp_ended", "low", { name:t }, "temp_ended"); });
    if(after.energyTier!==before.energyTier){
      const order = { fit:4, tired:3, weary:2, critical:1, empty:0 };
      const to = after.energyTier;
      const d = (order[to]??4) < (order[before.energyTier]??4) ? "down" : "up";
      const txt = energyTierText(to, d);
      if(txt) push("energy_tier", to==="empty"||to==="critical" ? "high" : "low",
                   { from:before.energyTier, to, dir:d, tierText:txt }, "energy_tier");
    }
    if(after.body!==before.body && (after.body || before.body))
      push("body_changed", "low",
           { from:before.body||"—", to:after.body||"—" }, "body_changed");
    return evts;
  },
  present(evts){
    if(!evts || !evts.length) return;
    const order = { critical:0, high:1, moderate:2, low:3 };
    const sorted = [...evts].sort((a,b)=>(order[a.severity]??3)-(order[b.severity]??3));
    const primary = sorted[0];
    const key = primary.reactionKey;
    let variant = 0;
    if(key===this._lastKey){ this._repeat = (this._repeat||0)+1; variant = this._repeat % 2; }
    else this._repeat = 0;
    this._lastKey = key;
    const entry = REACTIONS[key];
    if(!entry) return;
    const msg = this.fillTpl(reactVariant(entry, variant), this.dispChanges(primary.changes));
    this.showBar(msg, primary.severity);
  },
  fillTpl(tpl, changes){
    let s = tpl;
    for(const k of Object.keys(changes||{})) s = s.split("{"+k+"}").join(changes[k]);
    return s;
  },
  dispChanges(ch){
    const o = {};
    for(const k of Object.keys(ch||{})){
      const v = ch[k];
      o[k] = (v==null) ? "—" : (typeof v==="object" ? JSON.stringify(v) : String(v));
    }
    return o;
  },
  showBar(msg, severity){
    let bar = $("#reactionBar");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "reactionBar";
      bar.setAttribute("role","status");
      bar.setAttribute("aria-live","polite");
      document.body.appendChild(bar);
    }
    bar.className = "show sev-"+severity;
    bar.textContent = msg;
    clearTimeout(bar._h);
    bar._h = setTimeout(()=>{ bar.className = ""; }, 2600);
  },
  /* achievement auto-checks (was achvCheck) */
  checkAchievements(evts, target){
    const S = Store._raw();
    if(!S || !S.registered) return;
    const has = t => evts.some(e=>e.type===t);
    if(has("death")){
      Achievements.unlock("first_death");
      if((S.deathCount||0) >= 5) Achievements.unlock("five_deaths");
    }
    if(target==="d5_trap") Achievements.unlock("trap_victim");
    if(target==="d5_smart") Achievements.unlock("smart_cross");
    if(target==="d3_a2a") Achievements.unlock("frozen");
    evts.forEach(e=>{
      if(e.type==="item_gained" && e.changes.id==="boneka") Achievements.unlock("teddy_friend");
      if(e.type==="item_lost" && e.changes.id==="boneka") Achievements.unlock("teddy_dropped");
      if(e.type==="energy_tier" && e.changes.to==="empty") Achievements.unlock("empty_tank");
      if(e.reactionKey==="derived_lemas") Achievements.unlock("lemas_body");
      if(e.reactionKey==="derived_bingung") Achievements.unlock("dice_fate");
    });
    if(S.flags && S.flags.d1 && S.flags.d2 && S.flags.d3 && S.flags.d4) Achievements.unlock("explorer");
  },
  /* contextual tutorial pops (was tutPopForEvents) */
  tutPopsFor(evts){
    if(!evts || !evts.length) return;
    let energy=false, wounded=false, tier=false, lemas=false, bingung=false,
        emotion=false, temp=false, usable=false, objective=false, favor=false;
    const S = Store._raw();
    evts.forEach(e=>{
      if(e.type==="energy_tier" && e.changes.to!=="fit") energy = true;
      if(e.type==="status_changed" && e.changes.to==="wounded") wounded = true;
      if(e.type==="tier_changed") tier = true;
      if(e.reactionKey==="derived_lemas") lemas = true;
      if(e.reactionKey==="derived_bingung") bingung = true;
      if(e.type==="emotion_changed" && e.changes.dir==="naik") emotion = true;
      if(e.type==="temp_started") temp = true;
      if(e.type==="objective_changed") objective = true;
      if(e.type==="favor_changed") favor = true;
      if(e.type==="item_gained"){
        const it = (S.items||[]).find(x=>x.id===e.changes.id);
        if(it && it.use) usable = true;
      }
    });
    if(energy) Bus.emit('tutorial:pop',{id:"energy"});
    if(wounded) Bus.emit('tutorial:pop',{id:"wounded"});
    if(tier) Bus.emit('tutorial:pop',{id:"tier"});
    if(lemas) Bus.emit('tutorial:pop',{id:"lemas"});
    if(bingung) Bus.emit('tutorial:pop',{id:"bingung"});
    if(emotion) Bus.emit('tutorial:pop',{id:"emotion"});
    if(temp) Bus.emit('tutorial:pop',{id:"temp"});
    if(usable) Bus.emit('tutorial:pop',{id:"usable"});
    if(objective) Bus.emit('tutorial:pop',{id:"objective"});
    if(favor) Bus.emit('tutorial:pop',{id:"favor"});
  },
  /* full pipeline: snapshot -> derive -> present + tutpops + achievements */
  process(before, source, target){
    const after = this.snapshot();
    const evts = this.derive(before, after, source);
    if(evts.length){
      this.present(evts);
      this.tutPopsFor(evts);
      Bus.emit('reactions', {events: evts, source});
    }
    this.checkAchievements(evts, target);
    return evts;
  }
};

/* ================= 5. DIALOGUE RUNNER ================= */
/* Walks the node graph (dialogue-systems). Nodes are DATA (Section 3);
   the runner is a state machine: current -> emit content -> wait for
   input (advance or choice) -> apply transition -> next.
   NO-CHEATING: choices are final; the runner never goes back. */

const ChoiceLock = {
  /* canon: all lock conditions, identical to old isChoiceLocked */
  isLocked(c){
    const S = Store._raw();
    if(c.blockedIfFlag && S.flags && S.flags[c.blockedIfFlag]) return true;
    if((S.energy==null?100:S.energy)<=0 && !c.canon) return true;
    if(c.requiresEnergy!=null && (S.energy==null?100:S.energy) < c.requiresEnergy) return true;
    if(c.blockedIf && (c.blockedIf==="wounded" ? Status.isWoundedLike() : S.status===c.blockedIf)) return true;
    if(c.requiresItem && !S.items.some(it=>it.id===c.requiresItem)) return true;
    if(c.requiresEquipped && !S.equipment[c.requiresEquipped]) return true;
    if(c.requiresEquippedItem && !Object.values(S.equipment).some(e=>e&&e.id===c.requiresEquippedItem)) return true;
    if(c.requiresMentalMax!==undefined && (S.mental||0) > c.requiresMentalMax) return true;
    if(c.needsCalm && Status.isShaken()) return true;
    if(c.requiresEmotion && Object.keys(c.requiresEmotion).some(k=>Status.emotionGet(k) < c.requiresEmotion[k])) return true;
    if(c.blockedByEmotion && Object.keys(c.blockedByEmotion).some(k=>Status.emotionGet(k) >= c.blockedByEmotion[k])) return true;
    return false;
  },
  /* canon: energy 0 -> force last choice if nothing open */
  forcedIdx(choices){
    if(Energy.get()>0) return -1;
    const anyOpen = choices.some(c=>!this.isLocked(c));
    return anyOpen ? -1 : choices.length-1;
  },
  /* canon: branch conditions */
  condMet(w){
    if(!w) return true;
    const S = Store._raw();
    if(w.wounded!==undefined && Status.isWoundedLike()!==!!w.wounded) return false;
    if(w.inDanger!==undefined && (S.status==="danger")!==!!w.inDanger) return false;
    if(w.mentalMax!==undefined && (S.mental||0) > +w.mentalMax) return false;
    if(w.mentalMin!==undefined && (S.mental||0) < +w.mentalMin) return false;
    if(w.tier) for(const k of Object.keys(w.tier)){
      const c=w.tier[k];
      const v=Status.tierGet(k);
      if(c.max!==undefined && v>c.max) return false;
      if(c.min!==undefined && v<c.min) return false;
      if(c.eq!==undefined && v!==c.eq) return false;
    }
    if(w.flag!==undefined){
      if(typeof w.flag==="string"){ if(!Flags.get(w.flag)) return false; }
      else for(const k of Object.keys(w.flag)) if(!!Flags.get(k)!==!!w.flag[k]) return false;
    }
    if(w.item && !Inventory.find(w.item)) return false;
    return true;
  },
  resolveTarget(c){
    if(c.branches){
      for(const b of c.branches){ if(this.condMet(b.when)) return b.target; }
      const fb = c.branches.find(b=>!b.when);
      return fb ? fb.target : null;
    }
    return c.target || null;
  },
  /* canon: confusion dice picks among unlocked */
  dicePick(choices){
    const avail = choices.filter(cc=>!this.isLocked(cc));
    if(!avail.length) return null;
    return avail[Math.floor(Math.random()*avail.length)];
  }
};

/* Node enter-mutations (was applyEnterMutations). One-time grants are
   seen-guarded; everything else applies on entry (parity). */
const Mutations = {
  apply(node, nodeId){
    if(!node) return;
    if(node.tierUp) node.tierUp.forEach(t=>Status.tierUp(t));
    if(node.tierDown) node.tierDown.forEach(t=>Status.tierDown(t));
    if(node.tierSet) Object.keys(node.tierSet).forEach(k=>Status.tierSet(k, node.tierSet[k]));
    if(node.tierClear) node.tierClear.forEach(k=>Status.tierSet(k, -1));
    if(node.addTemp) node.addTemp.forEach(t=>Status.addTemp(t.n, t.nodes));
    if(node.setBody!==undefined) Store.set('body', node.setBody, {silent:true});
    if(node.clearBody) Store.set('body', null, {silent:true});
    if(node.setFlag) Flags.setMany(node.setFlag);
    if(node.clearFlag) node.clearFlag.forEach(k=>Flags.clear(k));
    if(node.mentalWorse) Status.mentalWorse(node.mentalWorse);
    if(node.mentalBetter) Status.mentalBetter(node.mentalBetter);
    if(node.addEmotion) node.addEmotion.forEach(e=>Status.addEmotion(e.n, e.amt));
    if(node.setObjective!==undefined) Status.setObjective(node.setObjective, node.setObjectiveEn||null);
    if(node.clearObjective) Status.clearObjective();
    if(node.favor) Object.keys(node.favor).forEach(k=>Status.favorAdd(k, node.favor[k]));
    if(node.grantItems) Inventory.grant(node.grantItems, nodeId);
    if(node.consumeItem) (Array.isArray(node.consumeItem)?node.consumeItem:[node.consumeItem]).forEach(c=>{
      const id = typeof c==="string" ? c : c.id, qty = (c && c.qty) || 1;
      Inventory.remove(id, qty);
    });
  }
};

const Runner = {
  /* enter a node: the single funnel for ALL node transitions */
  enter(id, opts){
    opts = opts||{};
    const node = NODES[id];
    if(!node){ Bus.emit('toast',{key:'dead_end'}); return false; }
    const before = Reactions.snapshot();
    Store.set('node', id, {silent:true});
    /* canon order: temp/emotion ticks per node */
    Status.tickTemp();
    Status.decayTick();
    /* background */
    if(node.kind!=="death") UIX.setBG(bgFor(id));
    /* audio cues (canon) */
    Audio.heartbeat(Store.get('status')==="danger"||Store.get('status')==="wounded");
    const et = Energy.tier();
    if((et==="critical"||et==="empty") && et!==Runner._lastET) Audio.play("energy_low");
    Runner._lastET = et;
    const nsfx = (typeof NODE_SFX!=="undefined") ? NODE_SFX[id] : null;
    if(nsfx) Audio.play(nsfx);
    const now = Date.now();
    if(/^d[1-4]_/.test(id) && now-(Runner._lastDoor||0)>8000){ Runner._lastDoor=now; Audio.play("door_open",{gain:0.65}); }
    const bgk = bgFor(id);
    if(/corridor|hall/.test(bgk) && Math.random()<0.35) Audio.play("footstep",{gain:0.4});
    if(bgk==="steeldoor" && Math.random()<0.4) Audio.play("chains",{gain:0.28});
    /* enter mutations via systems */
    Mutations.apply(node, id);
    if(node.setStatus==="wounded") Audio.play("death_sting",{gain:0.3});
    if(node.tutPop) Bus.emit('tutorial:pop',{id:node.tutPop});
    /* mark seen (for skip) */
    const seen = Store.get('seenText')||[];
    if(!seen.includes(id)) Store.set('seenText', seen.concat([id]), {silent:true});
    /* reactions: derive events from the transition, present + achievements */
    Reactions.process(before, "node", id);
    /* persist + render */
    Save.write();
    Screens.replace('story', {nodeId:id});
    Bus.emit('node:enter', {id, node});
    return true;
  },

  /* player picks a choice: NO-CHEATING, final. Canon order preserved. */
  choose(idx){
    const id = Store.get('node');
    const node = NODES[id];
    if(!node || !node.choices) return false;
    const c = node.choices[idx];
    if(!c || ChoiceLock.isLocked(c)) return false;
    Bus.emit('choice:picked', {nodeId:id, idx});
    /* beat for the picked animation (game-feel), then resolve */
    UIX.choiceBeat(()=>{
      /* canon: every choice drains 4 */
      const tap = UIX._lastTap||{};
      Energy.drain(4, tap.x, tap.y);
      Energy.tickRestCd();
      /* canon: faint check cancels the choice */
      if(Energy.rollFaint()){
        const out = Energy.doFaint();
        Faint.resolve(out);
        return;
      }
      let choice = c;
      /* canon: acute confusion — dice picks */
      if(Status.isBingung()){
        Audio.play("dice_roll");
        const dp = ChoiceLock.dicePick(node.choices);
        if(dp){
          choice = dp;
          Bus.emit('toast',{key:'dice_pick', param: choiceText(choice)});
        }
      }
      const target = ChoiceLock.resolveTarget(choice);
      if(target) Runner.enter(target);
      else Bus.emit('toast',{key:'dead_end'});
    });
    return true;
  },

  /* advance linear story (tap/space) */
  advance(){
    const id = Store.get('node');
    const node = NODES[id];
    if(!node) return false;
    if(node.kind==="story" && node.next){ this.enter(node.next); return true; }
    return false;
  },

/* ================= 7. SAVE MANAGER v2 ================= */
/* Versioned schema, atomic writes (tmp + verify + swap + .bak),
   slots, export/import, and v1->v2 migration. (save-systems) */
const Save = {
  KEY: "asylum_save_v2",
  BAK_SUFFIX: ".bak",
  TMP_SUFFIX: ".tmp",
  SLOT_SUFFIX: s => s>0 ? "_s"+s : "",
  V1_KEY: "asylum_save_v1",
  V1_ACHV_KEY: "asylum_achv_v1",
  V1_COLL_KEY: "asylum_coll_v1",

  key(slot){ return this.KEY + this.SLOT_SUFFIX(slot||0); },

  /* ---- atomic write: tmp -> verify -> bak -> swap ---- */
  write(slot){
    try{
      const k = this.key(slot);
      const payload = {
        version: SAVE_VERSION,
        savedAt: new Date().toISOString(),
        slot: slot||0,
        state: this._serializable()
      };
      const raw = JSON.stringify(payload);
      /* 1. tmp */
      localStorage.setItem(k+this.TMP_SUFFIX, raw);
      /* 2. verify tmp parses + version matches */
      const check = JSON.parse(localStorage.getItem(k+this.TMP_SUFFIX));
      if(!check || check.version!==SAVE_VERSION || !check.state) throw new Error("verify failed");
      /* 3. backup current */
      const cur = localStorage.getItem(k);
      if(cur) localStorage.setItem(k+this.BAK_SUFFIX, cur);
      /* 4. swap */
      localStorage.setItem(k, raw);
      localStorage.removeItem(k+this.TMP_SUFFIX);
      Bus.emit('save:written', {slot: slot||0, savedAt: payload.savedAt});
      return true;
    }catch(e){ console.error("[Save] write failed", e); return false; }
  },
  _serializable(){
    const S = Store._raw();
    const c = deepClone(S);
    delete c._session; // session-only (backlog, skipMode) never persisted
    return c;
  },
  read(slot){
    try{
      const raw = localStorage.getItem(this.key(slot));
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data || data.version!==SAVE_VERSION || !data.state) return null;
      return data;
    }catch(e){ return null; }
  },
  has(slot){ return !!this.read(slot); },
  load(slot){
    const data = this.read(slot);
    if(!data) return false;
    const state = this.sanitize(data.state);
    state.version = SAVE_VERSION;
    Store.replace(state);
    Bus.emit('save:loaded', {slot: slot||0});
    return true;
  },
  wipe(slot){
    try{
      const k = this.key(slot);
      localStorage.removeItem(k);
      localStorage.removeItem(k+this.BAK_SUFFIX);
      localStorage.removeItem(k+this.TMP_SUFFIX);
    }catch(e){}
  },
  info(slot){
    const d = this.read(slot);
    if(!d) return null;
    return { savedAt: d.savedAt, node: d.state.node, name: d.state.name,
             deathCount: d.state.deathCount, items: (d.state.items||[]).length };
  },

  /* ---- export / import (kept from v1) ---- */
  export(slot){
    const d = this.read(slot);
    return d ? JSON.stringify(d) : null;
  },
  import(jsonStr, slot){
    try{
      const data = JSON.parse(jsonStr);
      if(!data || !data.state) return {ok:false, reason:"bad-format"};
      let state = data.state;
      if(data.version===1 || !data.version){
        /* treat unversioned/legacy payload as v1 shape */
        state = this.migrateV1(state);
      } else if(data.version!==SAVE_VERSION){
        return {ok:false, reason:"unsupported-version"};
      }
      state = this.sanitize(state);
      state.version = SAVE_VERSION;
      /* write through the atomic path */
      Store.replace(state);
      const ok = this.write(slot);
      return {ok, reason: ok?null:"write-failed"};
    }catch(e){ return {ok:false, reason:"parse-error"}; }
  },

  /* ---- v1 -> v2 migration ---- */
  migrateV1(v1){
    const s = (v1 && typeof v1==="object") ? v1 : {};
    const fresh = defaultState();
    const out = Object.assign(fresh, {
      node: typeof s.node==="string" ? s.node : "title",
      registered: !!s.registered,
      name: typeof s.name==="string" ? s.name.slice(0,40) : "",
      gender: (s.gender==="f"||s.gender==="m") ? s.gender : "",
      deathCount: Math.max(0, parseInt(s.deathCount)||0),
      energy: clamp(parseInt(s.energy)==null?100:(parseInt(s.energy)||0), 0, 100),
      status: (s.status==="danger"||s.status==="wounded") ? s.status : null,
      mental: clamp(parseInt(s.mental)||0, 0, 4),
      body: (typeof s.body==="string"||s.body===null) ? (s.body||null) : null,
      effects: Array.isArray(s.effects) ? s.effects.filter(e=>typeof e==="string").slice(0,20) : [],
      equipment: (s.equipment && typeof s.equipment==="object") ? {senjata: s.equipment.senjata||null} : {senjata:null},
      objective: typeof s.objective==="string" ? s.objective : null,
      objectiveEn: typeof s.objectiveEn==="string" ? s.objectiveEn : null,
      restCd: Math.max(0, parseInt(s.restCd)||0),
      restRisk: Math.max(0, parseInt(s.restRisk)||0),
      decayCount: Math.max(0, parseInt(s.decayCount)||0),
      decayAt: (s.decayAt==null) ? null : Math.max(1, parseInt(s.decayAt)||5),
    });
    out.tiers = this._sanTiers(s.tiers);
    out.temp = this._sanTemp(s.temp);
    out.emotions = this._sanEmotions(s.emotions);
    out.favor = this._sanFavor(s.favor);
    out.flags = this._sanFlags(s.flags);
    out.items = this._sanItems(s.items);
    /* achievements: merge legacy key */
    try{
      const a = JSON.parse(localStorage.getItem(this.V1_ACHV_KEY));
      if(a && a.unlocked) out.achievements = Object.keys(a.unlocked).filter(id=>ACHV.some(x=>x.id===id));
    }catch(e){}
    /* collection: merge legacy key */
    try{
      const c = JSON.parse(localStorage.getItem(this.V1_COLL_KEY));
      if(c && c.items) out.collection = Object.keys(c.items);
    }catch(e){}
    return out;
  },

  /* ---- sanitizers (import/restore hardening) ---- */
  sanitize(st){
    const fresh = defaultState();
    const out = Object.assign(fresh, st||{});
    out.version = SAVE_VERSION;
    out.tiers = this._sanTiers(out.tiers);
    out.temp = this._sanTemp(out.temp);
    out.emotions = this._sanEmotions(out.emotions);
    out.favor = this._sanFavor(out.favor);
    out.flags = this._sanFlags(out.flags);
    out.items = this._sanItems(out.items);
    if(!Array.isArray(out.effects)) out.effects=[];
    if(!out.equipment || typeof out.equipment!=="object") out.equipment={senjata:null};
    if(!Array.isArray(out.achievements)) out.achievements=[];
    if(!Array.isArray(out.seenText)) out.seenText=[];
    if(!Array.isArray(out.grantedNodes)) out.grantedNodes=[];
    if(!Array.isArray(out.collection)) out.collection=[];
    out.energy = clamp(parseInt(out.energy)||0, 0, 100);
    out.mental = clamp(parseInt(out.mental)||0, 0, 4);
    out.settings = Object.assign({textSpeed:1, lang:"id"}, out.settings||{});
    out._session = { backlog:[], skipMode:false };
    return out;
  },
  _sanTiers(t){
    const out={};
    if(t && typeof t==="object") ["Stress","Keracunan","Pendarahan","Kelelahan"].forEach(k=>{
      const v=parseInt(t[k]); if(!isNaN(v)) out[k]=clamp(v,0,3);
    });
    return out;
  },
  _sanTemp(a){
    if(!Array.isArray(a)) return [];
    return a.filter(x=>x&&typeof x.n==="string").slice(0,8)
      .map(x=>({n:x.n.slice(0,30), left:clamp(parseInt(x.left)||1,1,20)}));
  },
  _sanEmotions(e){
    const out={};
    if(e && typeof e==="object") Object.keys(e).slice(0,10).forEach(k=>{
      const kk=String(k).slice(0,20); const v=parseInt(e[k]);
      if(kk && !isNaN(v) && v>0) out[kk]=clamp(v,1,3);
    });
    return out;
  },
  _sanFavor(f){
    const out={};
    if(f && typeof f==="object") Object.keys(f).slice(0,20).forEach(k=>{
      const kk=String(k).slice(0,30); const v=parseInt(f[k]);
      if(kk && !isNaN(v)) out[kk]=clamp(v,-999,999);
    });
    return out;
  },
  _sanFlags(f){
    const out={};
    if(f && typeof f==="object") Object.keys(f).slice(0,100).forEach(k=>{
      out[String(k).slice(0,40)] = !!f[k];
    });
    return out;
  },
  _sanItems(arr){
    if(!Array.isArray(arr)) return [];
    return arr.filter(it=>it&&typeof it.id==="string").slice(0,60).map(it=>({
      id: it.id.slice(0,40),
      name: typeof it.name==="string"?it.name.slice(0,60):it.id,
      note: typeof it.note==="string"?it.note.slice(0,200):"",
      icon: typeof it.icon==="string"?it.icon.slice(0,8):"🎒",
      kind: it.kind==="equipment"?"equipment":"consumable",
      slot: typeof it.slot==="string"?it.slot:null,
      qty: clamp(parseInt(it.qty)||1,1,99),
      use: (it.use&&typeof it.use==="object")?it.use:null,
      story: !!it.story,
      storyHint: typeof it.storyHint==="string"?it.storyHint:null,
      storyHintEn: typeof it.storyHintEn==="string"?it.storyHintEn:null,
      nameEn: typeof it.nameEn==="string"?it.nameEn:null,
      noteEn: typeof it.noteEn==="string"?it.noteEn:null
    }));
  }
};

/* Backlog: ring buffer of shown story text. Session-persistent. */
const Backlog = {
  MAX: 100,
  add(entry){
    const S = Store._raw();
    const log = S._session.backlog;
    log.push(Object.assign({t: Date.now()}, entry));
    if(log.length > this.MAX) log.splice(0, log.length - this.MAX);
    Bus.emit('backlog:add', entry);
  },
  list(){ return Store._raw()._session.backlog.slice(); },
  clear(){ Store._raw()._session.backlog = []; }
};

/* Text speed: chars per second multiplier. 1 = ~31 cps (old canon rate). */
const TextSpeed = {
  BASE_CPS: 31,
  SPEEDS: [0.5, 1, 2, 4],
  get(){ const s = Store.get('settings')||{}; return s.textSpeed||1; },
  set(mult){
    const s = Object.assign({}, Store.get('settings')||{});
    s.textSpeed = this.SPEEDS.includes(mult) ? mult : 1;
    Store.set('settings', s, {event:'settings:changed'});
    Save.write();
  },
  cps(){ return this.BASE_CPS * this.get(); },
  cycle(){
    const cur = this.get();
    const i = this.SPEEDS.indexOf(cur);
    this.set(this.SPEEDS[(i+1)%this.SPEEDS.length]);
  }
};

/* Skip: fast-forwards through SEEN text only. Stops at unseen text,
   choices, or input. Never skips choices (NO-CHEATING respected). */
const Skip = {
  on(){
    const S = Store._raw();
    S._session.skipMode = true;
    Bus.emit('skip:changed', {on:true});
    Audio.play("ui_skip", {gain:0.4});
  },
  off(){
    Store._raw()._session.skipMode = false;
    Bus.emit('skip:changed', {on:false});
  },
  isOn(){ return !!Store._raw()._session.skipMode; },
  toggle(){ this.isOn() ? this.off() : this.on(); },
  /* should this node be instant-shown? */
  shouldSkip(nodeId){
    if(!this.isOn()) return false;
    const node = NODES[nodeId];
    if(!node) return false;
    /* never skip choices, input, keypad, death — player must engage */
    if(node.kind==="choice"||node.kind==="input"||node.kind==="keypad"||node.kind==="death") return false;
    return (Store.get('seenText')||[]).includes(nodeId);
  }
};

/* ---------- 9a. Typewriter (text-speed aware, skippable) ---------- */
function typewriter(container, paragraphs, done, opts){
  opts = opts||{};
  container.innerHTML = paragraphs.map(()=>"<p></p>").join("");
  const ps = Array.from(container.children);
  let pi = 0, ci = 0, finished = false, timer = null;
  function end(){
    if(finished) return; finished = true; clearInterval(timer);
    ps.forEach((p,i)=>{ p.textContent = paragraphs[i]; });
    if(done) done();
  }
  if(opts.instant){
    end(); return end;
  }
  const interval = Math.max(4, Math.round(32 / (TextSpeed.get()||1)));
  timer = setInterval(()=>{
    if(pi >= ps.length){ end(); return; }
    ci += 1;
    ps[pi].textContent = paragraphs[pi].slice(0, ci);
    if(ci >= paragraphs[pi].length){ pi++; ci = 0; }
  }, interval);
  return end;
}

/* ---------- 9e. Choice list rendering ---------- */
function renderChoiceList(node, cbox){
  const S = Store._raw();
  const fIdx = ChoiceLock.forcedIdx(node.choices);
  cbox.innerHTML = node.choices.map((c,i)=>{
    const locked = ChoiceLock.isLocked(c) && i!==fIdx;
    const dis = locked ? "disabled" : "";
    const lockNote = locked ? choiceLockNote(c) : "";
    const condTag = c.condNote ? `<span class="condtag">${esc(choiceCondNote(c))}</span>` : "";
    const label = (c.doneFlag && S.flags && S.flags[c.doneFlag] && c.doneText) ? choiceDoneText(c) : choiceText(c);
    return `<button class="choice" data-i="${i}" style="animation-delay:${0.1+i*0.09}s" ${dis}><span class="num">${i+1}</span><span>${esc(label)}${condTag}${lockNote}</span></button>`;
  }).join("");
  if(fIdx>=0){
    const fb = cbox.querySelector(`.choice[data-i="${fIdx}"]`);
    if(fb){
      fb.disabled = false;
      const tag = document.createElement("span");
      tag.className = "condtag"; tag.textContent = ui("instinct");
      fb.querySelector("span:last-child").appendChild(tag);
    }
    const note = document.createElement("div");
    note.className = "tired-note";
    note.textContent = ui("tired_note");
    cbox.appendChild(note);
  }
  try{ if(cbox.querySelector(".choice")) Audio.play("choice_appear"); }catch(e){}
  cbox.querySelectorAll(".choice:not(:disabled)").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      cbox.querySelectorAll(".choice").forEach(b=>b.disabled=true);
      btn.classList.add("picked");
      const x = e.clientX, y = e.clientY;
      /* pass tap point for the float indicator */
      UIX._lastTap = {x, y};
      Runner.choose(+btn.dataset.i);
    });
  });
}
/* choiceLockNote — lock reason labels (canon ui keys) */
function choiceLockNote(c){
  const S = Store._raw();
  if(c.blockedIfFlag && S.flags && S.flags[c.blockedIfFlag])
    return `<span class="lock">${ui("lock_done")}</span>`;
  if(Energy.get()<=0 && !c.canon)
    return `<span class="lock">${ui("lock_tired")}</span>`;
  if(c.requiresEnergy!=null && Energy.get() < c.requiresEnergy)
    return `<span class="lock">${ui("lock_energy",{n:c.requiresEnergy})}</span>`;
  if(c.blockedIf && (c.blockedIf==="wounded" ? Status.isWoundedLike() : S.status===c.blockedIf))
    return `<span class="lock">${ui("lock_wounded")}${Status.isLemas()&&S.status!=="wounded"?ui("lock_weary_suffix"):""}</span>`;
  if(c.requiresItem && !Inventory.find(c.requiresItem))
    return `<span class="lock">${ui("lock_item",{name:esc(c.requiresItemName||c.requiresItem)})}</span>`;
  if(c.requiresEquipped && !S.equipment[c.requiresEquipped])
    return `<span class="lock">${ui("lock_eq",{slot:esc(eqSlotNameL(c.requiresEquipped))})}</span>`;
  if(c.requiresEquippedItem && !Object.values(S.equipment).some(e=>e&&e.id===c.requiresEquippedItem))
    return `<span class="lock">${ui("lock_eqitem",{name:esc(c.requiresEquippedItemName||c.requiresEquippedItem)})}</span>`;
  if(c.requiresMentalMax!==undefined && (S.mental||0) > c.requiresMentalMax)
    return `<span class="lock">${ui("lock_mental",{m:esc(mentalName(c.requiresMentalMax))})}</span>`;
  if(c.needsCalm && Status.isShaken())
    return `<span class="lock">${ui("lock_calm")}</span>`;
  if(c.requiresEmotion)
    for(const k of Object.keys(c.requiresEmotion))
      if(Status.emotionGet(k) < c.requiresEmotion[k])
        return `<span class="lock">${ui("lock_emotion",{e:esc(emotionDisp(k))})}</span>`;
  if(c.blockedByEmotion)
    for(const k of Object.keys(c.blockedByEmotion))
      if(Status.emotionGet(k) >= c.blockedByEmotion[k])
        return `<span class="lock">${ui("lock_emotion_block",{e:esc(emotionDisp(k))})}</span>`;
  return "";
}
/* rest dock sync (canon) */

function syncRestDock(){
  const dock = $("#actionDock"), b = $("#restBtn"), tx = $("#restTx");

    /* re-render when popping back (e.g. from inventory) */
    const id = params.nodeId || Store.get('node');
    renderStoryNode(id, el);
  },
  onKey: null /* set per node-kind below */
});

function renderStoryNode(id, el){
  const node = NODES[id];
  if(!node){ return; }
  /* skip mode: instant-show seen linear text */
  const instant = Skip.shouldSkip(id);
  if(node.kind==="choice") renderChoiceNode(id, node, el);
  else if(node.kind==="result") renderResultNode(id, node, el, instant);
  else if(node.kind==="input") renderInputNode(id, node, el);
  else if(node.kind==="keypad") renderKeypadNode(id, node, el);
  else if(node.kind==="death") renderDeathNode(id, node, el);
  else if(node.kind==="tbc") renderTBCNode(el);
  else renderLinearNode(id, node, el, instant);
}

function storyShell(node, extra){
  const kicker = node.kicker ? `<div class="kicker">${esc(nodeKicker(node))}</div>` : "";
  return `<div class="screen">
    <div class="story" id="storyBox" title="${esc(ui("story_title"))}">${kicker}<div id="twTarget"></div></div>
    <div class="taphint" id="tapHint">${ui("tap_hint")}</div>
    ${extra||""}
  </div>`;
}

function wireTypewriterSkip(el, skipFn){
  const sb = el.querySelector("#storyBox, #resBox");
  if(sb){ sb.style.cursor = "pointer"; sb.addEventListener("click", skipFn); }
  const th = el.querySelector("#tapHint");
  if(th) th.addEventListener("click", skipFn);
}

function renderLinearNode(id, node, el, instant){
  el.innerHTML = storyShell(node,
    `<div class="center" id="nextSlot" hidden><button class="big primary continuebtn" id="btnNext">${ui("continue")}</button></div>`);
  const done = ()=>{
    el.querySelector("#tapHint").style.display = "none";
    el.querySelector("#nextSlot").hidden = false;
    /* skip mode: auto-advance through seen linear nodes */
    if(Skip.isOn() && node.next && node.next!=="title"){
      setTimeout(()=>{ if(Skip.isOn()) Runner.enter(node.next); }, 350);
    }
  };
  const skip = typewriter(el.querySelector("#twTarget"), nodeStory(node), done, {instant});
  wireTypewriterSkip(el, skip);
  Screens.setKey((e)=>{
    if(e.key==="Enter"||e.key===" "){
      const slot = el.querySelector("#nextSlot");
      if(slot && !slot.hidden) el.querySelector("#btnNext").click(); else skip();
    }
  });
  el.querySelector("#btnNext").onclick = ()=>{
    if(node.next==="title") Screens.replace('title');
    else if(node.next) Runner.enter(node.next);
  };
}

function renderChoiceNode(id, node, el){
  el.innerHTML = storyShell(node, `<div class="choices" id="choiceBox" hidden></div>`);
  const instant = Skip.shouldSkip(id);
  const showChoices = ()=>{
    el.querySelector("#tapHint").style.display = "none";
    const cbox = el.querySelector("#choiceBox");
    cbox.hidden = false;
    if(node.choices.some(c=>c.condNote || c.branches)) Bus.emit('tutorial:pop',{id:"condchoice"});
    renderChoiceList(node, cbox);
  };
  /* skip mode stops at choices (player must engage) — but text still instant if seen */
  const skip = typewriter(el.querySelector("#twTarget"), nodeStory(node), showChoices, {instant});
  wireTypewriterSkip(el, skip);
  const sb = el.querySelector("#storyBox");
  Screens.setKey((e)=>{
    if(e.key===" "||e.key==="Enter"){ skip(); return; }
    const k = parseInt(e.key,10);
    if(k>=1 && k<=node.choices.length){
      const btn = el.querySelector(`.choice[data-i="${k-1}"]:not(:disabled)`);
      if(btn) btn.click();
      else{
        const lb = el.querySelector(`.choice[data-i="${k-1}"]`);
        if(lb) Audio.play("lock",{gain:0.6});
      }
    }
  });
}

function renderResultNode(id, node, el, instant){
  /* result-node state (was inline in renderResult) */
  if(node.setStatus) Status.setStatus(node.setStatus);
  if(node.clearStatus) Status.setStatus(null);
  if(node.addEffect){
    const S = Store._raw();
    if(!S.effects.includes(node.addEffect)){
      S.effects = S.effects.concat([node.addEffect]);
      Bus.emit('status:changed',{});
    }
  }
  const tag = node.tag ? `<span class="tagline" style="color:var(--${node.status==="danger"?"yellow":node.status})">${esc(nodeTag(node))}</span>` : "";
  el.innerHTML = `<div class="screen">
      <div class="result ${node.status||""}" id="resBox" title="${esc(ui("story_title"))}">${tag}<div id="twTarget"></div><div id="itemSlot"></div></div>
      <div class="taphint" id="tapHint">${ui("tap_hint")}</div>
      <div class="center" id="nextSlot" hidden><button class="big primary continuebtn" id="btnNext">${ui("continue")}</button></div>
    </div>`;
  const done = ()=>{
    el.querySelector("#tapHint").style.display = "none";
    if(node.item){
      Inventory.grant([node.item], id+"#item");
      const it = Inventory.find(node.item.id);
      el.querySelector("#itemSlot").innerHTML = `<div class="itemget">${ui("item_get")}<b>${esc(itemNameL(it||node.item))}</b> (+${(it&&it.qty)||1})</div>`;
    }
    el.querySelector("#nextSlot").hidden = false;
    if(Skip.isOn() && node.next){
      setTimeout(()=>{ if(Skip.isOn()) Runner.enter(node.next); }, 350);
    }
  };
  const skip = typewriter(el.querySelector("#twTarget"), nodeStory(node), done, {instant});
  wireTypewriterSkip(el, skip);
  Screens.setKey((e)=>{
    if(e.key==="Enter"||e.key===" "){
      const slot = el.querySelector("#nextSlot");
      if(slot && !slot.hidden) el.querySelector("#btnNext").click(); else skip();
    }
  });
  el.querySelector("#btnNext").onclick = ()=>{ if(node.next) Runner.enter(node.next); };
}

/* ---------- input / keypad nodes ---------- */
function renderInputNode(id, node, el){
  el.innerHTML = storyShell(node,
    `<div class="center" id="inputSlot" hidden>
      <input class="txtinput" id="txtAns" maxlength="40" placeholder="${ui("input_ph")}" autocomplete="off"/>
      <button class="big primary" id="btnAns">${ui("input_btn")}</button>
    </div>`);
  Bus.emit('tutorial:pop',{id:"input"});
  const skip = typewriter(el.querySelector("#twTarget"), nodeStory(node), ()=>{
    el.querySelector("#tapHint").style.display = "none";
    el.querySelector("#inputSlot").hidden = false;
    el.querySelector("#txtAns").focus();
  });
  wireTypewriterSkip(el, skip);
  let left = node.attempts || 1;
  function submit(){
    const v = el.querySelector("#txtAns").value.trim().toLowerCase();
    const ok = (node.answers||[]).some(a=>String(a).toLowerCase()===v);
    if(ok){
      Bus.emit('toast',{key:'input_ok'});
      Runner.enter(node.onCorrect);
      return;
    }
    left--;
    if(left>0){
      showToast(ui("input_wrong",{n:left}));
      el.querySelector("#txtAns").value = "";
      el.querySelector("#txtAns").focus();
    }else Runner.enter(node.onWrong);
  }
  el.querySelector("#btnAns").onclick = (e)=>{
    const r=e.target.getBoundingClientRect();
    Energy.drain(4, r.left+r.width/2, r.top);
    submit();
  };
  el.querySelector("#txtAns").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
  Screens.setKey((e)=>{
    if(document.activeElement && document.activeElement.id==="txtAns") return;
    if(e.key===" "||e.key==="Enter") skip();
  });
}

function renderKeypadNode(id, node, el){
  el.innerHTML = storyShell(node,
    `<div class="center" id="keySlot" hidden>
      <div class="keydisp" id="keyDisp"></div>
      <div class="keypad" id="keyPad"></div>
      <div class="center btnrow">
        <button class="mini-btn" id="keyClear">${ui("key_clear")}</button>
        <button class="big primary" id="keyGo">${ui("key_open")}</button>
      </div>
    </div>`);
  Bus.emit('tutorial:pop',{id:"keypad"});
  let buf = "", left = node.maxAttempts || 3;
  const disp = ()=>{ el.querySelector("#keyDisp").textContent = buf.split("").map(()=>"•").join(" ")||"—"; };
  const pad = el.querySelector("#keyPad");
  pad.innerHTML = [1,2,3,4,5,6,7,8,9,"⌫",0].map(d=>`<button class="key" data-k="${d}">${d}</button>`).join("");
  pad.querySelectorAll(".key").forEach(b=>b.addEventListener("click", ()=>{
    const k = b.dataset.k;
    Audio.play("key_press",{gain:0.5});
    if(k==="⌫") buf = buf.slice(0,-1);
    else if(buf.length<8) buf += k;
    disp();
  }));
  el.querySelector("#keyClear").onclick = ()=>{ buf=""; disp(); };
  el.querySelector("#keyGo").onclick = (e)=>{
    const r=e.target.getBoundingClientRect();
    Energy.drain(4, r.left+r.width/2, r.top);
    if(buf===String(node.code)){
      Bus.emit('toast',{key:'key_ok'});
      Runner.enter(node.onSuccess);
    }else{
      left--;
      Audio.play("key_wrong",{gain:0.5});
      if(left>0){ showToast(ui("key_wrong",{n:left})); buf=""; disp(); }
      else Runner.enter(node.onFail);
    }
  };
  const skip = typewriter(el.querySelector("#twTarget"), nodeStory(node), ()=>{
    el.querySelector("#tapHint").style.display = "none";
    el.querySelector("#keySlot").hidden = false;
    disp();
  });
  wireTypewriterSkip(el, skip);
  Screens.setKey((e)=>{
    if(e.key===" "||e.key==="Enter") skip();
  });
}

        <div class="tut-body">${tutStepH(st)}</div>
        <div class="center btnrow">
          ${idx>0?`<button class="big ghost" id="tutBack">${ui("tut_back")}</button>`:""}
          ${!last?`<button class="big primary" id="tutNext">${ui("tut_next")}</button>`
                 :`<button class="big primary" id="tutStart">${ui("tut_start")}</button>`}
        </div>
        <div class="center" style="margin-top:1rem"><button class="mini-btn" id="tutMenu">${ui("tut_menu")}</button></div>
      </div>`;
    const q = s=>el.querySelector(s);
    const nx = q("#tutNext"); if(nx) nx.onclick = ()=>this._step(idx+1, el);
    const bk = q("#tutBack"); if(bk) bk.onclick = ()=>this._step(idx-1, el);
    const mn = q("#tutMenu"); if(mn) mn.onclick = ()=>Screens.replace('title');
    const go = q("#tutStart");
    if(go) go.onclick = ()=>{ if(typeof tutSetDone!=="undefined") tutSetDone(); Screens.replace('title'); };
    const head = q("#tutHead"); if(head) head.focus({preventScroll:true});
    Screens.setKey((e)=>{
      if(e.key==="ArrowRight" && !last) this._step(idx+1, el);
      else if(e.key==="ArrowLeft" && idx>0) this._step(idx-1, el);
    });
  }
});

/* ---------- export / import ---------- */
function buildExportPayload(){
  const S = Store._raw();
  return {
    game:"the-asylum", version:2, exportedAt:new Date().toISOString(),
    state: Save._serializable()
  };
}
function exportSave(){
  const S = Store._raw();
  let payload;
  if(S.registered) payload = buildExportPayload();
  else{
    const d = Save.read(0);
    if(!d){ showToast(ui("toast_no_save")); return; }
    payload = { game:"the-asylum", version:2, exportedAt:d.savedAt, state:d.state };
  }
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
  const a = document.createElement("a");
  const stamp = (payload.exportedAt||new Date().toISOString()).slice(0,10);
  const safeName = ((S.name||"player")).replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-") || "player";
  a.href = URL.createObjectURL(blob);
  a.download = `the-asylum-save-${safeName}-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function wireSaveButtons(root){
  const ex = root.querySelector(".js-export"); if(ex) ex.onclick = exportSave;
  const im = root.querySelector(".js-import"); if(im) im.onclick = ()=>$("#importFile").click();
}
function importSaveFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    const res = Save.import(String(r.result||""), 0);
    if(res.ok){
      showToast(ui("toast_import_ok"));
      Screens.clear();
      Screens.push('status',{mode:"continue"});
    }else{
      showToast(ui("toast_import_fail"));
    }
  };
  r.readAsText(file);
}

/* ================= 10c. TUTORIAL POPS + ACHIEVEMENT TOAST ================= */
const TutPops = {
  queue: [], showing: false,
  pop(key){
    if(typeof TUTPOP==="undefined" || !TUTPOP[key]) return;
    if(typeof tutSeenGet!=="undefined" && tutSeenGet(key)) return; /* once per device */
    this.queue.push(key);
    if(!this.showing) this.next();
  },
  next(){
    const key = this.queue.shift();
    if(!key){ this.showing = false; this._cur=null; return; }
    const d = TUTPOP[key];
    if(!d){ this.next(); return; }
    this.showing = true;
    this._cur = key;
    const t = $("#tutPopT"), h = $("#tutPopH"), m = $("#tutModal");
    if(t) t.textContent = tutPopT(d);
    if(h) h.innerHTML = tutPopH(d);
    if(m) m.hidden = false;
  },
  dismiss(){
    const m = $("#tutModal"); if(m) m.hidden = true;
    /* mark seen */
    if(typeof tutSeenSet!=="undefined"){
      /* find current key — stored on show */
      if(this._cur) tutSeenSet(this._cur);
    }
    this._cur = null;
    setTimeout(()=>this.next(), 250);
  }
};
Bus.on('tutorial:pop', ({id})=>{
  TutPops.pop(id);
});

const AchvToast = {
  queue: [], showing: false,
  push(id){
    const a = ACHV.find(x=>x.id===id);
    if(!a) return;
    this.queue.push(a);
    if(!this.showing) this.next();
  },
  next(){
    const a = this.queue.shift();
    if(!a){ this.showing = false; return; }
    this.showing = true;
    const el = $("#achvToast");
    if(el){
      el.querySelector(".ai").textContent = a.icon;
      el.querySelector(".an").textContent = achvName(a);
      el.querySelector(".ad").textContent = achvDesc(a);
      el.classList.add("show");
      setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>this.next(), 350); }, 2600);
    } else this.next();
  }
};
Bus.on('achievement:unlocked', ({id})=>AchvToast.push(id));

/* ================= 10d. LANGUAGE ================= */
function applyLangToSettings(){
  const s = Object.assign({}, Store.get('settings')||{});
  s.lang = (typeof LANG!=="undefined") ? LANG : "id";
  Store.set('settings', s, {silent:true});
}
function applyStaticLang(){
  /* static HTML strings (kept from v1, adapted to new ids) */
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n;
    if(k) el.innerHTML = ui(k);
  });
  Bus.emit('lang:changed', {lang: LANG});
}

/* ================= 10e. INIT ================= */
function init(){
  applyStaticLang();
  Audio.init();
  /* mute button */
  const mb = $("#muteBtn");
  const ICON_ON = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 8.8a4.6 4.6 0 0 1 0 6.4"/></g></svg>';
  const ICON_OFF = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g></svg>';
  const syncMute = ()=>{ if(mb) mb.innerHTML = Audio.muted() ? ICON_OFF : ICON_ON; };
  if(mb){ mb.addEventListener("click", ev=>{ ev.stopPropagation(); Audio.toggleMute(); syncMute(); }); syncMute(); }
  Bus.on('audio:mute', syncMute);
  /* HUD buttons */
  const menuBtn = $("#menuBtn");
  if(menuBtn) menuBtn.addEventListener("click", ()=>{ Screens.replace('title'); });
  const invBtn = $("#invBtn");
  if(invBtn) invBtn.addEventListener("click", ()=>{ Screens.push('inventory'); });
  const statBtn = $("#statusBtn");
  if(statBtn) statBtn.addEventListener("click", ()=>{ Screens.push('status',{mode:"continue"}); });
  const restBtn = $("#restBtn");
  if(restBtn) restBtn.addEventListener("click", ()=>{
    const r = Energy.rest();
    if(r==='killed'){ Runner.enter("rest_killed"); }
    else if(r==='attack'){
      const atk = Energy.restAttack();
      Bus.emit('toast',{key: atk.kind==="robbed" ? 'rest_robbed' : 'rest_wounded'});
      Save.write();
    }
    HUD.refresh();
  });
  const setBtn = $("#setBtn");
  if(setBtn) setBtn.addEventListener("click", ()=>{ Screens.push('settings'); });
  const logBtn = $("#logBtn");
  if(logBtn) logBtn.addEventListener("click", ()=>{ Screens.push('backlog'); });
  const skipBtn = $("#skipBtn");
  if(skipBtn){
    const syncSkip = ()=>{ skipBtn.classList.toggle("on", Skip.isOn()); };
    skipBtn.addEventListener("click", ()=>{ Skip.toggle(); syncSkip(); });
    Bus.on('skip:changed', syncSkip);
    syncSkip();
  }
  /* tutorial modal dismiss */
  const tutOk = $("#tutPopOk");
  if(tutOk) tutOk.addEventListener("click", ()=>TutPops.dismiss());
  const tutModal = $("#tutModal");
  if(tutModal) tutModal.addEventListener("click", (e)=>{ if(e.target===tutModal) TutPops.dismiss(); });
  /* import file */
  const imp = $("#importFile");
  if(imp) imp.addEventListener("change", ()=>{
    if(imp.files && imp.files[0]) importSaveFile(imp.files[0]);
    imp.value = "";
  });
  /* boot: title screen */
  applyLangToSettings();
  Screens.push('title');
  HUD.refresh();
}
document.addEventListener("DOMContentLoaded", init);
