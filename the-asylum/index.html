/* ---------- RENDER NODE PILIHAN ---------- */
function renderNode(id){
  S.node = id; updateHUD(); persist();
  const n = NODES[id];
  const kicker = n.kicker ? `<div class="kicker">${esc(nodeKicker(n))}</div>` : "";
  app.innerHTML = `<div class="screen">
    <div class="story" id="storyBox" title="${esc(ui("story_title"))}">${kicker}<div id="twTarget"></div></div>
    <div class="taphint" id="tapHint">${ui("tap_hint")}</div>
    <div class="choices" id="choiceBox" hidden></div>
  </div>`;
  const skip = typewriter($("#twTarget"), nodeStory(n), ()=>{
    $("#tapHint").style.display = "none";
    if(n.choices.some(c=>c.condNote || c.branches)) tutPop("condchoice");
    const cbox = $("#choiceBox"); cbox.hidden = false;
    const _fIdx = forcedChoiceIdx(n.choices);
    cbox.innerHTML = n.choices.map((c,i)=>{
      const locked = isChoiceLocked(c) && i!==_fIdx;
      const dis = locked ? "disabled" : "";
      const lockNote = locked ? choiceLockNote(c) : "";
      const condTag = c.condNote ? `<span class="condtag">${esc(choiceCondNote(c))}</span>` : "";
      const label = (c.doneFlag && S.flags && S.flags[c.doneFlag] && c.doneText) ? choiceDoneText(c) : choiceText(c);
      return `<button class="choice" data-i="${i}" style="animation-delay:${0.1+i*0.09}s" ${dis}><span class="num">${i+1}</span><span>${esc(label)}${condTag}${lockNote}</span></button>`;
    }).join("");
    if(_fIdx>=0){
      const fb = cbox.querySelector(`.choice[data-i="${_fIdx}"]`);
      if(fb){
        fb.disabled = false;
        const tag = document.createElement("span");
        tag.className = "condtag"; tag.textContent = ui("instinct");
        fb.querySelector("span:last-child").appendChild(tag);
      }
      const note = document.createElement("div");
      note.className = "tired-note";
      note.textContent = ui("tired_note");
      cbox.appendChild(note);
    }
    cbox.querySelectorAll(".choice:not(:disabled)").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        cbox.querySelectorAll(".choice").forEach(b=>b.disabled=true);
        btn.classList.add("picked");
        let c = n.choices[+btn.dataset.i];
        spendEnergy(4, e.clientX, e.clientY); /* setiap pilihan memakai Energi */
        if(S.restCd>0) S.restCd--; /* cooldown rest ikut berjalan */
        setTimeout(()=>{
          if(rollFaint()){ doFaint(); return; } /* PINGSAN: pilihan batal, nasib yang bicara */
          if(isBingung()){ /* Kebingungan Akut: dadu yang memilih */
            const avail = n.choices.filter(cc=>!isChoiceLocked(cc));
            const pick = avail.length ? avail[rollDie(avail.length)-1] : c;
            toast(ui("dice_pick")+choiceText(pick));
            c = pick;
          }
          const t = resolveChoiceTarget(c);
          if(t) goTarget(t); else toast(ui("dead_end"));
        }, 450);
      });
    });
  });
  const sb = $("#storyBox");
  sb.style.cursor = "pointer";
  sb.addEventListener("click", skip);
  $("#tapHint").addEventListener("click", skip);
  document.onkeydown = (e)=>{
    if(e.key===" "||e.key==="Enter"){ skip(); return; }
    const k = parseInt(e.key,10);
    if(k>=1 && k<=n.choices.length){
      const btn = app.querySelector(`.choice[data-i="${k-1}"]:not(:disabled)`);
      if(btn) btn.click();
    }
  };
}

function goTarget(target, opts){
  const n = NODES[target];
  if(!n) return;
  interludeOpen = false;
  const before = snapshotState();
  S.node = target;
  tickTemp(); decayTick();            /* temp: tiap node; emosi+mental: tick acak 5-10 pilihan */
  if(n.kind!=="death") setBG(bgFor(target));
  try{
    if(globalThis.AudioSys){
      AudioSys.heartbeat(S.status==="danger"||S.status==="wounded");
      const _et = energyTier();
      if((_et==="critical"||_et==="empty") && _et!==lastET) AudioSys.sfx("energy_low");
      lastET = _et;
      const _nsfx = NODE_SFX[target];
      if(_nsfx) AudioSys.sfx(_nsfx);
    }
  }catch(e){}
  applyEnterMutations(n);         /* sistem baru: tier, body, mental, emosi, objective, favor, item */
  if(n.tutPop) tutPop(n.tutPop);      /* popup tutorial kontekstual dari node */
  persist();
  if(n.kind==="result") renderResult(target);
  else if(n.kind==="death") renderDeath(target);
  else if(n.kind==="tbc") renderTBC();
  else if(n.kind==="story") renderStory(target);
  else if(n.kind==="input") renderInput(target);
  else if(n.kind==="keypad") renderKeypad(target);
  else renderNode(target);
  if(!opts || !opts.quiet) reactAndTut(before, "node:"+target, target);
}

      </div>
    </div>`;
  const skip = typewriter($("#twTarget"), nodeStory(n), ()=>{
    $("#tapHint").style.display = "none";
    $("#keySlot").hidden = false;
  });
  const sb = $("#storyBox"); sb.style.cursor = "pointer"; sb.addEventListener("click", skip);
  $("#tapHint").addEventListener("click", skip);
  $("#keyPad").innerHTML = [1,2,3,4,5,6,7,8,9,"",0,"→"]
    .map(d=>d==="" ? "<span></span>"
      : `<button class="keybtn" data-d="${d}">${d}</button>`).join("");
  function draw(){ $("#keyDisp").textContent = buf ? "•".repeat(buf.length) : "————"; }
  draw();
  $("#keyPad").querySelectorAll(".keybtn").forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.d==="→"){ $("#keyGo").click(); return; }
      if(buf.length<8){ buf += b.dataset.d; draw(); }
    };
  });
  $("#keyClear").onclick = ()=>{ buf = ""; draw(); };
  $("#keyGo").onclick = (e)=>{
    const r=e.target.getBoundingClientRect(); spendEnergy(4, r.left+r.width/2, r.top);
    if(buf===(n.code||"")){ toast(ui("key_ok")); goTarget(n.onSuccess); return; }
    left--; $("#keyLeft").textContent = left;
    const d = $("#keyDisp");
    d.classList.add("err"); setTimeout(()=>d.classList.remove("err"), 450);
    buf = ""; draw();
    if(left<=0) goTarget(n.onFail);
    else toast(ui("key_wrong"));
  };
  document.onkeydown = (e)=>{
    if(e.key===" "||e.key==="Enter"){ skip(); return; }
    if(/^[0-9]$/.test(e.key) && buf.length<8){ buf += e.key; draw(); }
    else if(e.key==="Backspace"){ buf = buf.slice(0,-1); draw(); }
  };
}

  const before = snapshotState();
  const ex = S.items.find(it=>it.id===item.id);

ihat bentuk-bentuk di dalam: meja terbalik, kaki kursi yang patah seperti tulang. Tidak ada gerakan. Tidak ada napas selain napasmu.", "Tapi di ujung penglihatanmu, ada sesuatu yang berkilau redup di lantai \u2014 kilau plastik yang menangkap sisa cahaya lorong. Seperti bungkus. Seperti... persediaan."], "storyEn": ["You push the door one centimeter. Then two. The wood shifts with a soft groan, and a thin crack gapes before you. You peer through it with one eye, your heart pounding in your throat.", "Dark. A thicker damp smell bursts out and strikes your face \u2014 the smell of mold, wet earth, something rotting. Dimly you can make out shapes inside: an overturned table, chair legs snapped like bones. No movement. No breath but yours.", "But at the edge of your vision, something glints dimly on the floor \u2014 plastic catching the corridor's leftover light. Like a wrapper. Like... supplies."], "kickerEn": "Part 1: The Beginning"}, "d1_b2": {"story": ["Celah itu menunggu, gelap dan sabar. Keputusanmu?"], "storyEn": ["The crack waits, dark and patient. Your call?"], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Masuk dan periksa", "textEn": "Step in and investigate"}, {"text": "Tutup perlahan, jangan ambil risiko", "textEn": "Close it gently \u2014 don't take the risk"}]}, "d1_c": {"story": ["Kau menarik napas dalam, menguatkan diri, lalu mendorong pintu itu lebar-lebar dengan sekuat tenaga.", "KRIIEEK.", "Engsel berkarat itu menjerit \u2014 lengkingan logam yang memantul di sepanjang lorong, terlalu keras, terlalu lama, menggema dan menggema seolah lorong itu sendiri ikut berteriak. Jantungmu berhenti sesaat. Kau berdiri mematung, seluruh tubuh menegang, menunggu. Apakah ada yang mendengar? Apakah sesuatu akan datang?", "Satu detik. Dua detik. Tidak ada yang datang. Lorong kembali sunyi \u2014 sunyi yang aneh, seolah tidak terjadi apa-apa, seolah jeritan itu tidak pernah ada.", "Ruangan di baliknya kosong dan gelap. Meja-meja terbalik berserakan seperti bangkai. Hening."], "storyEn": ["You draw a deep breath, steel yourself, then shove the door wide open with all your strength.", "KRIIEEK.", "The rusted hinge screams \u2014 a metallic shriek bouncing down the corridor, too loud, too long, echoing and echoing as if the corridor itself were screaming along. Your heart stops for a moment. You stand frozen, every muscle tensed, waiting. Did anything hear? Will something come?", "One second. Two seconds. Nothing comes. The corridor falls silent again \u2014 a strange silence, as if nothing happened, as if the scream never existed.", "The room beyond is empty and dark. Overturned tables lie scattered like carcasses. Silence."], "kickerEn": "Part 1: The Beginning"}, "d1_c2": {"story": ["Derit itu mungkin terdengar sampai ujung lorong. Mungkin sesuatu mendengarnya. Keputusanmu?"], "storyEn": ["That creak may have carried to the end of the corridor. Something may have heard it. Your call?"], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Masuk cepat sebelum ada yang datang", "textEn": "Slip in quickly before something comes"}, {"text": "Tutup dan mundur \u2014 terlalu berisik", "textEn": "Shut it and back away \u2014 too loud"}]}, "d1_room": {"story": ["Kau melangkah masuk. Udara di sini lebih dingin \u2014 dingin yang merayap naik dari lantai beton ke tulang-tulangmu \u2014 dan baunya... tua. Bau debu yang mengendap bertahun-tahun, bau kertas yang membusuk, bau ruangan yang sudah lama tidak disentuh oleh siapa pun. Atau apa pun.", "Meja-meja terbalik berserakan di sekelilingmu. Di sudut ruangan, ada noda gelap di lantai \u2014 besar, tidak beraturan, meresap jauh ke dalam beton seperti diserap dengan rakus. Kau tidak mau terlalu memikirkan apa itu. Kau benar-benar tidak mau.", "Di bawah salah satu meja yang masih berdiri, matamu menangkap sesuatu: sebungkus plastik bening berisi roti kering, dan di sampingnya, selembar surat terlipat yang kertasnya sudah menguning dimakan waktu."], "storyEn": ["You step inside. The air here is colder \u2014 a cold that creeps up from the concrete floor into your bones \u2014 and it smells... old. The smell of dust settled over years, of paper rotting, of a room long untouched by anyone. Or anything.", "Overturned tables lie scattered around you. In the corner, a dark stain spreads across the floor \u2014 large, irregular, soaked deep into the concrete as if hungrily absorbed. You do not want to think too hard about what it is. You really do not.", "Beneath one of the still-standing tables, your eye catches something: a clear plastic pack of dried bread, and beside it, a folded letter, its paper yellowed with age."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Ambil bungkusan itu", "textEn": "Take the package"}, {"text": "Periksa noda gelap itu dulu", "textEn": "Examine the dark stain first"}]}, "d1_stain": {"story": ["Kau berjongkok di dekat noda itu. Warnanya cokelat kehitaman, tepinya tidak rata \u2014 merembes perlahan, bukan tumpah sekaligus. Dan ketika kau mendekat, bau besi samar masih tercium, tajam dan familiar, menusuk hidungmu.", "Darah. Sudah sangat lama. Kering sepenuhnya, menyatu dengan beton.", "Kau tidak tahu apakah itu membuatmu lega... atau justru lebih takut. Seseorang pernah berdarah di sini. Banyak. Dan sekarang, orang itu tidak ada di mana-mana."], "storyEn": ["You crouch beside the stain. Its color is blackish-brown, its edges uneven \u2014 seeped slowly, not spilled all at once. And as you lean closer, a faint iron smell still lingers, sharp and familiar, stinging your nose.", "Blood. Very old. Completely dry, fused with the concrete.", "You do not know whether that relieves you... or frightens you more. Someone once bled here. A lot. And now, that person is nowhere."], "kickerEn": "Part 1: The Beginning"}, "d1_stain2": {"story": ["Noda gelap itu tidak memberimu jawaban apa pun. Noda itu hanya diam di sana \u2014 menempel seperti luka tua yang menolak sembuh. Dan di bawah meja, bungkusan itu masih menunggu, tak tersentuh, seolah tak pernah ada yang berani menyentuhnya."], "storyEn": ["The dark stain offers you no answers. It only lies there, silent \u2014 clinging like an old wound that refuses to heal. And beneath the table, the package still waits, untouched, as though no one has ever dared to lay a hand on it."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Kembali dan raih bungkusan itu", "textEn": "Go back and grab the package"}, {"text": "Tinggalkan semuanya \u2014 pergi dari sini", "textEn": "Leave it all behind \u2014 get out of here"}]}, "d1_loot": {"story": ["Kau mengulurkan tangan dan meraih bungkusan plastik itu. Isinya: roti kering \u2014 tiga potong, masih tersegel dalam kemasan, dingin dan sedikit keras di telapakmu. Di sampingnya, surat terlipat itu terasa rapuh di antara jemarimu, seperti kulit yang bisa robek hanya dengan satu napas.", "Kau membukanya sekilas. Tulisan tangan yang gemetar, tinta yang pudar: \u2018Maafkan aku. Aku tidak bisa pulang. Jangan cari aku.\u2019 Tidak ada nama. Tidak ada tanggal. Hanya kata-kata itu \u2014 dan kau bertanya-tanya, berapa lama surat ini menunggu di dalam gelap sebelum tanganmu menemukannya.", "Kau melipatnya kembali dan menyimpan keduanya. Setidaknya, untuk sementara waktu, perutmu tidak akan kosong \u2014 dan di tempat seperti ini, harapan sekecil itu pun terasa berharga."], "storyEn": ["You reach out and take the plastic package. Inside: dried bread \u2014 three pieces, still sealed in their wrapper, cold and slightly hard against your palm. Beside it, the folded letter feels fragile between your fingers, like skin that could tear at a single breath.", "You unfold it just enough to read. Trembling handwriting, faded ink: \u2018Forgive me. I can\u2019t come home. Don\u2019t look for me.\u2019 No name. No date. Only those words \u2014 and you find yourself wondering how long this letter has waited in the dark before your hands found it.", "You fold it back up and keep them both. At least, for a little while, your stomach won\u2019t be empty \u2014 and in a place like this, even that small a hope feels precious."], "tagEn": "[Safe]"}, "d1_empty": {"story": ["Kau memutuskan bungkusan itu tidak sepadan dengan firasat buruk yang merayap dingin di kulitmu. Kau mundur keluar dan menutup pintu perlahan \u2014 sepelan yang kau bisa.", "Lorong menyambutmu kembali \u2014 sama gelapnya, sama sunyinya. Tapi kini keheningan itu terasa sedikit berbeda: seolah lorong ini baru saja memperhatikanmu memilih."], "storyEn": ["You decide the package isn\u2019t worth the cold dread crawling across your skin. You back out and close the door slowly \u2014 as slowly as you can.", "The corridor welcomes you back \u2014 just as dark, just as silent. But now the silence feels slightly different: as though the corridor has just watched you make your choice."], "tagEn": "[Safe]"}, "d2_hub": {"story": ["Pintu kedua di kiri terbuka lebar, setengah rusak \u2014 kayunya retak, tergantung miring pada satu engsel, menunggu saat untuk roboh sepenuhnya.", "Di baliknya: ruang sempit yang dipenuhi lemari-lemari tua berderet, seperti arsip atau gudang penyimpanan yang dilupakan dunia. Bau kapur barus dan kayu lapuk menyambutmu \u2014 tebal, menusuk hidung, dan membuat tenggorokanmu gatal.", "Semuanya diam. Terlalu diam? Bahkan bunyi kecil dari dirimu sendiri \u2014 langkah, napas, detak jantung \u2014 terdengar terlalu keras di sini, seolah ruangan ini sedang menahan napas."], "storyEn": ["The second door on the left stands wide open, half ruined \u2014 its wood cracked, hanging crooked on a single hinge, waiting for the moment it finally gives way.", "Beyond it: a cramped room crowded with rows of old cabinets, like an archive or storeroom the world has forgotten. The smell of mothballs and rotting wood greets you \u2014 thick, stinging your nose, itching in your throat.", "Everything is silent. Too silent? Even the small sounds of your own body \u2014 footsteps, breathing, heartbeat \u2014 sound far too loud here, as though the room itself is holding its breath."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Lempar sesuatu ke dalam \u2014 dengarkan", "textEn": "Toss something inside \u2014 and listen"}, {"text": "Masuk, buka lemari satu per satu", "textEn": "Step inside, open the cabinets one by one"}, {"text": "Firasat buruk \u2014 mundur", "textEn": "A bad feeling \u2014 back away"}]}, "d2_a": {"story": ["Kau memungut pecahan kaca dari lantai \u2014 dingin, tajam di ujung jemarimu \u2014 dan melemparkannya ke dalam ruangan. KLONTANG \u2014 bunyinya memantul di lantai beton, menggelinding, lalu berhenti.", "Sunyi. Lalu... dari dalam salah satu lemari, terdengar bunyi pelan: tuk. Sekali. Pelan. Seolah ruangan itu baru saja memutuskan untuk menjawab.", "Seperti sesuatu yang jatuh. Atau bergeser \u2014 kain yang terseret di kayu, atau sesuatu yang mengubah posisinya dengan sangat hati-hati.", "Kau menunggu. Tanpa sadar, kau menahan napas. Tidak ada lagi."], "storyEn": ["You pick up a shard of glass from the floor \u2014 cold, sharp against your fingertips \u2014 and hurl it into the room. CLANG \u2014 the sound echoes off the concrete floor, rolls, then stops.", "Silence. Then... from inside one of the cabinets, a soft sound: tok. Once. Quiet. As though the room has just decided to answer.", "Like something falling. Or shifting \u2014 cloth dragged across wood, or something changing its position very carefully.", "You wait. Without realizing it, you\u2019ve been holding your breath. Nothing more."], "kickerEn": "Part 1: The Beginning"}, "d2_a2": {"story": ["Bunyi itu tidak terulang. Hanya keheningan yang kembali menelan ruangan \u2014 dan sebuah pertanyaan yang menggantung di udara: apa keputusanmu?"], "storyEn": ["The sound does not come again. Only silence, swallowing the room once more \u2014 and a question hanging in the air: what is your decision?"], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Masuk dan periksa", "textEn": "Go in and investigate"}, {"text": "Batalkan \u2014 kembali ke lorong", "textEn": "Call it off \u2014 head back to the corridor"}]}, "d2_c": {"story": ["Kau mempercayai firasatmu dan melangkah mundur \u2014 satu langkah, lalu satu lagi \u2014 hingga punggungmu nyaris menyentuh dinding lorong.", "Tidak terjadi apa-apa. Dan justru itu yang mengganggumu \u2014 keheningan ruangan itu terasa... memperhatikan. Seperti mata-mata tak terlihat yang sedang mengikutimu."], "storyEn": ["You trust your instincts and step back \u2014 one step, then another \u2014 until your back nearly touches the corridor wall.", "Nothing happens. And that is precisely what unsettles you \u2014 the room\u2019s silence feels... watchful. Like unseen eyes following you."], "kickerEn": "Part 1: The Beginning"}, "d2_room": {"story": ["Ruangan sempit. Tiga lemari tua berderet di dinding, pintunya kusam dan berbintik kelembapan. Bau kapur barus menusuk hidung \u2014 tajam, basi, dan membuat matamu berair.", "Lemari pertama: pintunya sedikit terbuka, menganga seperti mulut yang kelelahan. Lemari kedua: tertutup rapat, tanpa celah. Lemari ketiga: terkunci \u2014 dan di permukaannya ada goresan-goresan panjang. Dari dalam."], "storyEn": ["A cramped room. Three old cabinets line the wall, their doors dull and speckled with damp. The smell of mothballs stings your nose \u2014 sharp, stale, making your eyes water.", "The first cabinet: its door hangs slightly ajar, gaping like an exhausted mouth. The second: shut tight, no gap at all. The third: locked \u2014 and across its surface run long scratches. From the inside."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Buka lemari pertama", "textEn": "Open the first cabinet"}, {"text": "Buka lemari kedua", "textEn": "Open the second cabinet"}, {"text": "Periksa lemari ketiga yang terkunci", "textEn": "Examine the locked third cabinet"}, {"text": "Keluar dari ruangan ini", "textEn": "Leave this room"}]}, "d2_c1": {"story": ["Kosong. Hanya debu tebal dan bau apek yang membuat tenggorokanmu kering. Tapi di sudut bawahnya ada sesuatu yang terlipat: sepotong kain putih kusam \u2014 perban, masih digulung, meski kotor.", "Kau mengambilnya. Lebih baik daripada tidak sama sekali. Mungkin. Meski jarimu ragu sesaat sebelum menyentuhnya."], "storyEn": ["Empty. Only thick dust and a musty smell that dries your throat. But folded in the bottom corner lies something: a scrap of dingy white cloth \u2014 a bandage, still rolled, though dirty.", "You take it. Better than nothing at all. Maybe. Though your fingers hesitate for a heartbeat before touching it."], "tagEn": "[Safe]"}, "d2_c2": {"story": ["Kau membuka lemari kedua \u2014 dan sesuatu jatuh dari rak atas: sepatu kecil. Sepatu anak. Mendarat miring di lantai dengan bunyi lembut yang terasa terlalu keras di keheningan ini.", "Kau menatapnya sesaat \u2014 terlalu lama, mungkin \u2014 lalu memaksakan diri melihat isi lemari: di rak bawah ada sebatang cokelat yang masih terbungkus rapat. Sedikit meleleh, tapi utuh. Seolah ditinggalkan untuk seseorang yang tidak pernah kembali.", "Kau mengambil cokelat itu. Sepatu itu kau biarkan. Kau tidak sanggup menyentuhnya \u2014 tidak dengan tanganmu, tidak hari ini."], "storyEn": ["You open the second cabinet \u2014 and something falls from the top shelf: a small shoe. A child\u2019s shoe. It lands tilted on the floor with a soft thud that feels far too loud in this silence.", "You stare at it for a moment \u2014 perhaps a moment too long \u2014 then force yourself to look at the cabinet\u2019s contents: on the bottom shelf, a bar of chocolate, still sealed tight. Slightly melted, but whole. As though it had been left for someone who never came back.", "You take the chocolate. The shoe you leave behind. You cannot bring yourself to touch it \u2014 not with your hands, not today."], "tagEn": "[Safe]"}, "d2_c3": {"story": ["Kau mendekati lemari ketiga. Terkunci. Goresan-goresan panjang menghiasi pintunya \u2014 dalam, berulang, berlapis-lapis, seperti dibuat dengan kuku yang putus asa. Dari dalam.", "Kau menempelkan tangan ke kayunya. Dingin. Dingin yang terasa salah untuk kayu tua \u2014 dingin yang meresap hingga ke tulang."], "storyEn": ["You approach the third cabinet. Locked. Long scratches scar its door \u2014 deep, repeated, layered, as though made by desperate fingernails. From the inside.", "You press your hand against the wood. Cold. A cold that feels wrong for old wood \u2014 a cold that seeps all the way to the bone."], "kickerEn": "Part 1: The Beginning"}, "d2_c3x": {"story": ["Lemari itu diam. Terlalu diam \u2014 seolah sedang menunggumu melakukan kesalahan."], "storyEn": ["The cabinet is silent. Too silent \u2014 as though it is waiting for you to make a mistake."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Tempelkan telinga ke pintunya \u2014 dengarkan", "textEn": "Press your ear to the door \u2014 listen"}, {"text": "Jangan sentuh. Mundur.", "textEn": "Don\u2019t touch it. Back away."}]}, "d2_c3b": {"story": ["Keheningan memadat di udara... lalu memecah: bunyi napas. Pelan, berat, dan entah bagaimana terasa lembap \u2014 tepat di balik papan kayu yang memisahkan kalian, sedekat selembar kain basah dari wajahmu.", "Kau tersentak mundur, jantungmu menghantam tulang rusuk seolah ingin lepas dari sangkarnya. Dan seketika itu juga, napas itu berhenti. Lenyap begitu saja, seperti tidak pernah ada.", "Apapun yang ada di sana \u2014 entah masih berdiri membisu di balik kayu itu, atau baru saja merangkak pergi dalam gelap \u2014 kau tidak ingin mencari tahu. Beberapa jawaban lebih baik tidak pernah ditemukan."], "storyEn": ["Silence thickens in the air... then shatters: the sound of breathing. Slow, heavy, and somehow damp-feeling \u2014 right behind the wooden panel separating you, as close as a wet cloth from your face.", "You flinch backward, your heart slamming against your ribs as if trying to break free of its cage. And in that same instant, the breathing stops. Vanishes completely, as if it had never been there.", "Whatever was in there \u2014 whether still standing mute behind the wood, or having just crawled away into the dark \u2014 you have no desire to find out. Some answers are better never discovered."], "tagEn": "[Safe]"}, "d2_c3c": {"story": ["Kau mundur dengan langkah pelan dan terkendali, matamu tak sekalipun lepas dari pintu lemari itu \u2014 menatap dalam, seolah tatapan saja bisa menahannya tetap tertutup.", "Tidak ada yang terjadi. Malam ini, untuk sekali ini saja, kehati-hatianmu akhirnya dibayar lunas \u2014 bukan dengan kelegaan, melainkan dengan keheningan yang masih terasa mengawasi."], "storyEn": ["You step back in slow, controlled strides, your eyes never once leaving the wardrobe door \u2014 staring deep, as if your gaze alone could hold it shut.", "Nothing happens. Tonight, for once, your caution is finally paid in full \u2014 not with relief, but with a silence that still feels like it is watching."], "tagEn": "[Safe]"}, "d2_done": {"story": ["Kau melangkahkan kaki keluar dari ruang lemari itu dan kembali menjejaki lorong yang dingin, udara di dadamu terasa sedikit lebih ringan.", "Di belakangmu, ruangan itu tenggelam kembali ke dalam sunyi \u2014 tapi jauh di tulang-tulangmu, kau tidak bisa mengenyahkan perasaan bahwa keheningan itu sedang menunggu. Menunggumu kembali."], "storyEn": ["You step out of the wardrobe room and back into the cold corridor, the air in your chest feeling a little lighter.", "Behind you, the room sinks back into silence \u2014 but deep in your bones, you cannot shake the feeling that the quiet is waiting. Waiting for you to return."], "tagEn": "[Safe]"}, "d3_hub": {"story": ["Pintu pertama di kanan berayun pelan \u2014 berderit kecil. Tidak ada angin di sini, tidak ada apa pun yang bisa menggerakkannya... kecuali sesuatu yang tak terlihat sedang menghembuskannya dari sisi lain.", "Dari celah gelapnya, kau menangkap bunyi itu: detak. Pelan, teratur, berdenyut di telingamu. Seperti... detak jantung? Atau jarum jam yang berputar di dalam ruangan yang seharusnya kosong?", "Udara yang merembes keluar dari celah itu menggigit kulitmu \u2014 dingin yang tidak seharusnya ada, dingin yang tidak mengenal musim."], "storyEn": ["The first door on the right swings slowly \u2014 it creaked softly. There is no wind here, nothing that could move it... unless something unseen is breathing it from the other side.", "From its dark slit, you catch the sound: a thump. Slow, steady, pulsing in your ears. Like... a heartbeat? Or a clock hand ticking inside a room that should be empty?", "The air seeping from the gap bites at your skin \u2014 a cold that should not exist, a cold that knows no season."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Masuk mengikuti detak itu", "textEn": "Follow the thumping \u2014 go inside"}, {"text": "Amati dari ambang pintu", "textEn": "Watch from the doorway"}, {"text": "Mundur dan tutup pintunya", "textEn": "Back away and shut the door"}]}, "d3_a": {"story": ["Kau melangkah melewati ambang pintu, dan seketika dingin menyergap naik dari pergelangan kakimu \u2014 merayap perlahan, seperti genangan air es yang bergerak sendiri.", "Detak itu kini terdengar lebih jelas \u2014 dan di sanalah kau sadar: ini bukan bunyi jam. Terlalu kacau ritmenya. Terlalu... hidup.", "Lalu kau melihatnya. Di sudut terjauh ruangan, udara beriak seperti permukaan air yang disentuh \u2014 dan dari dalam Kegelapan yang tak berbentuk, sepasang mata merah menyala perlahan terbuka.", "Ia melihatmu."], "storyEn": ["You step across the threshold, and instantly the cold seizes your ankles \u2014 creeping upward, like a pool of ice water moving on its own.", "The thumping is clearer now \u2014 and there you realize: this is no clock. Its rhythm is too broken. Too... alive.", "Then you see it. In the far corner of the room, the air ripples like touched water \u2014 and from within the formless Darkness, a pair of burning red eyes slowly opens.", "It sees you."], "kickerEn": "Part 1: The Beginning"}, "d3_a2": {"story": ["Mata merah itu menyipit hingga menjadi celah tajam \u2014 dan perlahan, ia mulai melayang mendekat ke arahmu, dingin yang dibawanya menusuk lebih dalam setiap inci."], "storyEn": ["The red eyes narrow into sharp slits \u2014 and slowly, it begins to drift toward you, the cold it carries cutting deeper with every inch."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Beku di tempat \u2014 jangan bergerak", "textEn": "Freeze \u2014 don't move at all"}, {"text": "Berbalik dan lari sekencang-kencangnya", "textEn": "Turn around and RUN"}]}, "d3_a2a": {"story": ["Kau memaksa setiap serat ototmu untuk diam. Jangan bernapas. Jangan berkedip. Bahkan detak jantungmu sendiri terasa terlalu berisik.", "Sosok transparan itu melayang mendekat. Dingin menusuk hingga ke sumsum tulangmu saat ia mengitarimu perlahan \u2014 dan kau bisa merasakannya, kebencian yang memancar darinya seperti radiasi, membakar udara di antara kalian.", "Lalu... ia berhenti. Sepasang mata merah itu menyipit, menilaimu. Perlahan, sangat perlahan, ia mundur \u2014 melebur kembali ke dalam Kegelapan ruangan itu, hingga tidak tersisa apa pun selain dingin.", "Kau tidak tahu kenapa ia melepaskanmu. Dan kau tidak mau tahu. Kakimu gemetar tak terkendali saat kau melangkah mundur keluar dari ruangan itu."], "storyEn": ["You force every fiber of muscle to stay still. Don't breathe. Don't blink. Even your own heartbeat feels too loud.", "The Transparent One drifts closer. Cold pierces to your marrow as it circles you slowly \u2014 and you can feel it, the hatred radiating from it like radiation, scorching the air between you.", "Then... it stops. The pair of red eyes narrows, judging you. Slowly, so slowly, it withdraws \u2014 dissolving back into the Darkness of the room, until nothing remains but the cold.", "You don't know why it let you go. And you don't want to know. Your legs tremble uncontrollably as you back out of the room."], "tagEn": "[In danger]"}, "d3_a2b": {"story": ["Kau berbalik dan berlari \u2014 tapi ia lebih cepat darimu.", "Dingin membakar lengan kirimu saat sesuatu yang tak terlihat mencakar melewatinya. Kau terhuyung, tapi kakimu terus menghentak lantai, menerobos pintu dan membantingnya keras di belakangmu.", "Napasmu terengah memburu. Lengan kirimu berdenyut perih \u2014 tiga garis merah menganga di kulitmu, dan dingin dari cakaran itu masih menusuk hingga ke tulang.", "Kau terluka. Dan di tengah napasmu yang tersengal, kau menyadari satu hal: ia tidak mengejarmu keluar. Ia hanya... menjaga ruangan itu. Menunggu yang berikutnya."], "storyEn": ["You spin around and run \u2014 but it is faster than you.", "Cold burns your left arm as something unseen slashes across it. You stumble, but your feet keep pounding the floor, bursting through the door and slamming it shut behind you.", "Your breath comes in ragged gasps. Your left arm throbs \u2014 three red lines gape open across your skin, and the cold of the claw marks still pierces to the bone.", "You are wounded. And through your heaving breaths, you realize one thing: it did not chase you out. It was merely... guarding that room. Waiting for the next one."], "tagEn": "[Wounded]"}, "d3_b": {"story": ["Kau bertahan di ambang pintu, tidak berani masuk. Hanya mengamati dari jarak yang terasa aman \u2014 kalau ada yang aman di sini.", "Detak itu terus berdenyut. Lalu, perlahan, dari dalam kegelapan \u2014 sepasang mata merah menyala muncul, dan menatap lurus ke arahmu.", "Kau tidak bergerak. Ia tidak bergerak. Waktu seolah berhenti bernapas.", "Kemudian mata itu berkedip \u2014 sekali saja \u2014 dan menghilang. Detak itu pun berhenti, meninggalkan keheningan yang berat.", "Pesannya jelas, tanpa sepatah kata pun: ia tahu kau di sini. Dan ia membiarkanmu pergi. Untuk sekarang."], "storyEn": ["You hold your ground at the threshold, not daring to enter. Just watching from a distance that feels safe \u2014 if anything is safe here.", "The thumping keeps pulsing. Then, slowly, from within the darkness \u2014 a pair of burning red eyes emerges, staring straight at you.", "You don't move. It doesn't move. Time itself seems to stop breathing.", "Then the eyes blink \u2014 just once \u2014 and vanish. The thumping stops too, leaving behind a heavy silence.", "The message is clear, without a single word: it knows you are here. And it is letting you go. For now."], "tagEn": "[In danger]"}, "d3_c": {"story": ["Kau mundur selangkah. Dua langkah. Jari-jarimu yang dingin meraih gagang pintu.", "Tepat saat daun pintu hampir rapat \u2014 detak itu... berhenti. Mendadak, seolah seseorang menekan tombol.", "Hening total, begitu pekat hingga telingamu berdenging. Lalu, dari balik pintu yang tinggal sejengkal itu, terdengar gesekan pelan \u2014 seperti kuku yang diseret di atas kayu. Sekali. Dua kali.", "Kau menutup pintu sepenuhnya dan mundur menjauh. Jantungmu masih berdebar keras, lama setelahnya."], "storyEn": ["You step back. Two steps. Your cold fingers reach for the door handle.", "Just as the door nearly closes \u2014 the thumping... stops. Abruptly, as if someone pressed a switch.", "Total silence, so thick your ears ring. Then, from behind the door with its single crack of opening, a faint scraping \u2014 like nails dragged across wood. Once. Twice.", "You shut the door fully and back away. Your heart keeps pounding, long after."], "tagEn": "[Safe]"}, "d4_hub": {"story": ["Pintu kedua di kanan terasa lebih tenang. Dari celah sempitnya, kau bisa mengintip sebuah meja \u2014 dan di atasnya, bayangan samar yang belum jelas bentuknya.", "Kau mendorong pintu itu perlahan. Ruangan kecil. Meja kayu di tengah. Dan di atasnya...", "Sebuah boneka beruang. Bulunya usang dan kusam, satu matanya telah lepas dari jahitan \u2014 tapi ia bersih. Terlalu bersih untuk tempat seperti ini. Seolah ada seseorang, entah siapa, yang merawatnya dengan penuh sayang."], "storyEn": ["The second door on the right feels calmer. Through its narrow slit, you can glimpse a table \u2014 and on it, a vague shape you cannot yet make out.", "You push the door open slowly. A small room. A wooden table in the center. And on it...", "A teddy bear. Its fur is worn and dull, one eye torn from its stitches \u2014 but it is clean. Too clean for a place like this. As if someone, whoever they are, has been caring for it with love."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Ambil boneka beruangnya", "textEn": "Pick up the teddy bear"}, {"text": "Periksa meja dan sekitarnya dulu", "textEn": "Inspect the table and its surroundings first"}, {"text": "Jangan sentuh apa pun \u2014 pergi dari sini", "textEn": "Don't touch anything \u2014 leave"}]}, "d4_a": {"story": ["Kau mengangkat boneka itu ke dalam dekapanmu. Ringan. Dan... hangat. Hangat, seperti baru saja turun dari pelukan seseorang.", "Kehangatan yang janggal itu merambat ke telapak tanganmu, naik ke lenganmu \u2014 kau merinding, bulu kudukmu berdiri satu per satu.", "Lalu kau menyadarinya, dan darahmu seolah berhenti mengalir: satu mata boneka yang masih tersisa itu... sedang menatapmu. Lurus. Tadi, saat ia tergeletak di atas meja, ia menghadap ke arah lain. Bukankah begitu?", "Kau memeluknya erat-erat ke dadamu. Entah kenapa, benda ini terasa penting. Dan anehnya, hangatnya tidak kunjung hilang dari tanganmu."], "storyEn": ["You lift the bear into your arms. Light. And... warm. Warm, as if it had just come from someone's embrace.", "The strange warmth creeps into your palms, up your arms \u2014 you shiver, goosebumps rising one by one.", "Then you notice, and your blood seems to stop flowing: the bear's one remaining eye... is looking at you. Straight at you. Just now, when it lay on the table, it was facing the other way. Wasn't it?", "You clutch it tight against your chest. You don't know why, but this thing feels important. And strangely, its warmth never fades from your hands."], "tagEn": "[Safe]"}, "d4_b": {"story": ["Kau menahan napas dan memaksa dirimu memeriksa ruangan itu dulu \u2014 perlahan, seperti seseorang yang takut membangunkan sesuatu. Meja kayu itu kosong, kecuali boneka beruang yang duduk diam di atasnya. Tapi saat kau menunduk, matamu menangkap sesuatu yang terselip di bawah meja: selembar kertas gambar anak-anak, digambar dengan crayon.", "Gambarnya sederhana dan mengerikan sekaligus: sebuah keluarga \u2014 ayah, ibu, dan anak kecil \u2014 bergandengan tangan di bawah matahari yang tersenyum. Dan di belakang mereka, menjulang tinggi, sosok hitam legam dengan dua titik merah menyala sebagai matanya.", "Si penggambar menekan crayon merahnya begitu keras pada kedua titik itu sampai kertasnya sobek tepat di bagian mata si sosok \u2014 seolah anak itu berusaha menghapusnya dari dunia, dan gagal."], "storyEn": ["You hold your breath and force yourself to search the room first \u2014 slowly, like someone afraid of waking something up. The wooden desk is empty, except for the teddy bear sitting motionless on top of it. But as you crouch down, your eyes catch something tucked beneath the desk: a child's drawing on a sheet of paper, drawn in crayon.", "The drawing is simple and horrifying at once: a family \u2014 father, mother, and a small child \u2014 holding hands beneath a smiling sun. And behind them, towering, a pitch-black figure with two burning red dots for eyes.", "Whoever drew it pressed the red crayon so hard onto those two dots that the paper tore right through the figure's eyes \u2014 as if the child had tried to erase it from the world, and failed."], "kickerEn": "Part 1: The Beginning"}, "d4_b2": {"story": ["Kertas gambar itu terasa dingin di antara jarimu \u2014 dingin yang tidak wajar untuk selembar kertas yang tersimpan di ruangan pengap ini. Di atas meja, boneka beruang itu masih duduk diam. Menunggu."], "storyEn": ["The drawing feels cold between your fingers \u2014 unnaturally cold for a sheet of paper kept in this stuffy room. On the desk, the teddy bear still sits motionless. Waiting."], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Bawa bonekanya juga", "textEn": "Take the teddy bear too"}, {"text": "Ambil gambarnya saja, tinggalkan bonekanya", "textEn": "Take only the drawing, leave the bear"}, {"text": "Jangan sentuh apa pun", "textEn": "Touch nothing"}]}, "d4_draw": {"story": ["Kau mengambil gambar crayon itu dan melipatnya perlahan, hati-hati, seperti melipat sesuatu yang bisa pecah \u2014 lalu menyelipkannya ke dalam saku. Boneka beruangnya kau biarkan tetap duduk di atas meja.", "Saat kau berbalik menuju pintu, dari sudut matamu kau menangkap sesuatu \u2014 kau bersumpah kepala boneka itu kini sedikit miring. Mengikutimu dengan mata kancingnya yang mati.", "Kau tidak menoleh lagi. Tidak kali ini."], "storyEn": ["You pick up the crayon drawing and fold it slowly, carefully, like folding something that could shatter \u2014 then slip it into your pocket. You leave the teddy bear sitting on the desk.", "As you turn toward the door, from the corner of your eye you catch something \u2014 you swear the bear's head is now tilted slightly. Following you with its dead button eyes.", "You don't look back again. Not this time."], "tagEn": "[Safe]"}, "d4_c": {"story": ["Kau memutuskan untuk tidak menyentuh apa pun. Setiap helai nalurimu berteriak menyuruhmu menjauh.", "Kau melangkah mundur menuju pintu, tumit lebih dulu, mata tak lepas dari meja itu. Dan saat itulah kau mendengarnya \u2014 pelan, nyaris bukan suara:", "'...jangan pergi.'", "Suaranya seperti anak kecil \u2014 kecil, serak, dan terlalu dekat. Berasal dari... boneka itu? Atau bergema dari dalam kepalamu sendiri? Kau tidak berani memastikan.", "Kau menyelinap keluar dan menutup pintu rapat-rapat. Tanganmu gemetar hebat sampai gagang pintu terasa licin."], "storyEn": ["You decide to touch nothing. Every fiber of your instinct screams at you to stay away.", "You step backward toward the door, heel first, eyes never leaving that desk. And that's when you hear it \u2014 faint, barely a sound at all:", "'...don't go.'", "It sounds like a small child \u2014 small, hoarse, and far too close. Coming from... the bear? Or echoing from inside your own head? You don't dare find out.", "You slip out and pull the door firmly shut. Your hands are shaking so hard the doorknob feels slick."], "tagEn": "[Safe]"}, "d5_1": {"story": ["Kau mengabaikan pintu-pintu itu dan terus melangkah, menyusuri lorong sampai ke ujungnya yang gelap.", "Lampu-lampu neon di langit-langit berkedip makin cepat, memandikan lorong dalam cahaya putih yang patah-patah. Langkah kakimu bergema di lantai beton... dan kemudian kau menyadarinya: gemanya salah. Ada setengah ketukan tambahan yang menyelinap di antara langkah-langkahmu \u2014 seperti ada sesuatu yang berjalan bersamamu, selangkah di belakang, sedikit tidak selaras.", "Kau berhenti mendadak. Gema itu pun berhenti... setengah detik lebih lambat darimu.", "Di depan, deretan lampu berkedip liar seperti kesetanan \u2014 kecuali satu. Satu lampu menyala stabil, terang benderang, mengundang. Lingkaran cahayanya tampak hangat di tengah lorong yang dingin.", "Dan di bawah lampu yang stabil itu, kau melihat sesuatu yang membuat bulu kudukmu berdiri: lantainya bersih. Tidak ada debu, tidak ada puing, tidak ada jejak \u2014 padahal seluruh lorong ini kotor dan berantakan. Seolah petak lantai itu... dirawat. Atau sering ditunggu.", "Lalu ingatan itu menghantammu: tadi, saat bayangan besar itu melintas di kejauhan, setiap lampu yang dilewatinya berkedip liar \u2014 persis seperti ini."], "storyEn": ["You ignore those doors and keep walking, following the corridor all the way to its dark end.", "The fluorescent tubes overhead flicker faster and faster, bathing the corridor in broken white light. Your footsteps echo off the concrete floor... and then you notice it: the echo is wrong. An extra half-beat slips in between your steps \u2014 like something is walking with you, a pace behind, slightly out of sync.", "You stop abruptly. The echo stops too... half a second later than you.", "Ahead, the row of lamps flickers wildly like something possessed \u2014 except one. One lamp burns steady, bright, inviting. Its pool of light looks warm in the middle of the cold corridor.", "And beneath that steady lamp, you see something that raises the hairs on your neck: the floor is clean. No dust, no debris, no footprints \u2014 though the entire corridor is filthy and strewn with rubble. As if that patch of floor were... tended. Or often waited upon.", "Then the memory hits you: earlier, when that huge shadow passed in the distance, every lamp it crossed flickered wildly \u2014 exactly like this."], "kickerEn": "Part 1: The Beginning"}, "d5_1c": {"story": ["Gema langkah itu masih ada \u2014 setengah ketukan di belakangmu, sabar, tidak terburu-buru. Lampu yang stabil itu menunggu, cahayanya tak bergeming.", "Udara terasa lebih dingin di tengkukmu. Apa yang akan kau lakukan?"], "storyEn": ["That footstep echo is still there \u2014 half a beat behind you, patient, unhurried. The steady lamp waits, its light unwavering.", "The air feels colder on the back of your neck. What will you do?"], "kickerEn": "Part 1: The Beginning", "choices": [{"text": "Berlari menuju cahaya \u2014 terang berarti aman", "textEn": "Run toward the light \u2014 brightness means safety"}, {"text": "Menyelinap di antara kedipan lampu, tetap dalam bayangan", "textEn": "Slip between the lamp flickers, stay in the shadows", "condNote": "Butuh fokus \u2014 mental maksimal Gelisah", "condNoteEn": "Requires focus \u2014 mental at most Uneasy"}, {"text": "Berbalik \u2014 kembali ke persimpangan pintu", "textEn": "Turn back \u2014 return to the door junction"}]}, "d5_trap": {"story": ["Kau berlari menuju cahaya. Terang berarti aman \u2014 itu naluri, itu logika, itu yang diajarkan dunia padamu sejak kecil.", "Cahaya itu menyilaukan, membutakan \u2014 dan justru karena itulah kau tidak melihat kegelapan yang mengerumuninya. Di situlah ia berdiri, di jantung lingkaran terang itu.", "Sosok raksasa tanpa kepala. Lengan-lengannya \u2014 terlalu banyak untuk dihitung \u2014 menjuntai seperti dahan-dahan mati. Sebuah kapak besar terangkat tinggi di atas tempat yang seharusnya menjadi kepalanya.", "Lampu yang stabil itu bukan tempat yang aman. Itu tempatnya menunggu. Lampu-lampu lain berkedip liar karena ia lewat \u2014 dan yang satu ini menyala stabil karena ia tidak pernah pergi dari sana.", "Kapak itu turun. Kau bahkan tak sempat menyesal."], "storyEn": ["You run toward the light. Bright means safe \u2014 that's instinct, that's logic, that's what the world has taught you since childhood.", "The light is blinding \u2014 and precisely because of that, you don't see the darkness crowding around it. That's where it stands, at the heart of that circle of brightness.", "A giant headless figure. Its arms \u2014 too many to count \u2014 dangle like dead branches. A massive axe is raised high above where its head should be.", "That steady lamp was never a safe place. It was where it waits. The other lamps flicker wildly because it passes them \u2014 and this one burns steady because it never leaves.", "The axe comes down. You don't even get the chance to regret."]}, "d5_smart": {"story": ["Kau memaksa kakimu berhenti. Menarik napas pelan-pelan lewat hidung. Mengamati \u2014 benar-benar mengamati.", "Pola kedip lampu-lampu itu... tidak acak. Setiap beberapa detik, satu lampu berkedip liar \u2014 lalu berpindah ke lampu berikutnya, semakin dekat. Sesuatu sedang bergerak di lorong itu, melompat dari satu lampu ke lampu lain.", "Kau bergerak hanya saat lampu di depanmu padam di tengah kedipnya \u2014 berlari pendek menembus gelap, membeku dalam bayangan. Jantungmu menghantam tulang rusuk seperti ingin keluar, tapi kakimu tidak berhenti.", "Saat kau melewati lampu yang stabil itu, kau tidak menoleh sedikit pun. Kau sudah tahu apa yang menunggu di bawahnya.", "Lorong itu terbuka ke sebuah pertigaan. Kau berhasil \u2014 untuk kali ini."], "storyEn": ["You force your legs to stop. You breathe slowly through your nose. You watch \u2014 truly watch.", "The flicker pattern of those lamps... isn't random. Every few seconds, one lamp flickers wildly \u2014 then it shifts to the next lamp, drawing closer. Something is moving through that corridor, leaping from lamp to lamp.", "You move only when the lamp ahead of you dies mid-flicker \u2014 sprinting short bursts through the dark, freezing inside shadows. Your heart hammers against your ribs like it wants out, but your legs don't stop.", "As you pass beneath that steady lamp, you don't glance at it once. You already know what's waiting under it.", "The corridor opens into a three-way junction. You made it \u2014 this time."], "tagEn": "[Safe]"}, "d5_back": {"story": ["Kau berbalik \u2014 perlahan, menjaga bahumu tetap menghadap lorong, tanpa membelakangi kegelapan lebih lama dari yang perlu.", "Gema setengah ketukan itu mengikutimu beberapa langkah... lalu hilang. Begitu saja. Seolah ia tidak pernah ada.", "Kau tiba kembali di persimpangan pintu dengan napas memburu dan keringat dingin di pelipis. Setidaknya \u2014 setidaknya kau masih hidup."], "storyEn": ["You turn around \u2014 slowly, keeping your shoulders squared toward the corridor, without turning your back on the darkness longer than you must.", "That half-beat echo follows you for a few steps... then vanishes. Just like that. As if it had never been there.", "You reach the door junction again, breath ragged, cold sweat on your temples. At least \u2014 at least you're still alive."], "tagEn": "[Safe]"}, "hub_exit": {"story": ["Kau melangkah hati-hati hingga tiba di sebuah pertigaan lorong. Di tengahnya berdiri meja resepsionis tua yang nyaris hancur dimakan waktu \u2014 kayunya lapuk, salah satu kakinya patah sehingga meja itu miring menyedihkan. Di atasnya berserakan tumpukan kertas berdebu yang menguning, dan dari balik meja itu dua lorong lain membentang ke kiri dan ke kanan. Lorong kiri gelap gulita dan sunyi senyap seperti tenggorokan binatang buas, sementara dari ujung lorong kanan memancar secercah cahaya redup yang berdenyut pelan, seolah mengundangmu mendekat.", "Bulu kudukmu meremang. Tempat ini terasa salah \u2014 sangat salah \u2014 dan di suatu tempat di belakangmu, suara-suara aneh itu masih mengikutimu, berbisik di batas pendengaran."], "storyEn": ["You step carefully until you reach a three-way junction of corridors. In its center stands an old reception desk, nearly destroyed by time \u2014 its wood rotten, one leg broken so that it tilts pitifully. Dusty, yellowed stacks of paper lie scattered across it, and from behind the desk two more corridors stretch to the left and right. The left corridor is pitch black and silent as a beast's throat, while from the far end of the right corridor pulses a faint, throbbing glimmer of light, as if inviting you closer.", "The hairs on your neck stand up. This place feels wrong \u2014 deeply wrong \u2014 and somewhere behind you, those strange sounds are still following, whispering at the edge of hearing."], "kickerEn": "Part 1: The Beginning"}, "tbc": {}};

  for(const id of Object.keys(NODES_I18N)){

      if(!n.choices[i]) return;
      if(c.text) n.choices[i].text=c.text;

        if(c[k]!==undefined) n.choices[i][k]=c[k];

  const ACHV_I18N = {"wake_up": {"nameEn": "The Awakening", "descEn": "Your eyes opened \u2014 and this world was never the same.", "name": "Kebangkitan", "desc": "Matamu terbuka \u2014 dan dunia ini tidak lagi sama."}, "first_death": {"nameEn": "First Blood", "descEn": "The Darkness tasted you for the first time.", "name": "Darah Pertama", "desc": "Kegelapan mencicipimu untuk pertama kali."}, "five_deaths": {"nameEn": "Five Deaths", "descEn": "The Darkness is beginning to memorize your name.", "name": "Lima Kematian", "desc": "Kegelapan mulai menghafal namamu."}, "trap_victim": {"nameEn": "The Deceiving Light", "descEn": "You ran toward the light. The light ran toward you.", "name": "Terang yang Menipu", "desc": "Kau berlari menuju cahaya. Cahaya itu berlari ke arahmu."}, "smart_cross": {"nameEn": "The Cunning Shadow", "descEn": "You became one with the dark \u2014 and the dark let you pass.", "name": "Bayangan yang Cerdik", "desc": "Kau menjadi satu dengan gelap \u2014 dan gelap membiarkanmu lewat."}, "frozen": {"nameEn": "Stillness Is Life", "descEn": "It passed by. You did not breathe. You are still here.", "name": "Diam Adalah Hidup", "desc": "Ia lewat. Kau tidak bernapas. Kau masih di sini."}, "teddy_friend": {"nameEn": "A Friend in the Darkness", "descEn": "In a place with no one, you chose not to be alone.", "name": "Teman di Kegelapan", "desc": "Di tempat tanpa siapa pun, kau memilih untuk tidak sendirian."}, "teddy_dropped": {"nameEn": "No Need for Memories", "descEn": "Some things are better left behind.", "name": "Tak Butuh Kenangan", "desc": "Beberapa hal lebih baik ditinggalkan."}, "explorer": {"nameEn": "All Doors Open", "descEn": "Your curiosity outweighed your fear. For now.", "name": "Semua Pintu Terbuka", "desc": "Rasa ingin tahumu lebih besar dari rasa takutmu. Untuk saat ini."}, "wounded_heal": {"nameEn": "Filthy Remedy", "descEn": "You dressed your wound with whatever was at hand. It worked. Somehow.", "name": "Obat Kotor", "desc": "Kau membalut lukamu dengan apa yang ada. Itu berhasil. Entah bagaimana."}, "reader": {"nameEn": "The Unsent Letter", "descEn": "Someone's last words, finally read.", "name": "Surat yang Tak Terkirim", "desc": "Kata-kata terakhir seseorang, akhirnya dibaca."}, "empty_tank": {"nameEn": "Total Exhaustion", "descEn": "Your body gave up before your mind could.", "name": "Kelelahan Total", "desc": "Tubuhmu menyerah sebelum pikiranmu sempat."}, "dice_fate": {"nameEn": "Dice of Fate", "descEn": "When reason surrenders, fate takes over.", "name": "Dadu Takdir", "desc": "Ketika akal menyerah, nasib yang mengambil alih."}, "lemas_body": {"nameEn": "The Body Surrenders", "descEn": "Your legs no longer listen to you.", "name": "Tubuh Menyerah", "desc": "Kakimu tidak lagi mau mendengarkanmu."}};

  const DEX_I18N = {"roti_kering": {"nameEn": "Dried Bread", "descEn": "Three pieces of dried bread, still sealed in their plastic wrapper \u2014 hard, cold, and worth more than gold in a place like this."}, "surat_terlipat": {"nameEn": "Folded Letter", "descEn": "A letter that was never sent \u2014 its ink trembling: \u2018Forgive me. I can\u2019t come home. Don\u2019t look for me.\u2019"}, "perban_kotor": {"nameEn": "Dirty Bandage", "descEn": "A stained roll of bandage \u2014 filthy, but better than leaving a wound open."}, "cokelat": {"nameEn": "Chocolate Bar", "descEn": "A bar of chocolate, still sealed tight \u2014 slightly melted, but whole. A rare sweetness in a place like this."}, "boneka": {"nameEn": "Teddy Bear", "descEn": "A shabby teddy bear with button eyes, cold in your grip. Why are you carrying it? You don\u2019t know \u2014 but you can\u2019t let it go."}, "gambar_crayon": {"nameEn": "Crayon Drawing", "descEn": "A family drawn in crayon \u2014 father, mother, and child, smiling on paper yellowed at the edges."}};

  const TUTSTEPS_I18N = [{"t": "Selamat Datang di The Asylum", "h": "Kau adalah seorang <b>player</b> yang terbangun di dalam sebuah cerita \u2014 dan cerita ini tidak akan menunggumu siap.<br><br>Tujuanmu hanya satu: <b>bertahan hidup</b>. Setiap pilihan adalah takdir yang harus kau jalani sampai akhir. Tidak ada tombol kembali. Tidak ada kesempatan kedua.", "tEn": "Welcome to The Asylum", "hEn": "You are a <b>player</b> who has awakened inside a story \u2014 and this story will not wait for you to be ready.<br><br>Your goal is only one: <b>survive</b>. Every choice is a fate you must live out to the end. There is no back button. No second chances."}, {"t": "Membaca Situasi dengan Teliti", "h": "Setiap adegan ditulis sebagai <b>teks cerita</b> \u2014 bacalah dengan teliti, karena di tempat ini, petunjuk sering bersembunyi di antara detail yang paling kecil dan paling sepele.<br><br><b>Arti warna teks:</b><br>\u2022 <span class=\"c-gray\">Teks <b>abu-abu</b> adalah teks cerita.</span><br>\u2022 <span class=\"c-white\">Teks <b>putih</b> adalah teks pilihan/option.</span><br>\u2022 <span class=\"c-green\">Teks <b>hijau</b> berarti hasil pilihanmu aman dan baik.</span><br>\u2022 <span class=\"c-yellow\">Teks <b>kuning</b> berarti hasil pilihanmu membawamu dalam bahaya.</span><br>\u2022 <span class=\"c-red\">Teks <b>merah</b> berarti pilihan itu berakhir pada dead end \u2014 kematian.</span><br>\u2022 <span class=\"c-black\">Teks <b class='c-black'>hitam</b> adalah kejadian langka dan spesial.</span>", "tEn": "Reading the Situation", "hEn": "Every scene is written as <b>story text</b> \u2014 read it carefully, because in this place, clues often hide among the smallest, most trivial details.<br><br><b>Text color meanings:</b><br>\u2022 <span class=\"c-gray\"><b>Gray</b> text is story text.</span><br>\u2022 <span class=\"c-white\"><b>White</b> text is choice/option text.</span><br>\u2022 <span class=\"c-green\"><b>Green</b> text means your choice's outcome is safe and good.</span><br>\u2022 <span class=\"c-yellow\"><b>Yellow</b> text means your choice's outcome puts you in danger.</span><br>\u2022 <span class=\"c-red\"><b>Red</b> text means the choice ends in a dead end \u2014 death.</span><br>\u2022 <span class=\"c-black\"><b class='c-black'>Black</b> text is a rare, special occurrence.</span>"}, {"t": "Memilih Tindakan", "h": "Setiap pilihan membuka <b>jalan cerita yang berbeda</b> \u2014 dan tidak semua jalan kembali. Pilihlah dengan cermat, karena beberapa pilihan menyimpan risiko yang tidak terlihat di awal, menunggu seperti jebakan dalam gelap.<br><br>Kadang muncul momen khusus bertanda <span class=\"tag c-white\">[Pilihan!]</span>: di sanalah ceritamu berlanjut mengikuti kehendakmu sendiri.", "tEn": "Making Your Choice", "hEn": "Every choice opens a <b>different story path</b> \u2014 and not every path leads back. Choose carefully, because some choices hide risks unseen at first, waiting like traps in the dark.<br><br>Sometimes a special moment marked <span class=\"tag c-white\">[Choose!]</span> appears: there, your story continues following your own will."}, {"t": "Kondisimu", "h": "Awasi layar statusmu seperti nyawamu bergantung padanya \u2014 karena memang begitu:<br>\u2022 <b>Situasi</b> \u2014 <i>Aman</i>, <span class=\"tag c-yellow\">[Dalam bahaya]</span>, atau <span class=\"tag\" style=\"color:#fb923c\">[Terluka]</span> (beberapa pilihan akan terkunci).<br>\u2022 <b>Kondisi Mental</b> \u2014 <i>Tenang \u2192 Hancur</i>. Bisa memburuk, <i>dan</i> bisa pulih kembali.<br>\u2022 <b>\u26a1 Energi</b> \u2014 setiap pilihan mengurasnya. Makanlah untuk memulihkan.<br><br>Detail tiap sistem akan <b>dijelaskan saat pertama kali muncul</b> \u2014 tidak perlu menghafal apa pun sekarang.", "tEn": "Your Condition", "hEn": "Watch your status screen like your life depends on it \u2014 because it does:<br>\u2022 <b>Situation</b> \u2014 <i>Safe</i>, <span class=\"tag c-yellow\">[In danger]</span>, or <span class=\"tag\" style=\"color:#fb923c\">[Wounded]</span> (some choices will be locked).<br>\u2022 <b>Mental State</b> \u2014 <i>Calm \u2192 Shattered</i>. It can worsen, <i>and</i> it can recover.<br>\u2022 <b>\u26a1 Energy</b> \u2014 every choice drains it. Eat to restore it.<br><br>Each system's details will be <b>explained when it first appears</b> \u2014 no need to memorize anything now."}, {"t": "Tas & Item", "h": "Pilihanmu bisa memberimu <b>item</b> \u2014 masing-masing dengan <b>ikonnya sendiri</b> di dalam tasmu \ud83c\udf92. Jangan remehkan barang sekecil apa pun; di sini, benda mati bisa berarti hidup atau mati.<br><br>Beberapa item bisa <b>dipakai langsung</b> dari tas (makanan, perban...). Kau akan diberi tahu setiap kali mendapatkannya.", "tEn": "Bag & Items", "hEn": "Your choices can grant you <b>items</b> \u2014 each with <b>its own icon</b> in your bag \ud83c\udf92. Never underestimate even the smallest object; here, a lifeless thing can mean life or death.<br><br>Some items can be <b>used directly</b> from the bag (food, bandages...). You will be notified whenever you receive one."}, {"t": "Perlengkapan", "h": "<b>PERLENGKAPAN</b> berbeda dengan <b>inventori</b>: senjata dan perlengkapan khusus harus di-<b>EQUIP</b> dulu agar benar-benar bisa dipakai \u2014 kelolalah lewat tasmu \ud83c\udf92.<br><br>Beberapa pilihan hanya bisa dilewati jika perlengkapan yang tepat sudah <b>terpasang</b> di tubuhmu.", "tEn": "Equipment", "hEn": "<b>EQUIPMENT</b> is different from <b>inventory</b>: weapons and special gear must be <b>EQUIPPED</b> before they can actually be used \u2014 manage them through your bag \ud83c\udf92.<br><br>Some choices can only be passed if the right equipment is <b>equipped</b> on you."}, {"t": "Kematian & Progres", "h": "Pilihan yang berakhir <b>Tewas</b> berarti kau gagal \u2014 tapi sebagai <b>\"Player\"</b>, kau bisa <b>bangkit di tempat</b>, tepat di mana kau jatuh. Setiap kematian menaikkan <b>Death Count</b> yang menggantung di atas kepalamu; jagalah angka itu tetap rendah, karena ia menentukan <b>\"Akhir\"</b> seperti apa yang menunggumu.<br><br>Progresmu tersimpan otomatis di perangkatmu. Kau juga bisa <b>export/import</b> save sebagai file.", "tEn": "Death & Progress", "hEn": "A choice that ends in <b>Death</b> means you failed \u2014 but as a <b>\"Player\"</b>, you can <b>rise again on the spot</b>, exactly where you fell. Every death raises the <b>Death Count</b> hanging above your head; keep that number low, because it determines what kind of <b>\"Ending\"</b> awaits you.<br><br>Your progress is saved automatically on your device. You can also <b>export/import</b> your save as a file."}];
  TUT_STEPS.forEach((st,i)=>{ const o=TUTSTEPS_I18N[i]; if(o) Object.assign(st,o); });
  const TUTPOP_I18N = {"energy_brief": {"t": "\u26a1 ENERGI \u2014 BACA DULU, INI PENTING", "h": "Setiap pilihan yang kau ambil menguras <b>4 Energi</b> \u2014 perhatikan angka <b>-4 \u26a1</b> yang melayang setiap kali kau memilih.<br><br>\u2022 Beberapa pilihan <b>menuntut energimu cukup</b>. Terlalu lelah? Pilihan itu terkunci rapat.<br>\u2022 <b>Makin rendah energimu, makin rentan kau terhadap bahaya.</b> Kalau pilihanmu berujung buruk dan kau harus <b>lari</b>... kakimu tak akan sanggup.<br>\u2022 <b>Gunakan energimu dengan bijak.</b> Tidak semua tempat bisa kau jelajahi sekaligus \u2014 kadang ada isinya, kadang hanya lorong kosong. Pilihlah dengan cermat.<br><br>Lapar? Buka tas \ud83c\udf92, tekan <b>PAKAI</b> pada makanan untuk memulihkan energi.<br><br>⚠️ Energi di bawah <b>40</b>? Tiap pilihan bisa membuatmu <b>pingsan</b> — dan kau bisa bangun dalam keadaan <b>dibunuh, kecurian, atau terluka</b>.<br><br>💤 Tombol <b>REST</b> di pojok kanan bawah memulihkan <b>30</b> energi (cooldown 10 pilihan) — memaksakannya saat cooldown mengundang <b>serangan</b>.", "tEn": "\u26a1 ENERGY \u2014 READ THIS FIRST, IT MATTERS", "hEn": "Every choice you make drains <b>4 Energy</b> \u2014 watch for the floating <b>-4 \u26a1</b> each time you choose.<br><br>\u2022 Some choices <b>demand enough energy</b>. Too exhausted? That choice stays locked.<br>\u2022 <b>The lower your energy, the more vulnerable you are to danger.</b> If your choice goes wrong and you have to <b>run</b>... your legs won't carry you.<br>\u2022 <b>Spend your energy wisely.</b> You can't explore everywhere at once \u2014 sometimes there's something there, sometimes only an empty corridor. Choose carefully.<br><br>Hungry? Open your bag \ud83c\udf92 and press <b>USE</b> on food to restore energy.<br><br>⚠️ Energy below <b>40</b>? Every choice risks <b>blackout</b> — and you may wake up <b>killed, robbed, or wounded</b>.<br><br>💤 The <b>REST</b> button at the bottom-right restores <b>30</b> energy (10-choice cooldown) — forcing it during cooldown invites <b>attack</b>."}, "tier": {"t": "\ud83d\udcca EFEK BERTINGKAT", "h": "Efek seperti <b>Stress</b>, <b>Keracunan</b>, dan <b>Kelelahan</b> memiliki 4 tingkat: <i>Ringan \u2192 Sedang \u2192 Tinggi \u2192 Ekstrim</i>. Pilihan-pilihanmu bisa menaikkan atau menurunkannya satu tingkat.<br><br>Hati-hati di tingkat <b>Ekstrim</b>: Kelelahan Ekstrim membuatmu <b>Lemas</b> (setara Terluka), dan Stress Ekstrim membuat pilihanmu <b>ditentukan dadu</b> \u2014 bukan olehmu!", "tEn": "\ud83d\udcca TIERED EFFECTS", "hEn": "Effects like <b>Stress</b>, <b>Poisoning</b>, and <b>Fatigue</b> have 4 tiers: <i>Mild \u2192 Moderate \u2192 Severe \u2192 Extreme</i>. Your choices can raise or lower them by one tier.<br><br>Beware the <b>Extreme</b> tier: Extreme Fatigue leaves you <b>Limp</b> (equal to Wounded), and Extreme Stress lets <b>the dice decide your choices</b> \u2014 not you!"}, "energy": {"t": "\u26a1 ENERGI", "h": "Setiap pilihan menguras <b>4 Energi</b> \u2014 perhatikan angka yang melayang. Lapar? Buka tas \ud83c\udf92 lalu tekan <b>PAKAI</b> pada makanan untuk memulihkan.<br><br>Energi habis total? Setiap pilihan akan menaikkan Kelelahan \u2014 dan saat menyentuh 0, kau <b>dipaksa mengikuti jalan termudah</b>, suka atau tidak.<br><br>⚠️ Energi di bawah <b>40</b>? Tiap pilihan bisa membuatmu <b>pingsan</b> — dan kau bisa bangun dalam keadaan <b>dibunuh, kecurian, atau terluka</b>.<br><br>💤 Tombol <b>REST</b> di pojok kanan bawah memulihkan <b>30</b> energi (cooldown 10 pilihan) — memaksakannya saat cooldown mengundang <b>serangan</b>.", "tEn": "\u26a1 ENERGY", "hEn": "Every choice drains <b>4 Energy</b> \u2014 watch the floating numbers. Hungry? Open your bag \ud83c\udf92 and press <b>USE</b> on food to recover.<br><br>Energy fully depleted? Every choice will raise Fatigue \u2014 and at 0, you are <b>forced down the easiest path</b>, like it or not.<br><br>⚠️ Energy below <b>40</b>? Every choice risks <b>blackout</b> — and you may wake up <b>killed, robbed, or wounded</b>.<br><br>💤 The <b>REST</b> button at the bottom-right restores <b>30</b> energy (10-choice cooldown) — forcing it during cooldown invites <b>attack</b>."}, "emotion": {"t": "\ud83d\udcad EMOSI", "h": "Perasaan sesaat \u2014 <b>Takut</b>, <b>Lega</b>, <b>Sedih</b> \u2014 lahir dari kejadian-kejadian dan memudar seiring waktu.<br><br>Saat kau <b>goyah</b> (Panik, atau Takut yang tinggi), pilihan-pilihan yang membutuhkan ketenangan akan terkunci.", "tEn": "\ud83d\udcad EMOTION", "hEn": "Fleeting feelings \u2014 <b>Fear</b>, <b>Relief</b>, <b>Sorrow</b> \u2014 are born from events and fade with time.<br><br>When you are <b>shaken</b> (Panicked, or high Fear), choices that require calm will be locked."}, "wounded": {"t": "\ud83e\ude78 TERLUKA", "h": "Kau <b>Terluka</b> \u2014 beberapa pilihan kini terkunci untukmu.<br><br>Tidak ada yang akan menyembuhkanmu dengan sendirinya di tempat ini. Buka tas \ud83c\udf92 dan tekan <b>PAKAI</b> pada perban \u2014 atau tanggung sendiri lukamu.", "tEn": "\ud83e\ude78 WOUNDED", "hEn": "You are <b>Wounded</b> \u2014 several choices are now locked to you.<br><br>Nothing here will heal you on its own. Open your bag \ud83c\udf92 and press <b>USE</b> on a bandage \u2014 or bear the wound yourself."}, "condchoice": {"t": "\ud83d\udd00 PILIHAN BERSYARAT", "h": "Nomor boleh sama, <b>hasil bisa beda</b> \u2014 tergantung kondisimu saat memilih: terluka? panik? kelelahan?<br><br>Selalu periksa statusmu sebelum memilih. Pilihan semacam ini ditandai secara khusus.", "tEn": "\ud83d\udd00 CONDITIONAL CHOICES", "hEn": "Same number, <b>different outcome</b> \u2014 depending on your condition when you choose: wounded? panicked? exhausted?<br><br>Always check your status before choosing. Choices like this are specially marked."}, "input": {"t": "\u2328\ufe0f TEKA-TEKI", "h": "Ketik jawabanmu pada kolom yang tersedia.<br><br>Ingat: jawaban yang salah <b>ada konsekuensinya</b> \u2014 berpikirlah baik-baik sebelum menekan kirim.", "tEn": "\u2328\ufe0f RIDDLE", "hEn": "Type your answer into the field provided.<br><br>Remember: a wrong answer <b>has consequences</b> \u2014 think carefully before you submit."}, "keypad": {"t": "\ud83d\udd22 PANEL ANGKA", "h": "Masukkan kode yang benar melalui tombol-tombol angka.<br><br>Terlalu banyak kesalahan akan <b>berakibat fatal</b>. Jangan asal tebak.", "tEn": "\ud83d\udd22 KEYPAD", "hEn": "Enter the correct code using the number buttons.<br><br>Too many wrong attempts will be <b>fatal</b>. Don't guess blindly."}, "objective": {"t": "\ud83c\udfaf OBJECTIVE", "h": "Tujuan barumu telah tercatat di <b>layar status</b>.<br><br>Selesaikan \u2014 kalau kau ingin tetap hidup.", "tEn": "\ud83c\udfaf OBJECTIVE", "hEn": "Your new objective has been recorded on the <b>status screen</b>.<br><br>Complete it \u2014 if you want to stay alive."}, "favor": {"t": "\ud83d\udc9e HUBUNGAN", "h": "Tindakan-tindakanmu mengubah cara seseorang memandangmu \u2014 tercatat di layar status.<br><br>Hubungan bisa menjadi kunci keselamatan... atau jerat yang manis.", "tEn": "\ud83d\udc9e FAVOR", "hEn": "Your actions change how someone sees you \u2014 recorded on the status screen.<br><br>Favor can be a key to safety... or a sweet trap."}, "temp": {"t": "\u23f3 EFEK SEMENTARA", "h": "Efek ini hanya bertahan <b>beberapa adegan</b>, lalu menghilang dengan sendirinya.<br><br>Manfaatkan waktunya selagi ada.", "tEn": "\u23f3 TEMPORARY EFFECT", "hEn": "This effect lasts only <b>a few scenes</b>, then fades on its own.<br><br>Make use of it while it lasts."}, "lemas": {"t": "\ud83e\udd40 LEMAS", "h": "Kelelahanmu telah mencapai <b>Ekstrim</b>. Tubuhmu lemas tak bertenaga \u2014 setara <b>Terluka</b>: pilihan-pilihan fisik terkunci.<br><br>Makan dan beristirahatlah sebelum melanjutkan.", "tEn": "\ud83e\udd40 LIMP", "hEn": "Your fatigue has reached <b>Extreme</b>. Your body is limp and powerless \u2014 equal to <b>Wounded</b>: physical choices are locked.<br><br>Eat and rest before going on."}, "bingung": {"t": "\ud83c\udfb2 KEBINGUNGAN AKUT", "h": "Stress-mu mencapai <b>Ekstrim</b>!<br><br>Pilihanmu berikutnya <b>ditentukan oleh dadu</b>, bukan olehmu. Tenangkan dirimu \u2014 cepat.", "tEn": "\ud83c\udfb2 ACUTE CONFUSION", "hEn": "Your stress has reached <b>Extreme</b>!<br><br>Your next choice will be <b>decided by the dice</b>, not by you. Calm yourself \u2014 quickly."}, "usable": {"t": "\ud83c\udf92 PAKAI ITEM", "h": "Item ini bisa <b>dipakai langsung dari tas</b>: makanan, perban, dan lainnya.<br><br>Buka \ud83c\udf92 kapan saja dan tekan <b>PAKAI</b>. Kelola sumber dayamu baik-baik \u2014 tidak ada yang gratis di tempat ini.", "tEn": "\ud83c\udf92 USE ITEMS", "hEn": "This item can be <b>used straight from your bag</b>: food, bandages, and more.<br><br>Open \ud83c\udf92 anytime and press <b>USE</b>. Manage your resources well \u2014 nothing is free in this place."}};

  const REACTIONS_I18N = {"death": {"text": ["Kegelapan menelanmu bulat-bulat. Namun sebagai \"Player\", kau bangkit kembali \u2014 Death Count: {deathCount}.", "Kau tewas. Kegelapan melepaskanmu \u2014 dengan harga: Death Count {deathCount}."], "textEn": ["The Darkness swallows you whole. But as a \"Player\", you rise again \u2014 Death Count: {deathCount}.", "You died. The Darkness releases you \u2014 for a price: Death Count {deathCount}."]}, "status_danger": {"text": ["Hawa di sekitarmu berubah \u2014 kau dalam bahaya.", "Sesuatu sedang mengawasimu. Bahaya mengintai dekat."], "textEn": ["The air around you shifts \u2014 you are in danger.", "Something is watching you. Danger lurks close."]}, "status_wounded": {"text": ["Tubuhmu terluka. Beberapa pilihan tak bisa kau ambil.", "Luka itu membatasi setiap gerakanmu."], "textEn": ["Your body is wounded. Some choices are beyond your reach.", "The wound limits your every move."]}, "status_safe": {"text": ["Kau bisa bernapas lega... untuk sekarang."], "textEn": ["You can breathe easy... for now."]}, "mental_worse": {"text": ["Kegelisahan merayap di benakmu. ({label})", "Pikiranmu kian gelap. ({label})"], "textEn": ["Unease creeps through your mind. ({label})", "Your thoughts grow darker. ({label})"]}, "mental_better": {"text": ["Ketenangan kembali menyelimutimu. ({label})"], "textEn": ["Calm settles over you once more. ({label})"]}, "item_gained": {"text": ["Kau mendapatkan: {name}.", "Sesuatu kini tersimpan di tasmu: {name}."], "textEn": ["You obtained: {name}.", "Something now rests in your bag: {name}."]}, "item_lost": {"text": ["Kehilangan: {name}."], "textEn": ["Lost: {name}."]}, "equipment_equipped": {"text": ["{name} terpasang di {slotName}."], "textEn": ["{name} equipped to {slotName}."]}, "equipment_unequipped": {"text": ["{name} dilepas dari {slotName}."], "textEn": ["{name} unequipped from {slotName}."]}, "effect_started": {"text": ["Efek baru menyelimutimu: {effect}."], "textEn": ["A new effect takes hold of (function init(){
  applyStaticLang();
  try{
    if(globalThis.AudioSys){
      AudioSys.init();
      const mb = document.getElementById("muteBtn");
      const syncMute = ()=>{ if(mb) mb.textContent = AudioSys.isMuted() ? "🔇" : "🔊"; };
      if(mb) mb.addEventListener("click", ev=>{ ev.stopPropagation(); AudioSys.toggleMute(); syncMute(); });
      const rb2 = document.getElementById("restBtn");
      if(rb2) rb2.addEventListener("click", ev=>{ ev.stopPropagation(); doRest(); });
      syncMute();
      document.addEventListener("click", ev=>{
        if(ev.target && ev.target.closest && ev.target.closest("button") && ev.target.id!=="muteBtn")
          AudioSys.sfx("ui_click");
      });
    }
  }catch(e){}
  const sv = loadSave();
  if(sv && sv.registered) showTitle(); /* pemain kembali → judul (LANJUTKAN) */
  else goTarget("prolog1");            /* buka website → prolog → judul */
})();
</script>
