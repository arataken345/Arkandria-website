;(function(){
const DIFF_NODES = {"d5_1c_g1": {"id": "d5_1c_g1", "kind": "result", "next": "d5_1c", "setStatus": "danger", "status": "danger", "story": ["Kau berbalik, menantang kegelapan di belakangmu, dan berjalan lurus menghampiri gema langkah itu — lebih baik menghadapinya sekarang daripada terus diburu.", "Saat kau melangkah, gema itu berhenti — seolah ia pun berhenti berjalan. Udara di tengkukmu tiba-tiba menjadi sedingin es, dan kau menyadari dengan ngeri bahwa jarak di antara kalian kini tinggal selebar napas. Kau mundur perlahan ke bawah cahaya yang berkedip, jantung berdebar kencang, dan langkah itu… menunggu."], "storyEn": ["You turn, defying the darkness behind you, and walk straight toward the echoing footsteps — better to face it now than to be hunted any longer.", "As you step forward, the echo stops — as if it too has stopped walking. The air at the nape of your neck turns suddenly ice-cold, and you realize with horror that the distance between you is now no wider than a breath. You back away slowly into the flickering light, heart pounding, and the footsteps… wait."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d5_1c_w1": {"id": "d5_1c_w1", "kind": "result", "next": "d5_1c", "setBody": "Punggung Tergores", "setStatus": "wounded", "status": "danger", "story": ["“Siapa di sana?!” teriakmu, suaramu pecah memantul di dinding-dinding yang lembap.", "Gema langkah itu berhenti seketika. Keheningan total turun — lalu sesuatu yang dingin dan tajam menyambar punggungmu, mencakar dari bahu hingga pinggang. Kau terhuyung maju dengan napas tercekat, dan langkah itu kembali terdengar — kini tepat di belakang lehermu."], "storyEn": ["“Who's there?!” you shout, your voice cracking as it bounces off the damp walls.", "The echoing footsteps stop at once. Total silence falls — then something cold and sharp slashes across your back, raking from shoulder to hip. You stumble forward, breath caught in your throat, and the footsteps return — now right behind your neck."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "opening_d1": {"id": "opening_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "opening", "story": ["Kau melangkah mendekati kegelapan di ujung lorong, terpikat oleh suara itu — suara yang terdengar seperti ibumu, memanggil namamu dengan lembut, persis seperti dulu saat kau masih kecil.", "Kegelapan menelanmu dalam sekali tegukan. Dingin yang menusuk tulang merayap dari pergelangan kakimu ke atas, dan hal terakhir yang kau dengar adalah suara itu — kini tepat di telingamu — berbisik bahwa kau akhirnya pulang."], "storyEn": ["You step toward the darkness at the corridor's end, lured by that voice — it sounds like your mother's, calling your name so gently, exactly as it did when you were small.", "The darkness swallows you in a single gulp. Bone-piercing cold crawls upward from your ankles, and the last thing you hear is that voice — now right at your ear — whispering that you have finally come home."]}, "d1_a2_d1": {"id": "d1_a2_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "opening", "story": ["Kau menunduk, menempelkan matamu ke lubang kunci yang dingin. Gelap. Lalu bentuk-bentuk mulai terlihat — ruangan, meja, dan...", "...sebuah mata. Tepat di sisi lain lubang kunci. Menatap balik ke arahmu. Terlalu besar untuk menjadi mata manusia, pupilnya melebar seperti menelan cahaya.", "Sebelum kau sempat mundur, sesuatu yang tajam dan dingin melesat keluar dari lubang kunci. Dunia menjadi merah, lalu hitam. Kesalahan terakhirmu adalah mengira kaulah yang sedang mengintip."], "storyEn": ["You crouch, pressing your eye to the cold keyhole. Darkness. Then shapes begin to emerge — a room, a table, and...", "...an eye. Right on the other side of the keyhole. Staring back at you. Too large to be a human eye, its pupil dilating as if swallowing the light.", "Before you can pull away, something sharp and cold shoots out through the keyhole. The world turns red, then black. Your final mistake was thinking you were the one doing the watching."]}, "d1_b2_w1": {"id": "d1_b2_w1", "kind": "result", "next": "d1_hub", "setBody": "Jari-jarimu berdarah dan berdenyut nyeri.", "setStatus": "wounded", "status": "danger", "story": ["Celahnya cukup lebar untuk dua jari. Udara yang keluar terasa hangat — salah, hangat seperti napas.", "Lalu celah itu menyempit. Bukan karena angin. Sesuatu menekan dari dalam, dan ujung jarimu terjepit di antara dua permukaan kayu yang tiba-tiba terasa seperti rahang.", "Kau menarik tanganmu dengan paksa. Kulit jarimu terkelupas, darah menetes ke lantai. Dari dalam celah, terdengar suara mengendus — pelan, puas, seperti binatang yang baru saja mencicipi."], "storyEn": ["The crack is wide enough for two fingers. The air coming through feels warm — wrong, warm like breath.", "Then the crack narrows. Not from wind. Something presses from inside, and your fingertips are caught between two wooden surfaces that suddenly feel like jaws.", "You yank your hand free. The skin of your fingers is torn, blood dripping to the floor. From inside the crack comes a sniffing sound — slow, satisfied, like a beast that has just had a taste."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "d1_c2_g1": {"id": "d1_c2_g1", "kind": "result", "next": "d1_hub", "setStatus": "danger", "status": "danger", "story": ["Kau menahan napas. Lorong itu sunyi — sampai kau menyadarinya: sunyi yang salah. Bahkan tetesan air yang tadi terdengar kini berhenti.", "Dari dalam ruangan, terdengar langkah. Pelan. Menyeret. Mendekat ke pintu. Berhenti tepat di sisi lain, begitu dekat hingga kau bisa mendengar napasnya melalui celah bawah pintu.", "Kau mundur perlahan, punggung menempel dinding lorong. Langkah itu tidak mengikutimu — tapi kau tahu ia mendengarkan. Menunggu. Menghitung. Malam ini, kau diburu."], "storyEn": ["You hold your breath. The corridor is silent — until you realize: it is the wrong kind of silence. Even the dripping water you heard before has stopped.", "From inside the room come footsteps. Slow. Dragging. Approaching the door. Stopping right on the other side, so close you can hear its breathing through the gap beneath the door.", "You back away slowly, your spine against the corridor wall. The footsteps do not follow — but you know it is listening. Waiting. Counting. Tonight, you are being hunted."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d1_hub_d1": {"id": "d1_hub_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "opening", "story": ["Dinginnya logam merambat ke telapak tanganmu — lalu, tanpa peringatan, gagang itu bergerak sendiri. Bukan berputar. Ditarik. Dari dalam.", "Jari-jarimu terjepit di antara gagang dan kusen saat pintu tersentak. Kau mendengar sesuatu di sisi lain — napas yang terlalu dekat, terlalu bersemangat, seperti seseorang yang sudah lama menunggu ada yang menyentuh pintunya.", "Pintu terbuka selebar telapak tangan. Cukup untuk melihat mata itu. Cukup untuk tangan pucat itu menyambar pergelanganmu dan menarikmu masuk ke dalam kegelapan. Engsel berkarat itu bahkan tidak sempat berderit."], "storyEn": ["The metal's cold seeps into your palm — then, without warning, the handle moves on its own. Not turning. Pulled. From inside.", "Your fingers are caught between the handle and the frame as the door jerks. You hear something on the other side — breath too close, too eager, like someone who has waited a long time for anyone to touch their door.", "The door opens a palm's width. Enough to see that eye. Enough for that pale hand to seize your wrist and drag you into the darkness. The rusted hinges don't even have time to creak."]}, "d1_hub_g1": {"id": "d1_hub_g1", "kind": "result", "next": "d1_hub", "setStatus": "danger", "status": "danger", "story": ["Tok. Tok. Tok. Suaramu sendiri terdengar terlalu keras di lorong yang sepi ini.", "Hening. Lalu — tok. Dari dalam. Balasannya persis tiga kali, dengan jeda yang sama. Terlalu sama. Seolah meniru, bukan menjawab.", "Lalu terdengar suara cakaran — pelan, panjang, dari bawah ke atas, seolah sesuatu yang tinggi sedang meregangkan kukunya di sisi lain kayu. Kau mundur selangkah. Lalu selangkah lagi. Apa pun yang ada di dalam itu sekarang tahu kau ada di sini."], "storyEn": ["Knock. Knock. Knock. Your own sound is too loud in this silent corridor.", "Silence. Then — knock. From inside. The reply comes exactly three times, with the same pauses. Too identical. As if mimicking, not answering.", "Then comes a scratching sound — slow, long, bottom to top, as though something tall is stretching its claws on the other side of the wood. You step back. Then another step. Whatever is in there now knows you are here."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d1_room_d1": {"id": "d1_room_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "d1_room", "story": ["Plastiknya robek dengan mudah. Roti di dalamnya masih lembut — mustahil lembut, setelah bertahun-tahun. Seharusnya sudah menjadi batu. Seharusnya sudah berjamur.", "Gigitan pertama terasa manis. Terlalu manis. Gigitan kedua, tenggorokanmu mulai terbakar. Kau melihat ke bawah — ke noda gelap di lantai — dan akhirnya kau mengerti bentuknya: tubuh yang meringkuk, tangan terulur ke arah bungkusan yang sama persis.", "Orang terakhir yang memakannya mati dalam posisi itu. Racunnya bekerja cepat. Pandanganmu menggelap sementara di sudut ruangan, sesuatu bergeser — puas, menunggu korban berikutnya yang lapar."], "storyEn": ["The plastic tears easily. The bread inside is still soft — impossibly soft, after all these years. It should have turned to stone. It should have grown mold.", "The first bite tastes sweet. Too sweet. On the second bite, your throat begins to burn. You look down — at the dark stain on the floor — and finally you understand its shape: a curled body, a hand outstretched toward the exact same package.", "The last person who ate it died in that position. The poison works fast. Your vision darkens while in the room's corner, something shifts — satisfied, waiting for the next hungry victim."]}, "d1_room_g1": {"id": "d1_room_g1", "kind": "result", "next": "d1_room", "setStatus": "danger", "status": "danger", "story": ["Noda itu tidak berhenti di tengah lantai. Ia berlanjut — garis tipis dan gelap merayap menuju sudut paling gelap ruangan, menghilang di bawah lemari yang miring.", "Kau berjongkok, mendekat. Dari bawah lemari, kau mendengar sesuatu: napas. Dalam, lambat, berirama — seperti sesuatu yang tidur tepat di bawah sana, tepat di bawah noda yang meresap ke beton.", "Kayu lemari itu bergetar pelan. Sekali. Kau berdiri dan mundur ke tengah ruangan, jantung berdebar. Apa pun yang tidur di sana baru saja bermimpi — dan dalam mimpinya, ia mencium baumu."], "storyEn": ["The stain does not stop in the middle of the floor. It continues — a thin dark line creeping toward the darkest corner of the room, vanishing beneath a leaning cabinet.", "You crouch, drawing closer. From beneath the cabinet, you hear something: breathing. Deep, slow, rhythmic — like something sleeping right down there, right beneath the stain soaked into the concrete.", "The cabinet's wood trembles faintly. Once. You stand and retreat to the middle of the room, heart pounding. Whatever sleeps there has just been dreaming — and in its dream, it caught your scent."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d1_stain2_w1": {"id": "d1_stain2_w1", "kind": "result", "next": "d1_room", "setBody": "Jari-jarimu melepuh dan berdenyut nyeri.", "setStatus": "wounded", "status": "danger", "story": ["Permukaannya terlihat kering. Ternyata tidak. Ujung jarimu tenggelam setengah senti ke dalam sesuatu yang kental, dingin, dan sedikit berdenyut.", "Rasa panas menyengat naik dari kulitmu seperti disiram air mendidih. Kau menarik tanganmu — noda itu menempel, meregang seperti selaput, enggan melepaskanmu.", "Dengan paksa kau menyentakkannya lepas. Kulit jarimu memerah dan melepuh. Dan di lantai, noda itu... bergerak. Sedikit. Merayap satu senti lebih dekat ke arah sepatumu."], "storyEn": ["The surface looks dry. It is not. Your fingertip sinks half a centimeter into something thick, cold, and faintly pulsing.", "A searing heat climbs up your skin as if scalded by boiling water. You pull your hand back — the stain clings, stretching like a membrane, unwilling to let go.", "You wrench it free by force. The skin of your fingers reddens and blisters. And on the floor, the stain... moves. Slightly. Creeping one centimeter closer to your shoe."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "d2_a2_g1": {"id": "d2_a2_g1", "kind": "result", "next": "d2_a2", "setStatus": "danger", "status": "danger", "story": ["Suaramu menggema pelan di ruangan yang gelap — lalu mati ditelan keheningan. Tidak ada jawaban. Kau hampir berbalik ketika...", "...sesuatu menjawab. Bukan suara manusia. Bunyi kerikil yang sama seperti tadi — klik, klik, klik — tapi kini terdengar lebih dekat, seolah benda itu bergerak ke arahmu, mengikuti suaramu.", "Darahmu berdesir dingin. Kau mundur selangkah, lalu selangkah lagi, jantung berdegup kencang. Apa pun yang ada di dalam sana kini tahu persis di mana kau berdiri."], "storyEn": ["Your voice echoes softly in the dark room — then dies, swallowed by the silence. No answer. You are about to turn away when...", "...something answers. Not a human voice. The same pebble sound as before — click, click, click — but now it sounds closer, as if the thing is moving toward you, following your voice.", "Your blood runs cold. You step back, then another step, heart pounding. Whatever is in there now knows exactly where you stand."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d2_c3x_d1": {"id": "d2_c3x_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "d2_room", "story": ["Goresan-goresan dari dalam itu seharusnya menjadi peringatan. Tapi rasa penasaranmu lebih kuat. Kau mencengkeram gagang lemari ketiga dan menariknya sekuat tenaga.", "Kunci tuanya menyerah dengan bunyi retak — dan pintu lemari itu meledak terbuka ke arahmu. Dari kegelapan di dalamnya, sesuatu melompat keluar: cepat, lapar, dan marah karena dibangunkan.", "Kau bahkan tidak sempat berteriak. Dunia menjadi gelap, hangat, dan penuh gigi. Goresan-goresan itu akhirnya punya penulisnya — dan kini kau tahu kenapa semuanya berasal dari dalam."], "storyEn": ["Those scratches from the inside should have been a warning. But your curiosity is stronger. You grip the third cabinet's handle and yank it with all your strength.", "The old lock gives with a crack — and the cabinet door bursts open toward you. From the darkness inside, something leaps out: fast, hungry, and furious at being woken.", "You don't even get to scream. The world goes dark, warm, and full of teeth. Those scratches finally have their author — and now you know why they all came from the inside."]}, "d2_hub_d1": {"id": "d2_hub_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "d2_hub", "story": ["Kilau itu menarikmu lebih dekat. Kau berjongkok di depan pintu yang tergantung miring — satu-satunya engsel berkarat yang menahannya tampak hampir menyerah pada beratnya.", "Jari-jarimu hampir menyentuh kilau logam itu ketika kayu di atasmu berderit nyaring. Pintu yang berat itu akhirnya menyerah pada gravitasi — engsel terakhirnya patah, dan daun pintu menghantam lehermu seperti guillotine, menjepitmu ke kusen.", "Dalam kegelapan di baliknya, sesuatu bergerak. Kau mendengarnya mendekat — langkah-langkah kecil yang tergesa — tepat sebelum rasa sakit itu menelan segalanya. Keheningan ruangan itu akhirnya punya alasan: ia sedang menunggu."], "storyEn": ["The glint draws you closer. You crouch before the crooked-hanging door — the single rusted hinge holding it looks about to surrender to its weight.", "Your fingers almost touch the metallic glint when the wood above you groans loudly. The heavy door finally surrenders to gravity — its last hinge snaps, and the door leaf crashes onto your neck like a guillotine, pinning you to the frame.", "In the darkness beyond, something moves. You hear it approaching — small, hurried footsteps — just before the pain swallows everything. The room's silence finally has its reason: it was waiting."]}, "d2_room_w1": {"id": "d2_room_w1", "kind": "result", "next": "d2_room", "setBody": "Pergelangan Tangan Tercakar", "setStatus": "wounded", "status": "danger", "story": ["Di bawah lemari kedua, di antara debu dan sarang laba-laba, sesuatu berkilau — kecil, logam, mungkin koin atau kunci. Kau berlutut dan mengulurkan tangan ke dalam kegelapan di bawahnya.", "Jari-jarimu menyentuh logam dingin itu. Pada saat yang sama, kau mendengarnya: kuku-kuku kecil mencakar lantai kayu dari dalam gelap, tepat di samping tanganmu.", "Rasa sakit membakar pergelangan tanganmu — cakaran dalam yang mengoyak kulit. Kau menarik tanganmu dengan teriakan; benda berkilau itu terlepas dan menghilang ke dalam gelap. Dari bawah lemari, sepasang mata kecil berkedip menatapmu... lalu lenyap."], "storyEn": ["Under the second cabinet, among dust and cobwebs, something glints — small, metallic, maybe a coin or a key. You kneel and stretch your hand into the darkness beneath it.", "Your fingers touch the cold metal. At the same moment, you hear it: tiny claws scratching the wooden floor from within the dark, right beside your hand.", "Pain burns your wrist — a deep scratch tearing the skin. You yank your hand back with a cry; the glinting thing slips away and vanishes into the dark. From beneath the cabinet, a pair of small eyes blink at you... then disappear."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "d3_a2_d1": {"id": "d3_a2_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "d3_hub", "story": ["Rasa penasaran mengalahkan rasa takutmu. Tanganmu yang gemetar mengangkat sumber cahaya — dan kau mengarahkannya lurus ke sepasang mata merah yang menyipit itu.", "Cahaya menyibak kegelapan, dan kau akhirnya melihatnya. Wajah itu... kau berharap kau tidak pernah melihatnya. Mulutnya terbuka terlalu lebar, dan ia tidak lagi bergerak ke arahmu — ia sudah ada tepat di depanmu.", "Hal terakhir yang kau dengar adalah detak itu — bukan dari ruangan, tapi dari dalam kepalamu sendiri — sebelum kegelapan menelan cahaya, dan cahaya menelanmu."], "storyEn": ["Curiosity overpowers your fear. Your trembling hand raises the light — and you aim it straight at the narrowed pair of red eyes.", "The light tears through the darkness, and you finally see it. That face... you wish you had never seen it. Its mouth opens far too wide, and it is no longer moving toward you — it is already right in front of you.", "The last thing you hear is the ticking — not from the room, but from inside your own head — before darkness swallows the light, and the light swallows you."]}, "d3_a2_w1": {"id": "d3_a2_w1", "kind": "result", "next": "d3_hub", "setBody": "Betis Terkoyak", "setStatus": "wounded", "status": "danger", "story": ["Matamu sudah terbiasa dengan gelap, dan nalurimu berteriak: lempar sesuatu. Kau meraih kerikil dari sakumu dan melemparkannya tepat ke arah sepasang mata merah itu.", "Kerikil itu meleset — atau mungkin menembus sesuatu yang tidak sepenuhnya ada. Mata merah itu padam seketika, dan kegelapan di sekitarmu terasa bergerak.", "Rasa perih menyayat betismu. Kau berteriak dan terhuyung mundur, darah hangat merembes melalui kain celana. Dari kegelapan, kau mendengar bunyi... tawa kecil? Atau detak itu lagi — kini jauh lebih cepat."], "storyEn": ["Your eyes have adjusted to the dark, and your instinct screams: throw something. You grab a pebble from your pocket and hurl it straight at the pair of red eyes.", "The pebble misses — or perhaps passes through something not entirely there. The red eyes wink out instantly, and the darkness around you feels like it moves.", "A searing sting slices your calf. You cry out and stagger back, warm blood seeping through your trousers. From the darkness, you hear a sound... a small laugh? Or that ticking again — now much faster."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "d3_hub_g1": {"id": "d3_hub_g1", "kind": "result", "next": "d3_hub", "setStatus": "danger", "status": "danger", "story": ["Kau menempelkan telingamu ke celah pintu yang dingin. Detak itu kini terdengar jelas — pelan, berirama, seperti jam... atau jantung. Kau mulai menghitung: satu, dua, tiga...", "Pada hitungan ketujuh, detak itu berhenti. Hening total. Lalu, dari dalam celah — begitu dekat hingga napas dinginnya menyentuh telingamu — sesuatu ikut menghitung: \"...delapan.\"", "Kau terlonjak mundur, jantung berdegup liar. Detak itu berlanjut lagi di balik pintu, kini lebih cepat, seolah sedang tertawa. Udara dingin dari celah itu terasa seperti jari-jari yang baru saja menarik diri."], "storyEn": ["You press your ear to the door's cold crack. The ticking is clear now — slow, rhythmic, like a clock... or a heart. You start counting: one, two, three...", "On the seventh count, the ticking stops. Total silence. Then, from inside the crack — so close its cold breath touches your ear — something counts along: \"...eight.\"", "You jolt backward, heart hammering. The ticking resumes behind the door, now faster, as if laughing. The cold air from the crack feels like fingers that just pulled away."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d4_b2_g1": {"id": "d4_b2_g1", "kind": "result", "next": "d4_hub", "setStatus": "danger", "status": "danger", "story": ["Kau membalik gambar itu. Di belakangnya ada tulisan tangan anak-anak, berantakan dan ditekan terlalu keras: JANGAN BIARKAN DIA BANGUN.", "Di bawah tulisan itu ada gambar kedua — ruangan ini, digambar dari sudut langit-langit. Meja, boneka, dan kau, digambar dari belakang.", "Dan di gambar itu, tepat di belakang bahumu, ada sosok tinggi yang tidak ada di ruangan ini.", "Kau merasakan udara di tengkukmu bergerak. Perlahan. Kau tidak berani menoleh — tapi kau juga tidak berani tidak menoleh."], "storyEn": ["You turn the picture over. On the back is a child's handwriting, messy and pressed too hard: DON'T LET IT WAKE UP.", "Beneath the writing is a second drawing — this room, sketched from the ceiling's angle. The desk, the bear, and you, drawn from behind.", "And in that drawing, right behind your shoulder, stands a tall figure that is not in this room.", "You feel the air move at the nape of your neck. Slowly. You don't dare turn around — but you don't dare not to, either."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "d4_hub_w1": {"id": "d4_hub_w1", "kind": "result", "next": "d4_hub", "setBody": "Jari telunjuk kanannya tertusuk pecahan kaca tajam — lukanya dalam, dan darah yang menetes tampak terlalu gelap.", "setStatus": "wounded", "status": "danger", "story": ["Kau mengulurkan jari ke mata boneka yang lepas itu. Ia berkilau — bukan kilau plastik murahan, melainkan kilau bening yang dingin, seperti sesuatu yang sengaja dipasang di sana.", "Rasa sakitnya datang sepersekian detik kemudian. Bukan mata boneka. Itu serpihan kaca, ditanam miring ke dalam rongga mata, ujungnya menghadap ke luar seperti gigi.", "Jari telunjukmu tertusuk dalam. Darah menetes ke bulu boneka itu — dan kau bersumpah bulu di sekitar tetesan itu bergerak, seolah mengisap.", "Kau menarik tanganmu kembali dengan napas terengah. Boneka itu tetap tersenyum dengan satu matanya yang tersisa."], "storyEn": ["You reach a finger toward the teddy bear's missing eye. It glints — not the cheap glint of plastic, but a cold, clear shine, like something deliberately set there.", "The pain arrives a fraction of a second later. Not a doll's eye. A shard of glass, planted at an angle inside the eye socket, its point facing outward like a tooth.", "Your index finger is pierced deep. Blood drips onto the bear's fur — and you could swear the fur around the droplets stirs, as if drinking.", "You pull your hand back, breathing hard. The bear keeps smiling with its one remaining eye."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "rec_desk_2_w1": {"id": "rec_desk_2_w1", "kind": "result", "next": "reception_hub", "setBody": "Telapak tangannya tersayat pecahan botol yang tersembunyi di puing — sayatannya panjang dan terus berdarah.", "setStatus": "wounded", "status": "danger", "story": ["Gundukan puing itu tampak biasa saja: pecahan plester, serpihan kayu, debu. Tapi sesuatu di dalamnya berkilau samar saat kau menggeser tumpukannya dengan tangan kosong.", "Kau menggali lebih dalam, jari-jarimu menyisir di antara reruntuhan — dan menemukan ujungnya: leher botol kaca, pecah, tersembunyi di bawah lapisan debu.", "Terlambat. Pecahan itu sudah lebih dulu menemukanmu. Sayatan panjang terbuka di telapak tanganmu, darah mengalir deras menetes ke puing-puing di bawah.", "Kau menarik tanganmu sambil meringis. Di antara darah yang menetes, kau melihat kilau itu lagi — dan kali ini kau tidak berani menyentuhnya."], "storyEn": ["The rubble mound looked ordinary: plaster shards, wood splinters, dust. But something in it glinted faintly as you shifted the pile with your bare hands.", "You dig deeper, fingers combing through the wreckage — and find its edge: a broken glass bottle neck, buried under a layer of dust.", "Too late. The shard found you first. A long gash opens across your palm, blood pouring down onto the rubble below.", "You yank your hand back, wincing. Among the dripping blood you see the glint again — and this time you don't dare touch it."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "rec_desk_floor_2_g1": {"id": "rec_desk_floor_2_g1", "kind": "result", "next": "reception_hub", "setStatus": "danger", "status": "danger", "story": ["Kau melempar koin itu ke dalam kegelapan di luar jangkauan cahaya. Ia berputar di udara — lalu bunyi dentingnya berhenti terlalu cepat.", "Tidak ada bunyi koin menyentuh lantai. Keheningan. Kemudian, dari kegelapan itu, terdengar suara langkah kaki yang pelan dan diseret.", "Sesuatu di sana menangkap koinmu. Dan sekarang ia tahu persis di mana kau berada — karena kaulah yang memberitahunya.", "Kau mundur merapat ke meja, jantung berdebar. Langkah-langkah itu berhenti. Tepat di batas cahaya. Menunggu."], "storyEn": ["You toss the coin into the darkness beyond the light's reach. It spins through the air — then its clink stops too soon.", "No sound of a coin hitting the floor. Silence. Then, from that darkness, comes the sound of slow, dragging footsteps.", "Something in there caught your coin. And now it knows exactly where you are — because you told it.", "You back against the desk, heart pounding. The footsteps stop. Right at the edge of the light. Waiting."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "rec_desk_floor_2_w1": {"id": "rec_desk_floor_2_w1", "kind": "result", "next": "reception_hub", "setBody": "Lidah dan bibirnya melepuh — koin itu bukan logam dingin, melainkan sesuatu yang membakar dari dalam.", "setStatus": "wounded", "status": "danger", "story": ["Koin itu dingin di telapak tanganmu — terlalu dingin, dingin yang tidak wajar untuk logam tua. Kau penasaran: kalau ini emas asli, gigitan akan meninggalkan bekas.", "Kau mengangkatnya ke mulut dan menggigit tepinya.", "Rasa sakitnya seperti disengat api. Bukan dingin — panas. Panas yang menyengat dari dalam logam itu, seolah koin itu baru saja ditarik dari bara. Lidah dan bibirmu melepuh seketika.", "Kau meludahkannya ke lantai dengan teriakan tertahan. Koin itu berputar, berhenti — dan di sisinya yang tadi kau gigit, kini ada bekas gigi yang berasap tipis."], "storyEn": ["The coin is cold in your palm — too cold, unnaturally cold for old metal. You're curious: if this is real gold, a bite will leave a mark.", "You raise it to your mouth and bite its edge.", "The pain is like being stung by fire. Not cold — heat. Heat searing from inside the metal, as if the coin had just been pulled from embers. Your tongue and lips blister instantly.", "You spit it to the floor with a muffled cry. The coin spins, settles — and on the side you bit, there is now a tooth mark wisping faint smoke."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "rec_desk_rubble_2_g1": {"id": "rec_desk_rubble_2_g1", "kind": "result", "next": "reception_hub", "setStatus": "danger", "status": "danger", "story": ["Bau lapuk itu menempel di pakaianmu, tapi sumbernya ada di suatu tempat — kau mengikutinya, hidung menuntun, merunduk semakin dalam ke antara puing.", "Semakin dekat, semakin kuat. Bukan sekadar lapuk: ada bau manis yang busuk di bawahnya, seperti buah yang membusuk di ruangan tertutup. Kepalamu mulai berdenyut.", "Lalu kau menyadarinya: bau itu berdenyut. Menguat dan melemah, menguat dan melemah — mengikuti irama. Seperti napas.", "Gundukan puing di depanmu bergerak. Sedikit. Sekali. Kau mundur secepat yang kau bisa, kepala berputar, dan tidak berani bernapas sampai kau jauh darinya."], "storyEn": ["The musty smell clings to your clothes, but its source is somewhere — you follow it, nose leading, crouching deeper among the rubble.", "Closer, stronger. Not just musty: there is a sweet rot beneath it, like fruit decaying in a sealed room. Your head starts to throb.", "Then you realize: the smell pulses. Stronger and weaker, stronger and weaker — keeping a rhythm. Like breathing.", "The mound of rubble before you shifts. Slightly. Once. You scramble back as fast as you can, head spinning, and don't dare breathe until you're far from it."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "rec_left_2_g1": {"id": "rec_left_2_g1", "kind": "result", "next": "reception_hub", "setStatus": "danger", "status": "danger", "story": ["Pintu baja itu diam — diam yang tidak wajar. Kau mengangkat kepalan tangan dan mengetuknya tiga kali, pelan. Bunyinya bergema di lorong buntu ini.", "Satu detik. Dua detik. Hening.", "Lalu, dari balik baja tebal itu, terdengar jawaban: tiga ketukan. Sama persis. Jeda yang sama. Kekuatan yang sama.", "Sesuatu di balik pintu itu mendengarkanmu — dan ia baru saja memberitahumu bahwa ia bisa mendengarmu dengan sangat jelas."], "storyEn": ["The steel door is silent — a silence that feels wrong. You raise your fist and knock three times, softly. The sound echoes down this dead-end corridor.", "One second. Two seconds. Silence.", "Then, from behind the thick steel, comes an answer: three knocks. Exactly the same. The same pauses. The same force.", "Something behind that door was listening to you — and it just told you that it can hear you very clearly."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "rec_left_door_2_g1": {"id": "rec_left_door_2_g1", "kind": "result", "next": "rec_left_2", "setStatus": "danger", "status": "danger", "story": ["Kau menempelkan telingamu ke permukaan pintu baja yang dingin. Logam itu bergetar samar — atau itu detak jantungmu sendiri yang merambat.", "Lalu kau mendengarnya: napas. Dalam, lambat, berat — tepat di sisi lain pintu, begitu dekat seolah sesuatu di sana juga menempelkan telinganya.", "Kau menahan napasmu sendiri. Napas di balik pintu itu pun berhenti. Bersamaan. Seolah ia sedang meniru — atau menunggu.", "Kau melepaskan telingamu dari pintu dengan gerakan tersentak. Bau busuk dari celah bawahnya kini terasa lebih kuat, dan kau tidak ingin tahu apa yang baru saja bernapas bersamamu."], "storyEn": ["You press your ear to the cold steel surface. The metal hums faintly — or is that your own heartbeat traveling through it.", "Then you hear it: breathing. Deep, slow, heavy — right on the other side of the door, so close it sounds like something there is pressing its ear too.", "You hold your own breath. The breathing behind the door stops as well. At the same moment. As if it were copying — or waiting.", "You tear your ear from the door with a jerk. The rotten smell from the gap beneath is stronger now, and you don't want to know what was just breathing with you."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "rec_papers_2_d1": {"id": "rec_papers_2_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "opening", "story": ["Kau mengangkat lembar paling atas dan membacakan namanya dengan lantang — namamu sendiri, tercetak rapi di bawah kop surat rumah sakit ini. Suaramu bergema di ruangan kosong itu.", "Kertas-kertas di atas meja itu berhenti bergetar. Semuanya. Sekaligus.", "Lalu, satu per satu, mereka mulai terangkat — melayang, berputar perlahan di udara, mengelilingimu seperti kawanan burung kertas. Ujung-ujungnya tajam. Sangat tajam.", "Kau mengerti, terlambat: kertas-kertas ini sudah menunggu seseorang selama bertahun-tahun. Dan kau baru saja memberitahu mereka siapa yang datang."], "storyEn": ["You lift the topmost sheet and read its name aloud — your own name, printed neatly beneath this hospital's letterhead. Your voice echoes through the empty room.", "The papers on the desk stop trembling. All of them. At once.", "Then, one by one, they begin to rise — floating, circling slowly in the air, surrounding you like a flock of paper birds. Their edges are sharp. Very sharp.", "You understand, too late: these papers have been waiting for someone for years. And you just told them who came."]}, "reception_hub_g1": {"id": "reception_hub_g1", "kind": "result", "next": "reception_hub", "setStatus": "danger", "status": "danger", "story": ["Kau menahan napas dan melangkah mengikuti suara-suara samar itu — ke arah lorong kiri, ke dalam gelap yang menelan bunyi.", "Semakin dekat kau melangkah, semakin jelas suara itu: bisikan-bisikan kecil, sabar, menyebut sesuatu berulang-ulang. Kedengarannya seperti namamu. Hampir.", "Lalu, tepat saat kakimu melewati ambang lorong, semua suara itu berhenti. Sekaligus. Seperti puluhan mulut yang menutup bersamaan.", "Keheningan yang tersisa lebih berat dari sebelumnya — dan di dalamnya, kau mendengar sesuatu yang lain: napas. Bukan napasmu."], "storyEn": ["You hold your breath and step toward the faint voices — toward the left corridor, into the dark that swallows sound.", "The closer you step, the clearer they become: small, patient whispers, repeating something over and over. It sounds like your name. Almost.", "Then, the moment your foot crosses the corridor's threshold, every voice stops. All at once. Like dozens of mouths closing together.", "The silence left behind is heavier than before — and inside it, you hear something else: breathing. Not yours."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "reception_hub_w1": {"id": "reception_hub_w1", "kind": "result", "next": "reception_hub", "setBody": "Betis kanannya robek paku berkarat saat meja resepsionis yang lapuk itu ambruk — lukanya berdenyut dan terasa panas.", "setStatus": "wounded", "status": "danger", "story": ["Meja resepsionis itu tampak kokoh dari jauh — tapi kayu yang membusuk tidak pernah sekuat kelihatannya. Kau meletakkan tangan di tepinya dan mengangkat badanmu naik.", "Untuk sesaat kau berhasil berdiri di atasnya, melihat pertigaan dari ketinggian: lorong kiri, lorong kanan, dan sesuatu yang bergerak di ujung penglihatanmu —", "— lalu kaki meja itu patah. Kayu lapuk pecah seperti kerupuk. Kau jatuh ke dalam reruntuhan meja, dan sebuah paku berkarat merobek betismu dari lutut hingga pergelangan.", "Kau merangkak keluar sambil menahan erangan. Dari sudut matamu, gerakan tadi sudah tidak ada. Atau mungkin ia hanya menunggu kau lengah lagi."], "storyEn": ["The reception desk looked sturdy from afar — but rotten wood is never as strong as it looks. You brace your hands on its edge and haul yourself up.", "For a moment you stand on top of it, seeing the junction from above: the left corridor, the right corridor, and something moving at the edge of your sight —", "— then a desk leg snaps. Decayed wood shatters like a cracker. You fall into the wreckage, and a rusted nail tears your calf from knee to ankle.", "You crawl out stifling a groan. At the corner of your eye, the movement is gone. Or maybe it is only waiting for you to look away again."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "s12_hide_2_g1": {"id": "s12_hide_2_g1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "result", "next": "s12_hide_2", "setStatus": "danger", "status": "danger", "story": ["Di dekat kakimu, sesuatu berkilau di antara debu — sebuah kalung rantai perak dengan liontin yang masih memantulkan cahaya redup. Harta kecil di tengah neraka. Jari-jarimu merayap mendekat, pelan, tanpa suara.", "Rantai itu dingin saat menyentuh kulitmu. Terlalu dingin. Dan saat kau menariknya, kau merasakan tarikan balik — dari ujung yang lain.", "Sesuatu di balik peti memegang ujung rantai itu. Sesuatu yang kini tahu persis di mana kau bersembunyi. Kau melepaskan kalung itu dan menahan napas, berharap ia hanya penasaran — bukan lapar."], "storyEn": ["Near your foot, something glitters among the dust — a silver chain necklace with a pendant still catching the dim light. A small treasure in the middle of hell. Your fingers creep toward it, slow, silent.", "The chain is cold against your skin. Too cold. And when you pull it, you feel a pull back — from the other end.", "Something behind the crates is holding the other end of the chain. Something that now knows exactly where you are hiding. You drop the necklace and hold your breath, hoping it is merely curious — not hungry."], "tag": "[Dalam bahaya]", "tagEn": "[In danger]"}, "s12_hub_d1": {"id": "s12_hub_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "s12_hub", "story": ["Kau melangkah menuju sudut gelap itu, mengikuti suara yang menyebut namamu dengan kelembutan yang tidak pantas ada di tempat seperti ini. Semakin dekat kau melangkah, semakin jelas kebenarannya: suara itu tidak keluar dari mulut siapa pun. Ia merembes dari sebuah lubang di dinding — lubang yang bernapas.", "Terlalu terlambat kau sadar bahwa kelembutan itu adalah umpan. Sesuatu yang panjang, dingin, dan licin melilit pergelangan kakimu dan menyeretmu ke dalam kegelapan dengan kekuatan yang mustahil.", "Suara itu masih menyebut namamu, kini dengan nada puas — seolah mengucapkan terima kasih. Lalu kegelapan menelanmu bulat-bulat, dan namamu menjadi miliknya."], "storyEn": ["You step toward that dark corner, following the voice that speaks your name with a gentleness that has no business existing in a place like this. The closer you step, the clearer the truth becomes: the voice comes from no one's mouth. It seeps from a hole in the wall — a hole that breathes.", "Too late, you realize the gentleness was bait. Something long, cold, and slick coils around your ankle and drags you into the darkness with impossible strength.", "The voice still speaks your name, now with a satisfied tone — as if saying thank you. Then the darkness swallows you whole, and your name becomes its property."]}, "s12_hub_w1": {"id": "s12_hub_w1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "result", "next": "s12_hide_2", "setBody": "Tanganmu terkoyak pecahan kaca — darah menetes ke lantai, dan aroma darah membuat makhluk-makhluk itu menoleh.", "setStatus": "wounded", "status": "danger", "story": ["Kau berjongkok dan meraih botol kaca kecil yang berkilau di lantai — cairan di dalamnya berpendar samar, dan pikiranmu sudah membayangkan seribu kegunaannya. Tapi jari-jarimu terlalu gemetar. Botol itu tergelincir.", "Pecah. Dentingnya memantul ke seluruh aula seperti lonceng kematian. Pecahan kaca mengoyak telapak tanganmu, dan darah hangat menetes ke lantai yang dingin.", "Satu per satu, kepala-kepala itu menoleh ke arahmu. Mereka mencium bau darahmu. Kau tidak punya waktu untuk menyesal — hanya untuk lari dan bersembunyi sebelum mereka bergerak."], "storyEn": ["You crouch and reach for the small glass vial glittering on the floor — the liquid inside glows faintly, and your mind is already imagining a thousand uses for it. But your fingers tremble too much. The vial slips.", "It shatters. The ringing bounces across the whole hall like a death knell. Shards tear your palm open, and warm blood drips onto the cold floor.", "One by one, those heads turn toward you. They smell your blood. You have no time for regret — only to run and hide before they move."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "s12_ready_2_w1": {"id": "s12_ready_2_w1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "result", "next": "s12_run_2", "setBody": "Lenganmu tercakar saat kau kabur dari kejaran — kunci besi itu masih tergenggam erat di tanganmu yang berdarah.", "setStatus": "wounded", "status": "danger", "story": ["Pintu itu begitu dekat. Dan di gagangnya, tergantung sebundel kunci besi tua yang berkilau samar. Siapa tahu pintu apa yang bisa mereka buka nanti? Tangamu terulur, hampir menyentuhnya — hanya sedikit lagi.", "Kunci-kunci itu berdenting. Sekali. Keras. Di aula yang sunyi, bunyinya seperti teriakan.", "Kau meraih bundel itu dan lari, tapi cakar-cakar kecil itu lebih cepat dari yang kau kira. Sesuatu menyabet lenganmu, mengoyak kulit hingga berdarah. Kau berhasil kabur dengan kunci di genggaman — dan luka yang akan terus mengingatkanmu betapa mahalnya keserakahan."], "storyEn": ["The door is so close. And on its handle hangs a bundle of old iron keys, glinting faintly. Who knows what doors they might open later? Your hand stretches out, almost touching them — just a little more.", "The keys clink. Once. Loud. In the silent hall, it sounds like a scream.", "You snatch the bundle and run, but those small claws are faster than you thought. Something slashes your arm, tearing the skin open. You escape with the keys in your grasp — and a wound that will keep reminding you how expensive greed is."], "tag": "[Terluka]", "tagEn": "[Wounded]"}, "s12_run_2_d1": {"id": "s12_run_2_d1", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "kind": "death", "next": "s12_hub", "story": ["Tumpukan peti itu menjulang di sisimu seperti tangga darurat menuju pintu. Kau melompat — tubuhmu melayang sejenak di udara, dan untuk sepersekian detik kau yakin jalan pintas ini adalah keputusan paling cerdas malam ini.", "Lalu kakimu mendarat. Kayu peti itu berderit — dan dari atas tumpukan, dari kegelapan di antara celah-celahnya, puluhan pasang mata kecil menyala menatapmu. Mereka tidak hanya di lantai. Mereka ada di mana-mana.", "Kau tidak sempat berteriak. Mereka menerkammu dari segala arah sekaligus, dan jalan pintasmu berakhir tepat di tengah-tengah parade itu."], "storyEn": ["The stack of crates towers beside you like an emergency staircase to the door. You leap — your body hangs in the air for a moment, and for a split second you are certain this shortcut is the smartest decision of the night.", "Then your feet land. The crate wood creaks — and from atop the stack, from the darkness between the gaps, dozens of pairs of small eyes flare open, staring at you. They were not only on the floor. They were everywhere.", "You never got to scream. They pounced from every direction at once, and your shortcut ended right in the middle of the parade."]}};

  { key: "senjata", name: "Senjata", icon: "🗡" }

function eqSlotName(key){
  const s = EQ_SLOTS.find(x=>x.key===key);
  return s ? s.name : key;
}

/* ---------- SAVE (localStorage — hanya CERITA BARU yang me-reset) ---------- */
const SAVE_KEY = "asylum_save_v1";
function persist(){
  if(!S.registered) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      registered: true, name: S.name, gender: S.gender,
      deathCount: S.deathCount, items: S.items, status: S.status,
      mental: S.mental, effects: S.effects, equipment: S.equipment, node: S.node,
      tiers: S.tiers, temp: S.temp, emotions: S.emotions, favor: S.favor,
      objective: S.objective, objectiveEn: S.objectiveEn||null, body: S.body, energy: S.energy, flags: S.flags,
      restCd: S.restCd, restRisk: S.restRisk
    }));
  }catch(e){}
}
function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    return (s && s.registered) ? s : null;
  }catch(e){ return null; }
}
function wipeSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- EVENT FOUNDATION (reaktif — read-only, tidak memutasi S) ---------- */
/* Snapshot: bentuk ringkas state yang dilacak untuk perbandingan before/after. */
function snapshotState(){
  const items = {};
  S.items.forEach(it=>{ items[it.id] = (items[it.id]||0) + (it.qty||1); });
  const equipment = {};
  Object.keys(S.equipment).forEach(k=>{ equipment[k] = S.equipment[k] ? S.equipment[k].id : null; });
  return { status:S.status, mental:S.mental, deathCount:S.deathCount,
           items, equipment, effects:[...S.effects],
           tiers:{...(S.tiers||{})}, temp:(S.temp||[]).map(t=>t.n).sort(),
           emotions:{...(S.emotions||{})}, favor:{...(S.favor||{})},
           objective:S.objective||null, body:S.body||null,
           energyTier:energyTier() };
}
function itemName(id){
  const it = S.items.find(x=>x.id===id);
  if(it) return it.name;
  for(const k of Object.keys(S.equipment)){
    const e = S.equipment[k];
    if(e && e.id===id) return e.name;
  }
  return id;
}
let evtSeq = 0;
/* deriveEvents: bandingkan before/after -> daftar event semantik. Hanya dari
   perubahan nyata; tidak ada event palsu. Severity dari aturan eksplisit. */
function deriveEvents(before, after, source){
  const evts = [];
  const push = (type, severity, changes, reactionKey)=>{
    evts.push({ id:"ev"+(++evtSeq), type, severity, changes,
                source, context:{ node:S.node }, reactionKey });
  };
  if(after.deathCount > before.deathCount)
    push("death", "critical",
         { from:before.deathCount, to:after.deathCount, deathCount:after.deathCount },
         "death");
  if(after.status !== before.status){
    const to = after.status;
    const sev = (to==="danger"||to==="wounded") ? "high" : "moderate";
    push("status_changed", sev, { from:before.status, to }, "status_"+(to||"safe"));
  }
  if(after.mental !== before.mental){
    const worse = after.mental > before.mental;
    push("mental_changed", worse ? (after.mental>=4 ? "high" : "moderate") : "low",
         { from:before.mental, to:after.mental, label:MENTAL[after.mental]||"" },
         "mental_"+(worse?"worse":"better"));
  }
  const ids = new Set([...Object.keys(before.items), ...Object.keys(after.items)]);
  ids.forEach(id=>{
    const b = before.items[id]||0, a = after.items[id]||0;
    if(a > b) push("item_gained", "low",
                   { id, name:itemDispName(id), from:b, to:a, qty:a-b }, "item_gained");
    else if(a < b) push("item_lost", "low",
                   { id, name:itemDispName(id), from:b, to:a, qty:b-a }, "item_lost");
  });
  Object.keys(after.equipment).forEach(slot=>{
    if(after.equipment[slot] !== before.equipment[slot]){
      const equipped = !!after.equipment[slot];
      push("equipment_changed", "low",
           { slot, slotName:eqSlotNameL(slot),
             from:before.equipment[slot], to:after.equipment[slot],
             name:itemDispName(after.equipment[slot]||before.equipment[slot]) },
           equipped ? "equipment_equipped" : "equipment_unequipped");
    }
  });
  after.effects.forEach(ef=>{
    if(!before.effects.includes(ef))
      push("effect_started", "moderate", { effect:ef }, "effect_started");
  });
  /* --- tier berubah (+ kondisi turunan Ekstrim) --- */
  const tnames = new Set([...Object.keys(before.tiers), ...Object.keys(after.tiers)]);
  tnames.forEach(name=>{
    const b = before.tiers[name], a = after.tiers[name];
    if(b===a) return;
    const bl = (b===undefined) ? "—" : TIER_NAMES[b];
    const al = (a===undefined) ? "Hilang" : TIER_NAMES[a];
    push("tier_changed", (a===3||b===3) ? "high" : "moderate",
         { name, from:bl, to:al, label:al }, "tier_changed");
    if(name==="Kelelahan" && a===3 && b!==3)
      push("derived", "high", { name:"Lemas",
        note:"Kelelahan mencapai Ekstrim — tubuhmu Lemas, setara Terluka." }, "derived_lemas");
    if(name==="Stress" && a===3 && b!==3)
      push("derived", "high", { name:"Kebingungan Akut",
        note:"Stress mencapai Ekstrim — pilihanmu berikutnya ditentukan dadu." }, "derived_bingung");
    if(name==="Kelelahan" && b===3 && a!==3)
      push("derived", "low", { name:"Lemas", note:"Rasa lemasmu mereda." }, "derived_lemas_end");
    if(name==="Stress" && b===3 && a!==3)
      push("derived", "low", { name:"Kebingungan Akut", note:"Pikiranmu kembali jernih." }, "derived_bingung_end");
  });
  /* --- emosi --- */
  const enames = new Set([...Object.keys(before.emotions), ...Object.keys(after.emotions)]);
  enames.forEach(name=>{
    const b = before.emotions[name]||0, a = after.emotions[name]||0;
    if(a===b) return;
    push("emotion_changed", (a>b && a>=2) ? "moderate" : "low",
         { name, from:b, to:a, dir: a>b ? "naik" : "turun" }, "emotion_changed");
  });
  /* --- favorability --- */
  const fnames = new Set([...Object.keys(before.favor), ...Object.keys(after.favor)]);
  fnames.forEach(name=>{
    const b = before.favor[name]||0, a = after.favor[name]||0;
    if(a!==b){
      const d = a-b;
      push("favor_changed", "low",
           { name, from:b, to:a, delta:d, dstr:(d>0?"+":"")+d }, "favor_changed");
    }
  });
  /* --- objective --- */
  if(after.objective!==before.objective)
    push("objective_changed", "moderate",
         { from:before.objective||"—", to:after.objective||"—",
           objective:after.objective||"", objectiveEn:after.objectiveEn||null }, "objective_changed");
  /* --- status sementara --- */
  const bt = new Set(before.temp), at = new Set(after.temp);
  at.forEach(t=>{ if(!bt.has(t)) push("temp_started", "low", { name:t }, "temp_started"); });
  bt.forEach(t=>{ if(!at.has(t)) push("temp_ended", "low", { name:t }, "temp_ended"); });
  /* --- tier energi --- */
  if(after.energyTier!==before.energyTier){
    const order = { fit:4, tired:3, weary:2, critical:1, empty:0 };
    const to = after.energyTier;
    const d = (order[to]??4) < (order[before.energyTier]??4) ? "down" : "up";
    const txt = energyTierText(to, d);
    if(txt) push("energy_tier", to==="empty"||to==="critical" ? "high" : "low",
                 { from:before.energyTier, to, dir:d, tierText:txt }, "energy_tier");
  }
  /* --- kondisi tubuh --- */
  if(after.body!==before.body && (after.body || before.body))
    push("body_changed", "low",
         { from:before.body||"—", to:after.body||"—" }, "body_changed");
  return evts;
}
/* Satu titik presentasi event: reaksi + popup tutorial kontekstual.
   presentReaction sendiri tetap read-only (tidak memutasi S). */
function reactAndTut(before, source, target){
  const evts = deriveEvents(before, snapshotState(), source);
  presentReaction(evts);
  tutPopForEvents(evts);
  achvCheck(evts, target || S.node);
}

let lastReactionKey = null, lastRepeat = 0;
function fillTpl(tpl, changes){
  return tpl.replace(/\{(\w+)\}/g, (_,k)=> (changes[k]!==undefined && changes[k]!==null) ? changes[k] : "");
}
/* presentReaction: batch event jadi satu rangkaian koheren, prioritas kritis
   dulu, non-blocking, tidak pernah memutasi state. */
function presentReaction(events){
  if(!events || !events.length) return;
  const order = { critical:0, high:1, moderate:2, low:3 };
  const sorted = [...events].sort((a,b)=>(order[a.severity]??3)-(order[b.severity]??3));
  const primary = sorted[0];
  const key = primary.reactionKey;
  let variant = 0;
  if(key===lastReactionKey){ lastRepeat++; variant = lastRepeat % 2; }
  else lastRepeat = 0;
  lastReactionKey = key;
  const entry = REACTIONS[key];
  if(!entry) return;
  showReactionBar(fillTpl(reactVariant(entry, variant), dispChanges(primary.changes)), primary.severity);
}
function showReactionBar(msg, severity){
  let bar = $("#reactionBar");
  if(!bar){
    bar = document.createElement("div");
    bar.id = "reactionBar";
    bar.setAttribute("role","status");
    bar.setAttribute("aria-live","polite");
    document.body.appendChild(bar);
  }
  bar.className = "show sev-"+severity;
  bar.textContent = msg;
  clearTimeout(bar._h);
  bar._h = setTimeout(()=>{ bar.className = ""; }, 2600);
}

/* ============================================================
   SISTEM BARU ARC 1 (fase sistem — konten arc menyusul)
   - Efek status bertingkat: Ringan/Sedang/Tinggi/Ekstrim (naik/turun 1 tingkat)
   - Kondisi turunan: [Lemas] (Kelelahan Ekstrim, setara Terluka),
     [Kebingungan Akut] (Stress Ekstrim — pilihan berikutnya diacak dadu)
   - Status sementara (durasi hitungan node), emosi transien (meluruh)
   - Mental dua arah (memburuk & membaik) + efek mekanis per tingkat
   - Pilihan bersyarat: nomor sama, hasil beda tergantung kondisi (Tutorial #3)
   - Objective dinamis, favorability, Kondisi Tubuh detail
   - Node input teks (teka-teki) & keypad angka
   Semua field baru opsional — save lama tetap terbaca via default.
   ============================================================ */
const TIER_NAMES = ["Ringan","Sedang","Tinggi","Ekstrim"];
const TIER_EFFECTS = ["Stress","Keracunan","Pendarahan","Kelelahan"];
function tierGet(name){ return (S.tiers && S.tiers[name]!=null) ? S.tiers[name] : -1; }
function tierSet(name, t){
  t = parseInt(t);
  if(!S.tiers) S.tiers = {};
  if(isNaN(t) || t<0) delete S.tiers[name];
  else S.tiers[name] = Math.min(3, t);
}
function tierUp(name){ const t=tierGet(name); tierSet(name, t<0?0:t+1); }
function tierDown(name){ const t=tierGet(name); if(t>=0) tierSet(name, t-1); }
/* Kondisi turunan — dihitung dari tier, bukan disimpan */
function isLemas(){ return tierGet("Kelelahan")===3; }
function isBingung(){ return tierGet("Stress")===3; }
function isWoundedLike(){ return S.status==="wounded" || isLemas(); }

/* Status sementara: [{n, left}] — berkurang 1 tiap pindah node */
function addTemp(n, nodes){
  if(!S.temp) S.temp = [];
  const ex = S.temp.find(t=>t.n===n);
  if(ex) ex.left = Math.max(ex.left, Math.max(1, nodes||1));
  else S.temp.push({ n, left: Math.max(1, nodes||1) });
}
function tempActive(n){ return !!(S.temp||[]).find(t=>t.n===n && t.left>0); }
function tickTemp(){
  if(!S.temp) return;
  S.temp.forEach(t=>{ t.left--; });
  S.temp = S.temp.filter(t=>t.left>0);
}

/* ---------- MENTAL / EMOSI ---------- */
function mentalWorse(n){ S.mental = Math.min(MENTAL.length-1, S.mental+(n||1)); }
function mentalBetter(n){ S.mental = Math.max(0, S.mental-(n||1)); }
/* Emosi transien: {nama: intensitas 1..3} — meluruh pada decay tick (acak tiap 5-10 pilihan) */
function addEmotion(name, amt){
  if(!S.emotions) S.emotions = {};
  const v = Math.max(0, Math.min(3, (S.emotions[name]||0)+(amt||1)));
  if(v<=0) delete S.emotions[name]; else S.emotions[name] = v;
}
function emotionGet(name){ return (S.emotions && S.emotions[name]) || 0; }
function tickEmotions(){
  if(!S.emotions) return;
  Object.keys(S.emotions).forEach(k=>{
    S.emotions[k]--;
    if(S.emotions[k]<=0) delete S.emotions[k];
  });
}
/* Decay tick: emosi meluruh & mental pulih 1 tingkat — terjadi acak setiap
   5-10 pilihan (bukan tiap pilihan). Membuat emosi/mental tak terduga. */
function rollDecayAt(){ return 5 + Math.floor(Math.random()*6); }
function decayTick(){
  if(S.decayCount==null) S.decayCount = 0;
  if(S.decayAt==null) S.decayAt = rollDecayAt();
  S.decayCount++;
  if(S.decayCount >= S.decayAt){
    S.decayCount = 0;
    S.decayAt = rollDecayAt();
    tickEmotions();
    if(S.mental > 0) mentalBetter(1);
  }
}
/* Goyah: mental Panik/Hancur, atau Takut>=2 — mengunci pilihan yang butuh ketenangan */
function isShaken(){ return S.mental>=3 || emotionGet("Takut")>=2; }

/* ---------- FAVORABILITY ---------- */
function favorGet(name){ return (S.favor && S.favor[name]) || 0; }
function favorAdd(name, n){
  if(!S.favor) S.favor = {};
  S.favor[name] = (S.favor[name]||0) + (n||0);
}

/* ---------- ITEM: kurangi/hapus ---------- */
function removeItem(id, qty){
  const it = S.items.find(x=>x.id===id);
  if(!it) return false;
  const before = snapshotState();
  it.qty = (it.qty||1) - (qty||1);
  if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id);
  persist();
  reactAndTut(before, "item");
  return true;
}

/* ---------- ENERGI ---------- */
/* Setiap pilihan memakai Energi. Makanan memulihkan. Energi 0 -> Kelelahan naik. */
function spendEnergy(n, x, y){
  if(!S.registered) return;
  if(S.energy==null) S.energy = 100;
  const cost = (n==null?4:n);
  S.energy = Math.max(0, S.energy - cost);
  floatEnergy(cost, x, y);
  updateHUD();
  if(S.energy<=0){
    const before = tierGet("Kelelahan");
    tierUp("Kelelahan");
    if(tierGet("Kelelahan")!==before) toast(ui("toast_energy_empty"));
  }
}
/* ---------- PINGSAN ---------- */
/* Energi >40 aman. 1-40: makin rendah energi, makin besar peluang pingsan tiap pilihan. */
function faintChance(){
  const e = (S.energy==null)?100:S.energy;
  if(e>40) return 0;
  if(e<=0) return 0.6;
  return (40-e)/40*0.6;
}
function rollFaint(){ return Math.random() < faintChance(); }
const FAINT_W = { killed:15, stolen:30, wounded:25, safe:30 };
function faintStealable(){
  const eq = [];
  Object.values(S.equipment||{}).forEach(x=>{ if(x&&x.id) eq.push(x.id); });
  return (S.items||[]).filter(it=>it && !it.story && eq.indexOf(it.id)<0);
}
function rollFaintOutcome(){
  const pool = ["killed","stolen","wounded","safe"].filter(id=> id!=="stolen" || faintStealable().length>0);
  const tot = pool.reduce((a,id)=>a+FAINT_W[id],0);
  let r = Math.random()*tot;
  for(const id of pool){ r-=FAINT_W[id]; if(r<=0) return id; }
  return pool[pool.length-1];
}
function doFaint(){
  try{ if(globalThis.AudioSys) AudioSys.sfx("faint"); }catch(e){}
  const out = rollFaintOutcome();
  if(out==="killed"){
    NODES.faint_killed.next = S.node; /* bangkit di tempat pingsan */
    goTarget("faint_killed");
    return;
  }

}

/* ---------- REST ---------- */
/* Tombol aksi pojok kanan bawah. Full rest: +30 energi, cooldown 10 pilihan.
   Saat cooldown: boleh dipaksa (+15) tapi risiko diserang naik 25% -> 50% -> 75% -> PASTI TEWAS. */
const REST_FULL = 30, REST_HALF = 15, REST_CD = 10;
function restNextPct(){ return S.restRisk>=3 ? 100 : [25,50,75][S.restRisk]; }
function syncRestBtn(){
  const dock = $("#actionDock"), b = $("#restBtn"), tx = $("#restTx");

function doRest(){
  if(!S.registered) return;
  const n0 = NODES[S.node];
  if(n0 && n0.kind==="death") return;
  if(interludeOpen) return; /* interlude (pingsan/diserang) sedang tampil */
  if(S.energy>=100){ toast(ui("rest_full")); return; }
  const before = snapshotState();
  if(S.restCd<=0){
    S.energy = Math.min(100, S.energy + REST_FULL);
    tierDown("Kelelahan"); /* rest legit: kelelahan turun 1 tingkat */
    S.restCd = REST_CD; S.restRisk = 0;
    floatEnergy("+"+REST_FULL);
    toast(ui("rest_done"));
    try{ if(globalThis.AudioSys) AudioSys.sfx("heal"); }catch(e){}
    updateHUD(); persist(); syncRestBtn();
    reactAndTut(before, "rest");
    return;
  }
  /* istirahat paksa saat cooldown */
  S.restRisk++;
  S.energy = Math.min(100, S.energy + REST_HALF);
  floatEnergy("+"+REST_HALF);
  if(S.restRisk>=4){
    NODES.rest_killed.next = S.node;
    goTarget("rest_killed");
    return;
  }
  const pct = [25,50,75][S.restRisk-1];
  updateHUD(); persist(); syncRestBtn();
  if(Math.random()*100 < pct){ restAttack(); return; }
  toast(ui("rest_risky_ok"));
  try{ if(globalThis.AudioSys) AudioSys.sfx("heal"); }catch(e){}
  reactAndTut(before, "rest");
}
function restAttack(){

  const kind = (stealable.length>0 && Math.random()<0.5) ? "robbed" : "wounded";

/* Pakai item manual dari tas (makan, perban, dll). */
function useItem(id){
  const it = S.items.find(x=>x.id===id);
  if(!it || !it.use) return;
  const before = snapshotState();
  const u = it.use;
  if(u.energy) S.energy = Math.min(100, Math.max(0, (S.energy||0)+u.energy));
  if(u.heal && S.status==="wounded"){ S.status = null; S.body = null; }
  if(u.tierUp) u.tierUp.forEach(t=>tierUp(t));
  if(u.tierDown) u.tierDown.forEach(t=>tierDown(t));
  if(u.mentalBetter) mentalBetter(u.mentalBetter);
  if(u.mentalWorse) mentalWorse(u.mentalWorse);
  if(u.addEmotion) u.addEmotion.forEach(e=>addEmotion(e.n, e.amt));
  if(id==="perban_kotor" && u.heal) achvUnlock("wounded_heal");
  if(id==="surat_terlipat") achvUnlock("reader");
  it.qty = (it.qty||1)-1;
  if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id);
  persist();
  reactAndTut(before, "use");
  updateHUD(); openInventory();
  toast(ui("toast_use")+itemNameL(it)+" 🩸");
}

/* ---------- TIER ENERGI (naratif, bukan % acak) ---------- */
/* fit 60-100: normal. tired 40-59 / weary 20-39 / critical 1-19: tubuh
   memberat secara cerita. empty 0: hanya pilihan canon yang bisa diambil;
   kalau tidak ada, pilihan TERAKHIR dipaksa (jalan termudah). */
function energyTier(){
  const e = (S.energy==null) ? 100 : S.energy;
  if(e<=0) return "empty";
  if(e<20) return "critical";
  if(e<40) return "weary";
  if(e<60) return "tired";
  return "fit";
}
const ENERGY_TIER_TEXT = {

              up: "Sedikit tenaga kembali ke tubuhmu." },

  critical: { down: "Penglihatanmu berkunang. Sedikit lagi kau tumbang.",
              up: "Kunang-kunang di matamu mereda." },
  empty:    { down: "Energimu habis. Tubuhmu bergerak atas kemauannya sendiri — mengikuti jalan termudah.",
              up: "Tenaga kembali mengalir. Kau bisa berpikir lagi." },

/* Indikator melayang "-4 ⚡" di titik tap */
function floatEnergy(n, x, y){

/* Index pilihan yang dipaksa saat energi 0 (-1 = tidak perlu) */
function forcedChoiceIdx(choices){
  if((S.energy==null?100:S.energy)>0) return -1;
  const anyOpen = choices.some(c=>!isChoiceLocked(c));
  return anyOpen ? -1 : choices.length-1;
}

/* ---------- DADU (Kebingungan Akut) ---------- */
function rollDie(sides){ return 1 + Math.floor(Math.random()*Math.max(1, (sides||6))); }

/* ---------- EVALUATOR KONDISI (pilihan bersyarat) ---------- */
function condMet(w){
  if(!w) return true;
  if(w.wounded!==undefined && isWoundedLike()!==!!w.wounded) return false;
  if(w.inDanger!==undefined && (S.status==="danger")!==!!w.inDanger) return false;
  if(w.mentalMax!==undefined && S.mental > +w.mentalMax) return false;
  if(w.mentalMin!==undefined && S.mental < +w.mentalMin) return false;
  if(w.tier) for(const k of Object.keys(w.tier)){
    const c=w.tier[k], t=tierGet(k);
    if(c.min!==undefined && t < +c.min) return false;
    if(c.max!==undefined && t > +c.max) return false;
    if(c.eq!==undefined && t !== +c.eq) return false;
  }
  if(w.emotion) for(const k of Object.keys(w.emotion)){
    const c=w.emotion[k], v=emotionGet(k);
    if(c.min!==undefined && v < +c.min) return false;
    if(c.max!==undefined && v > +c.max) return false;
  }
  if(w.hasItem && !S.items.some(it=>it.id===w.hasItem)) return false;
  if(w.favor) for(const k of Object.keys(w.favor)){
    if(favorGet(k) < +w.favor[k]) return false;
  }
  if(w.flag) for(const k of Object.keys(w.flag)){
    if(!!(S.flags && S.flags[k]) !== !!w.flag[k]) return false;
  }
  return true;
}
/* Selesaikan target sebuah choice: branches (bersyarat) atau target biasa.
   Cabang pertama yang kondisinya terpenuhi menang — deterministik. */
function resolveChoiceTarget(c){
  if(c.branches){
    for(const b of c.branches){ if(condMet(b.when)) return b.target; }
    const fb = c.branches.find(b=>!b.when);
    return fb ? fb.target : null;
  }
  return c.target || null;
}

/* ---------- KUNCI PILIHAN (diperluas) ---------- */
function isChoiceLocked(c){
  if(c.blockedIfFlag && S.flags && S.flags[c.blockedIfFlag]) return true;
  if((S.energy==null?100:S.energy)<=0 && !c.canon) return true; /* habis: hanya jalan canon */
  if(c.requiresEnergy!=null && (S.energy==null?100:S.energy) < c.requiresEnergy) return true;
  if(c.blockedIf && (c.blockedIf==="wounded" ? isWoundedLike() : S.status===c.blockedIf)) return true;
  if(c.requiresItem && !S.items.some(it=>it.id===c.requiresItem)) return true;
  if(c.requiresEquipped && !S.equipment[c.requiresEquipped]) return true;
  if(c.requiresEquippedItem && !Object.values(S.equipment).some(e=>e&&e.id===c.requiresEquippedItem)) return true;
  if(c.requiresMentalMax!==undefined && S.mental > c.requiresMentalMax) return true;
  if(c.needsCalm && isShaken()) return true;
  if(c.requiresEmotion && Object.keys(c.requiresEmotion).some(k=>emotionGet(k) < c.requiresEmotion[k])) return true;
  if(c.blockedByEmotion && Object.keys(c.blockedByEmotion).some(k=>emotionGet(k) >= c.blockedByEmotion[k])) return true;
  return false;
}
function choiceLockNote(c){
  if(c.blockedIfFlag && S.flags && S.flags[c.blockedIfFlag])
    return `<span class="lock">${ui("lock_done")}</span>`;
  if((S.energy==null?100:S.energy)<=0 && !c.canon)
    return `<span class="lock">${ui("lock_tired")}</span>`;
  if(c.requiresEnergy!=null && (S.energy==null?100:S.energy) < c.requiresEnergy)
    return `<span class="lock">${ui("lock_energy",{n:c.requiresEnergy})}</span>`;
  if(c.blockedIf && (c.blockedIf==="wounded" ? isWoundedLike() : S.status===c.blockedIf))
    return `<span class="lock">${ui("lock_wounded")}${isLemas()&&S.status!=="wounded"?ui("lock_weary_suffix"):""}</span>`;
  if(c.requiresItem && !S.items.some(it=>it.id===c.requiresItem))
    return `<span class="lock">${ui("lock_item",{name:esc(c.requiresItemName||c.requiresItem)})}</span>`;
  if(c.requiresEquipped && !S.equipment[c.requiresEquipped])
    return `<span class="lock">${ui("lock_eq",{slot:esc(eqSlotNameL(c.requiresEquipped))})}</span>`;
  if(c.requiresEquippedItem && !Object.values(S.equipment).some(e=>e&&e.id===c.requiresEquippedItem))
    return `<span class="lock">${ui("lock_eqitem",{name:esc(c.requiresEquippedItemName||c.requiresEquippedItem)})}</span>`;
  if(c.requiresMentalMax!==undefined && S.mental > c.requiresMentalMax)
    return `<span class="lock">${ui("lock_mental",{m:esc(mentalName(c.requiresMentalMax))})}</span>`;
  if(c.needsCalm && isShaken())
    return `<span class="lock">${ui("lock_calm")}</span>`;
  if(c.requiresEmotion)
    for(const k of Object.keys(c.requiresEmotion))
      if(emotionGet(k) < c.requiresEmotion[k])
        return `<span class="lock">${ui("lock_emotion",{e:esc(emotionDisp(k))})}</span>`;
  if(c.blockedByEmotion)
    for(const k of Object.keys(c.blockedByEmotion))
      if(emotionGet(k) >= c.blockedByEmotion[k])
        return `<span class="lock">${ui("lock_emotion_block",{e:esc(emotionDisp(k))})}</span>`;
  return "";
}

/* ---------- MUTASI SAAT MEMASUKI NODE (sistem baru; field lama tetap di render masing-masing) ---------- */
function applyEnterMutations(n){
  if(!n) return;
  if(n.tierUp) n.tierUp.forEach(t=>tierUp(t));
  if(n.tierDown) n.tierDown.forEach(t=>tierDown(t));
  if(n.tierSet) Object.keys(n.tierSet).forEach(k=>tierSet(k, n.tierSet[k]));
  if(n.tierClear) n.tierClear.forEach(k=>tierSet(k, -1));
  if(n.addTemp) n.addTemp.forEach(t=>addTemp(t.n, t.nodes));
  if(n.setBody!==undefined) S.body = n.setBody;
  if(n.clearBody) S.body = null;
  if(n.setFlag){ if(!S.flags) S.flags={}; Object.keys(n.setFlag).forEach(k=>{ S.flags[k]=!!n.setFlag[k]; }); }
  if(n.clearFlag && S.flags) n.clearFlag.forEach(k=>{ delete S.flags[k]; });
  if(n.mentalWorse) mentalWorse(n.mentalWorse);
  if(n.mentalBetter) mentalBetter(n.mentalBetter);
  if(n.addEmotion) n.addEmotion.forEach(e=>addEmotion(e.n, e.amt));
  if(n.setObjective!==undefined){ S.objective = n.setObjective; S.objectiveEn = n.setObjectiveEn||null; }
  if(n.clearObjective){ S.objective = null; S.objectiveEn = null; }
  if(n.favor) Object.keys(n.favor).forEach(k=>favorAdd(k, n.favor[k]));
  if(n.grantItems) n.grantItems.forEach(item=>{
    try{ if(globalThis.AudioSys) AudioSys.sfx(item.id==="boneka" ? "teddy" : "pickup"); }catch(e){}
    collAdd(item.id);
    const ex = S.items.find(x=>x.id===item.id);
    if(ex){ ex.qty = (ex.qty||1)+1; if(item.use && !ex.use) ex.use = item.use; }
    else S.items.push({ id:item.id, name:item.name, note:item.note||"",
                        icon:item.icon||"🎒", kind:item.kind||"consumable",
                        slot:item.slot||null, qty:1, use:item.use||null,
                        story:!!item.story,
                        storyHint:item.storyHint||null, storyHintEn:item.storyHintEn||null,
                        nameEn:item.nameEn||null, noteEn:item.noteEn||null });
  });
  if(n.consumeItem) (Array.isArray(n.consumeItem)?n.consumeItem:[n.consumeItem]).forEach(c=>{
    const id = typeof c==="string" ? c : c.id, qty = (c && c.qty) || 1;
    const it = S.items.find(x=>x.id===id);
    if(it){ it.qty = (it.qty||1)-qty; if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id); }
  });
}

/* ---------- SANITASI FIELD BARU (import/restore) ---------- */
function sanitizeTiers(t){
  const out = {};
  if(t && typeof t==="object") TIER_EFFECTS.forEach(k=>{
    const v = parseInt(t[k]);
    if(!isNaN(v)) out[k] = Math.max(0, Math.min(3, v));
  });
  return out;
}
function sanitizeTemp(a){
  if(!Array.isArray(a)) return [];
  return a.filter(t=>t && typeof t.n==="string").slice(0,8)
    .map(t=>({ n:t.n.slice(0,30), left:Math.max(1, Math.min(20, parseInt(t.left)||1)) }));
}
function sanitizeEmotions(e){
  const out = {};
  if(e && typeof e==="object") Object.keys(e).slice(0,10).forEach(k=>{
    const kk = String(k).slice(0,20);
    if(!kk) return;
    const v = parseInt(e[k]);
    if(!isNaN(v) && v>0) out[kk] = Math.max(1, Math.min(3, v));
  });
  return out;
}
function sanitizeFavor(f){
  const out = {};
  if(f && typeof f==="object") Object.keys(f).slice(0,20).forEach(k=>{
    const kk = String(k).slice(0,30);
    if(!kk) return;
    const v = parseInt(f[k]);
    if(!isNaN(v)) out[kk] = Math.max(-999, Math.min(999, v));
  });
  return out;
}

let tutQueue = [], tutShowing = false;
function tutPop(key){
  if(!S || !S.registered) return;
  try{ if(tutSeenGet()[key]) return; }catch(e){ return; }
  tutSeenSet(key);
  tutQueue.push(key);
  if(!tutShowing) showNextTutPop();
}
function showNextTutPop(){
  const key = tutQueue.shift();
  if(!key){ tutShowing = false; return; }
  const d = TUTPOP[key];
  if(!d){ showNextTutPop(); return; }
  tutShowing = true;
  $("#tutPopT").textContent = tutPopT(d);
  $("#tutPopH").innerHTML = tutPopH(d);
  $("#tutModal").hidden = false;
}

/* Pindai event -> popup yg relevan, berurutan dari yg paling mendesak. */
function tutPopForEvents(evts){
  if(!evts || !evts.length) return;
  let energy=false, wounded=false, tier=false, lemas=false, bingung=false,
      emotion=false, temp=false, usable=false, objective=false, favor=false;
  evts.forEach(e=>{
    if(e.type==="energy_tier" && e.changes.to!=="fit") energy = true;
    if(e.type==="status_changed" && e.changes.to==="wounded") wounded = true;
    if(e.type==="tier_changed") tier = true;
    if(e.reactionKey==="derived_lemas") lemas = true;
    if(e.reactionKey==="derived_bingung") bingung = true;
    if(e.type==="emotion_changed" && e.changes.dir==="naik") emotion = true;
    if(e.type==="temp_started") temp = true;
    if(e.type==="objective_changed") objective = true;
    if(e.type==="favor_changed") favor = true;
    if(e.type==="item_gained"){
      const it = S.items.find(x=>x.id===e.changes.id);
      if(it && it.use) usable = true;
    }
  });
  if(energy) tutPop("energy");
  if(wounded) tutPop("wounded");
  if(tier) tutPop("tier");
  if(lemas) tutPop("lemas");
  if(bingung) tutPop("bingung");
  if(emotion) tutPop("emotion");
  if(temp) tutPop("temp");
  if(usable) tutPop("usable");
  if(objective) tutPop("objective");
  if(favor) tutPop("favor");
}

function dropItem(id){
  const it = S.items.find(x=>x.id===id);
  if(!it) return;
  const before = snapshotState();
  S.items = S.items.filter(x=>x.id!==id);
  persist();
  reactAndTut(before, "drop");
  updateHUD(); openInventory();
  toast(ui("toast_drop")+itemNameL(it)+".");
}
/* EQUIP: pindah 1 item equipment dari tas ke slot perlengkapan */
function equipItem(id){
  const it = S.items.find(x=>x.id===id);
  if(!it || it.kind!=="equipment") return;
  const before = snapshotState();
  const slot = it.slot || "senjata";
  const cur = S.equipment[slot];
  if(cur){ /* slot terisi: kembalikan dulu ke tas */
    const ex = S.items.find(x=>x.id===cur.id);
    if(ex) ex.qty = (ex.qty||1)+1;
    else S.items.push({ ...cur, qty:1 });
  }
  it.qty = (it.qty||1)-1;
  if(it.qty<=0) S.items = S.items.filter(x=>x.id!==id);
  S.equipment[slot] = { id:it.id, name:it.name, note:it.note||"", icon:it.icon||"🗡", kind:"equipment", slot };
  persist();
  reactAndTut(before, "equipment");
}
/* LEPAS: kembalikan perlengkapan ke tas */
function unequipItem(slot){
  const cur = S.equipment[slot];
  if(!cur) return;
  const before = snapshotState();
  const ex = S.items.find(x=>x.id===cur.id);
  if(ex) ex.qty = (ex.qty||1)+1;
  else S.items.push({ ...cur, qty:1 });
  S.equipment[slot] = null;
  persist();
  reactAndTut(before, "equipment");
}

function sanitizeItems(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(it=>it && typeof it.id==="string" && typeof it.name==="string")
    .slice(0,60)
    .map(it=>({
      id:it.id.slice(0,40), name:String(it.name).slice(0,40),
      note:String(it.note||"").slice(0,80), icon:String(it.icon||"🎒").slice(0,8),
      kind:it.kind==="equipment"?"equipment":"consumable",
      slot:typeof it.slot==="string"?it.slot.slice(0,20):null,
      qty:Math.min(99,Math.max(1,parseInt(it.qty)||1)),
      use:(it.use && typeof it.use==="object") ? it.use : null,
      story:it.story===true,
      storyHint:typeof it.storyHint==="string" ? it.storyHint.slice(0,160) : null,
      nameEn:typeof it.nameEn==="string" ? it.nameEn.slice(0,40) : null,
      noteEn:typeof it.noteEn==="string" ? it.noteEn.slice(0,80) : null,
      storyHintEn:typeof it.storyHintEn==="string" ? it.storyHintEn.slice(0,160) : null
    }));
}
function sanitizeFlags(f){
  const out = {};
  if(f && typeof f==="object") Object.keys(f).slice(0,40).forEach(k=>{
    const kk = String(k).slice(0,30);
    if(!kk) return;
    out[kk] = !!f[k];
  });
  return out;
}
function sanitizeEquipment(eq){
  const out = {};
  EQ_SLOTS.forEach(s=>{
    const v = eq && eq[s.key];
    out[s.key] = (v && typeof v.id==="string" && typeof v.name==="string")
      ? { id:v.id.slice(0,40), name:String(v.name).slice(0,40),
          note:String(v.note||"").slice(0,80), icon:String(v.icon||"🗡").slice(0,8),
          kind:"equipment", slot:s.key }
      : null;
  });
  return out;
}
function importSave(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data = null;
    try{ data = JSON.parse(reader.result); }catch(e){}
    if(!data || data.registered!==true || typeof data.name!=="string" || !data.name.trim()){
      toast(ui("toast_invalid"));
      return;
    }
    if(loadSave() && !confirm(ui("confirm_import"))) return;
    const clean = {
      registered:true,
      name:String(data.name).slice(0,24),
      gender:data.gender==="Perempuan" ? "Perempuan" : "Laki-laki",
      deathCount:Math.max(0, parseInt(data.deathCount)||0),
      items:sanitizeItems(data.items),
      status:(data.status==="danger"||data.status==="wounded") ? data.status : null,
      mental:Math.min(4, Math.max(0, parseInt(data.mental)||0)),
      effects:Array.isArray(data.effects) ? data.effects.map(x=>String(x).slice(0,30)).slice(0,10) : [],
      equipment:sanitizeEquipment(data.equipment),
      tiers:sanitizeTiers(data.tiers), temp:sanitizeTemp(data.temp),
      emotions:sanitizeEmotions(data.emotions), favor:sanitizeFavor(data.favor),
      objective:(typeof data.objective==="string" && data.objective) ? data.objective.slice(0,80) : null,
      objectiveEn:(typeof data.objectiveEn==="string" && data.objectiveEn) ? data.objectiveEn.slice(0,80) : null,
      body:(typeof data.body==="string" && data.body) ? data.body.slice(0,40) : null,
      energy:Math.max(0, Math.min(100, parseInt(data.energy)||100)),
      flags:sanitizeFlags(data.flags),
      node:(typeof data.node==="string" && NODES[data.node]) ? data.node : "opening"
    };
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(clean)); }catch(e){}
    try{ /* gabungkan achievement & koleksi dari file (union) */
      const ao = achvGet(), co = collGet();
      if(data.achv && typeof data.achv==="object")
        Object.keys(data.achv).slice(0,40).forEach(k=>{ if(!ao.unlocked[k]) ao.unlocked[k] = data.achv[k]||Date.now(); });
      if(data.coll && typeof data.coll==="object")
        Object.keys(data.coll).slice(0,60).forEach(k=>{ if(!co.items[k]) co.items[k] = data.coll[k]||Date.now(); });
      localStorage.setItem(ACHV_KEY, JSON.stringify(ao));
      localStorage.setItem(COLL_KEY, JSON.stringify(co));
    }catch(e){}
    restoreState(clean);
    document.body.style.overflow = "";
    toast(ui("toast_imported"));
    setTimeout(()=>showStatus("continue", clean.node), 600);
  };
  reader.onerror = ()=>toast(ui("toast_read_fail"));
  reader.readAsText(file);
}

/* ---------- TYPEWRITER (lambat, vibes-building — ketuk = skip) ---------- */
function typewriter(container, paragraphs, done){
  container.innerHTML = paragraphs.map(()=>"<p></p>").join("");
  const ps = Array.from(container.children);
  let pi = 0, ci = 0, finished = false, timer = null;
  function end(){
    if(finished) return; finished = true; clearInterval(timer);
    ps.forEach((p,i)=>{ p.textContent = paragraphs[i]; });
    if(done) done();
  }
  timer = setInterval(()=>{
    if(pi >= ps.length){ end(); return; }
    ci += 1; /* ~31 huruf/detik — sepelan manusia membaca */
    ps[pi].textContent = paragraphs[pi].slice(0, ci);
    if(ci >= paragraphs[pi].length){ pi++; ci = 0; }
  }, 32);
  return end;
}

  if(/^d1_/.test(id)) return "saferoom";
  if(/^d2_/.test(id)) return "darkstare";
  if(/^d3_/.test(id)) return "teddyroom";
  if(/^d4_/.test(id)) return "corridor";
  if(/^d5_/.test(id)||id==="prolog2"||id==="opening") return "doorhub";

/* ---------- TUTORIAL 7 LANGKAH (progresif, satu langkah per layar) ---------- */
const TUT_KEY = "asylum_tutorial_v1";
const TUT_VERSION = 1;
function tutGet(){
  try{
    const raw = localStorage.getItem(TUT_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && o.v===TUT_VERSION && o.done===true) ? o : null;
  }catch(e){ return null; }
}
function tutSetDone(){
  try{
    let o = {};
    try{ o = JSON.parse(localStorage.getItem(TUT_KEY)) || {}; }catch(e){}
    o.v = TUT_VERSION; o.done = true; o.at = Date.now();
    localStorage.setItem(TUT_KEY, JSON.stringify(o));
  }
  catch(e){ /* localStorage gagal: tutorial tetap bisa dipakai sesi ini, tidak diklaim permanen */ }
}
/* Popup yg sudah pernah tampil — disimpan di key tutorial (sekali per perangkat). */
function tutSeenGet(){
  try{ const o = JSON.parse(localStorage.getItem(TUT_KEY)); return (o && o.seen) || {}; }
  catch(e){ return {}; }
}
function tutSeenSet(key){
  try{
    let o = {};
    try{ o = JSON.parse(localStorage.getItem(TUT_KEY)) || {}; }catch(e){}
    o.seen = o.seen || {}; o.seen[key] = true;
    localStorage.setItem(TUT_KEY, JSON.stringify(o));
  }catch(e){}
}

let tutIdx = 0;
function showTutorial(){ showTutorialStep(0); } /* entry — SENGAJA tidak menyentuh S */
function showTutorialStep(i){
  tutIdx = Math.max(0, Math.min(TUT_STEPS.length-1, i));
  const st = TUT_STEPS[tutIdx], last = tutIdx===TUT_STEPS.length-1;
  document.body.style.overflow = "";
  document.onkeydown = (e)=>{
    if(e.key==="ArrowRight" && !last) showTutorialStep(tutIdx+1);
    else if(e.key==="ArrowLeft" && tutIdx>0) showTutorialStep(tutIdx-1);
  };
  const dots = TUT_STEPS.map((_,k)=>
    `<span class="${k===tutIdx?"on":k<tutIdx?"done":""}" aria-hidden="true"></span>`).join("");
  app.innerHTML = `
    <div class="screen tut">
      <div class="tut-progress">${ui("tut_step_of",{a:tutIdx+1,b:TUT_STEPS.length})}</div>
