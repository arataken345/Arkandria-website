  rec_desk_floor: {"id": "rec_desk_floor", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau meraba dalam kegelapan kolong meja, jari-jarimu menyapu lantai yang dingin dan berpasir. Lalu \u2014 sentuhan logam. Kecil, bulat, dingin menusuk, dengan permukaan kasar yang menggores kulitmu. Jantungmu berdebar sedikit lebih kencang, tanpa alasan yang jelas.", "Kau menariknya keluar ke cahaya: sebuah koin logam tua, permukaannya begitu kusam hingga nyaris hitam, tepiannya terkikis waktu. Tidak ada ukiran yang bisa dikenali, tidak ada kilau, tidak ada makna. Tidak istimewa \u2014 tapi nyata, berat di telapak tanganmu, sebuah benda yang pernah disentuh tangan orang lain di tempat yang sudah lama mati ini."], "storyEn": ["You grope through the darkness beneath the desk, your fingers sweeping the cold, gritty floor. Then \u2014 the touch of metal. Small, round, piercingly cold, with a rough surface that scrapes your skin. Your heart beats a little faster, for no clear reason.", "You draw it out into the light: an old metal coin, its surface so tarnished it is nearly black, its edges worn away by time. No recognizable engraving, no shine, no meaning. Nothing special \u2014 but real, heavy in your palm, an object once touched by other hands in this long-dead place."], "next": "rec_desk_floor_2"},
  rec_desk_floor_2: {"id": "rec_desk_floor_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Koin itu tergeletak di telapak tanganmu yang kotor, dinginnya perlahan meresap ke kulitmu, seolah menuntut sebuah keputusan."], "storyEn": ["The coin lies in your grimy palm, its cold slowly seeping into your skin, as if demanding a decision."], "choices": [{"text": "Ambil koin itu", "textEn": "Take the coin", "target": "rec_coin"}, {"text": "Biarkan saja di sana", "textEn": "Leave it where it is", "target": "rec_desk_back"}]},
  rec_desk_rubble: {"id": "rec_desk_rubble", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau menggeser puing-puing itu satu per satu: pecahan ubin yang tajam seperti gigi, sebuah cangkir kertas yang penyok dan menguning, pulpen plastik yang tintanya sudah lama kering. Sampah-sampah biasa dari sebuah kehidupan yang sudah berhenti.", "Lalu matamu menangkap selembar kertas robek, terjepit di bawah pecahan ubin. Di atasnya, dengan tinta yang memudar, tertulis setengah kalimat: '...jangan percaya...' \u2014 dan sisanya hilang, terkoyak bersama separuh kertas yang tak pernah ditemukan. Jari-jarimu gemetar sedikit saat memegangnya.", "Kau mengobrak-abrik sisa puing itu, tapi tidak ada lagi. Hanya debu yang beterbangan dan menempel di tenggorokanmu, dan bau apek yang semakin pekat, seolah tempat ini kecewa kau tidak menemukan apa-apa."], "storyEn": ["You shift the rubble piece by piece: tile shards sharp as teeth, a dented yellowing paper cup, a plastic pen long dry of ink. Ordinary trash from a life that has already stopped.", "Then your eyes catch a torn scrap of paper, trapped beneath a tile shard. On it, in fading ink, half a sentence is written: '...don't trust...' \u2014 and the rest is gone, torn away with the missing half of the page. Your fingers tremble slightly as you hold it.", "You rummage through the remaining rubble, but there is nothing more. Only dust that swirls and clings to your throat, and the musty smell growing thicker, as though this place is disappointed you found nothing."], "next": "rec_desk_rubble_2"},
  rec_desk_rubble_2: {"id": "rec_desk_rubble_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Puing itu tidak menyimpan apa-apa lagi \u2014 hanya bisu, debu, dan bau lapuk yang menempel di pakaianmu."], "storyEn": ["The rubble holds nothing more \u2014 only silence, dust, and the smell of decay clinging to your clothes."], "choices": [{"text": "Kembali berdiri", "textEn": "Stand back up", "target": "rec_desk_back"}]},
  rec_coin: {"id": "rec_coin", "kind": "result", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau memungut koin itu. Kusam, ringan, biasa saja \u2014 dinginnya menusuk telapak tanganmu sesaat sebelum perlahan menghangat oleh panas tubuhmu. Tidak ada ukiran rahasia, tidak ada petunjuk tersembunyi, tidak ada bisikan dari masa lalu.", "Hanya sebuah koin tua. Benda mati dari tempat yang mati. Kau menyimpannya ke dalam saku \u2014 bukan karena berharga, tapi karena di tempat seperti ini, sesuatu yang nyata terasa lebih baik daripada tidak memegang apa-apa."], "storyEn": ["You pick up the coin. Tarnished, light, utterly ordinary \u2014 its cold stings your palm for a moment before slowly warming against your body heat. No secret engraving, no hidden clue, no whisper from the past.", "Just an old coin. A dead thing from a dead place. You slip it into your pocket \u2014 not because it is valuable, but because in a place like this, holding something real feels better than holding nothing."], "next": "reception_hub", "status": "safe", "tag": "[Aman]", "setFlag": {"rec_coin": true, "rec_desk": true}, "grantItems": [{"icon": "\ud83e\ude99", "id": "koin_logam", "kind": "consumable", "name": "Koin Logam Kusam", "nameEn": "Tarnished Metal Coin", "note": "Barang tak berguna", "noteEn": "A useless trinket"}], "tagEn": "[Safe]"},
  rec_desk_back: {"id": "rec_desk_back", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau berdiri, menepuk debu dari lututmu hingga awan kelabu kecil beterbangan di udara. Area meja tidak menyimpan apa-apa lagi \u2014 hanya bangkai kayu tua dan tumpukan kertas yang akan terus membusuk dalam diam.", "Di belakangmu, pertigaan itu menunggumu kembali: lorong kiri yang gelap gulita, lorong kanan dengan cahaya redupnya, dan suara-suara aneh yang tak pernah benar-benar pergi."], "storyEn": ["You stand, brushing the dust from your knees until a small gray cloud drifts into the air. The desk area holds nothing more \u2014 only the carcass of old wood and stacks of paper that will keep rotting in silence.", "Behind you, the junction waits for your return: the pitch-dark left corridor, the right corridor with its dim light, and the strange voices that never truly go away."], "next": "reception_hub", "setFlag": {"rec_desk": true}},
  rec_left_1: {"id": "rec_left_1", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau melangkah ke lorong kiri, dan seketika dunia di belakangmu terasa runtuh. Udara di sini berbeda \u2014 lebih dingin, lebih lembap, lebih berat, seperti paru-paru tempat ini sendiri sedang membusuk perlahan. Setiap langkahmu bergema pelan di lantai beton, sebuah bunyi yang tidak pantas terdengar sendirian di tempat sepi ini.", "Kegelapan di lorong ini lebih tebal, lebih rakus. Ia menelan cahaya dari pertigaan di belakangmu satu langkah demi langkah, sampai yang tersisa hanyalah selaput hitam yang menutup di sekelilingmu. Lorong ini pendek \u2014 kau merasakannya dari cara dinding-dindingnya menutup di kejauhan \u2014 tetapi setiap meter terasa seperti ditarik mundur ke dalam sebuah rahang yang perlahan menutup."], "storyEn": ["You step into the left corridor, and at once the world behind you seems to collapse. The air here is different \u2014 colder, damper, heavier, as if the very lungs of this place were slowly rotting. Every footstep of yours echoes softly across the concrete floor, a sound that has no business being heard alone in a place this abandoned.", "The Darkness in this corridor is thicker, hungrier. It swallows the light from the junction behind you step by step, until all that remains is a veil of black closing in around you. This corridor is short \u2014 you can feel it in the way the walls close in far ahead \u2014 but every meter feels like being dragged backward into a jaw that is slowly shutting."], "next": "rec_left_2"},
  rec_left_2: {"id": "rec_left_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Di ujung lorong \u2014 tanpa pintu samping, tanpa celah apa pun \u2014 berdiri sebuah pintu baja tebal. Logamnya memantulkan sisa cahaya dengan dingin, kusam, dan tak bersahabat. Lorong ini buntu. Kakimu telah membawamu sejauh ia bisa melangkah, dan satu-satunya yang menunggumu di sini hanyalah diamnya baja itu."], "storyEn": ["At the end of the corridor \u2014 no side doors, no gaps anywhere \u2014 stands a thick steel door. Its metal reflects the dying light coldly, dully, without welcome. This corridor is a dead end. Your feet have carried you as far as they can go, and the only thing waiting for you here is the silence of that steel."], "choices": [{"text": "Melangkah perlahan ke pintu baja", "textEn": "Step slowly toward the steel door", "target": "rec_left_door"}, {"text": "Kembali ke pertigaan", "textEn": "Return to the junction", "target": "rec_left_back"}]},
  rec_left_door: {"id": "rec_left_door", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau menatap pintu baja itu dari dekat, dan napasmu tercekat. Ia terkunci rapat \u2014 tidak ada gagang, tidak ada lubang kunci, bahkan tidak ada celah yang cukup lebar untuk menyelipkan ujung jari. Permukaannya dingin dan licin di bawah sentuhanmu, seperti kulit hewan yang sudah lama mati.", "Lalu kau melihatnya. Goresan-goresan dalam membelah permukaan baja itu, berulang dan sejajar \u2014 bekas cakaran. Kau menelan ludah; tidak ada manusia yang cakarnya sanggup menembus logam setebal ini. Sesuatu yang jauh lebih kuat dari manusia pernah mencoba mendobrak... dari sisi lain."], "storyEn": ["You stare at the steel door up close, and your breath catches. It is locked tight \u2014 no handle, no keyhole, not even a gap wide enough to slip a fingertip through. Its surface feels cold and slick beneath your touch, like the skin of an animal long dead.", "Then you see them. Deep scratches carve across the steel, repeated and parallel \u2014 claw marks. You swallow hard; no human's claws could cut through metal this thick. Something far stronger than any human once tried to break through... from the other side."], "next": "rec_left_door_2"},
  rec_left_door_2: {"id": "rec_left_door_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Pintu itu diam \u2014 diam yang tidak wajar, diam yang seolah sedang menahan napas. Dari celah tipis di bawahnya merembes bau besi berkarat, dan di baliknya... sesuatu yang busuk, samar, seperti daging yang dibiarkan membusuk di ruangan tanpa udara. Bau itu membuat perutmu mual."], "storyEn": ["The door is silent \u2014 a silence that feels wrong, a silence that feels like it is holding its breath. From the thin gap beneath it seeps the smell of rusted iron, and beneath that... something rotten, faint, like meat left to rot in an airless room. The smell turns your stomach."], "choices": [{"text": "Dorong pintu baja itu", "textEn": "Shove the steel door", "target": "rec_left_push"}, {"text": "Telusuri goresan di permukaan pintu", "textEn": "Examine the scratches on the surface", "target": "rec_left_scratch"}, {"text": "Kembali ke pertigaan", "textEn": "Return to the junction", "target": "rec_left_back"}]},
  rec_left_push: {"id": "rec_left_push", "kind": "result", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau menahan napas dan mendorong sekuat tenaga \u2014 bahumu menabrak logam yang dingin itu, otot-ototmu menegang sampai gemetar. Pintu itu tidak bergeming sedikit pun, seolah telah dilas mati oleh dunia ini sendiri.", "Lalu \u2014 dentum pelan, dalam, yang menggema di dadamu seperti jantung kedua. Hening. Dan dari sisi lain pintu itu... terdengar sesuatu yang bergeser. Pelan. Berat. Menjauh, atau mendekat \u2014 kau tidak bisa tahu. Kakimu memutuskan lebih dulu daripada kepalamu: kau mundur, tangan gemetar, napas tercekat di tenggorokan."], "storyEn": ["You hold your breath and push with all your strength \u2014 your shoulder slams into the cold metal, your muscles straining until they shake. The door does not move a single inch, as if it has been welded shut by this world itself.", "Then \u2014 a low, deep thud that echoes in your chest like a second heartbeat. Silence. And from the other side of that door... something shifts. Slowly. Heavily. Away, or closer \u2014 you cannot tell. Your legs decide before your head does: you back away, hands trembling, breath caught in your throat."], "next": "reception_hub", "status": "safe", "tag": "[Aman]", "setFlag": {"rec_left": true}, "addEmotion": [{"amt": 1, "n": "Takut"}], "tagEn": "[Safe]"},
  rec_left_scratch: {"id": "rec_left_scratch", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Ujung jarimu menelusuri goresan itu, dan kau merasakan logam yang terkoyak \u2014 dalam, kasar, tak kenal ampun. Goresan-goresan itu berulang dalam pola sejajar, ritmis, seperti cakaran yang menyerang lagi dan lagi. Terlalu lebar untuk tangan manusia. Terlalu dalam untuk sesuatu yang bukan binatang... atau sesuatu yang lebih buruk dari binatang.", "Dan kemudian darahmu menjadi es. Sudut-sudut sobekannya \u2014 kau melihatnya sekarang \u2014 menunjuk ke dalam, ke arahmu. Goresan ini tidak dibuat dari sisi luar. Goresan ini berasal dari SISI DALAM pintu. Sesuatu di balik baja itu pernah mencoba... KELUAR."], "storyEn": ["Your fingertips trace the scratches, and you feel the torn metal \u2014 deep, jagged, merciless. The marks repeat in parallel patterns, rhythmic, like claws striking again and again. Too wide for a human hand. Too deep for anything that isn't an animal... or something worse than an animal.", "And then your blood turns to ice. The angles of the tears \u2014 you see them now \u2014 point inward, toward you. These scratches were not made from the outside. These scratches came from the INSIDE of the door. Something behind that steel once tried to get... OUT."], "next": "rec_left_door_2"},
  rec_left_back: {"id": "rec_left_back", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau melangkah mundur perlahan, kaki terseret, tidak pernah melepaskan pandangan dari pintu baja itu. Setiap langkah mundur terasa seperti menarik dirimu keluar dari mulut sesuatu yang sedang tidur.", "Di pertigaan, cahaya menyambutmu dengan samar \u2014 dan baru di sana kau menyadari napasmu memburu, keringat dingin membasahi tengkuk. Kau telah kembali. Tetapi di punggungmu, lorong kiri itu tetap menganga, dan kau tidak berani membelakanginya terlalu lama."], "storyEn": ["You step backward slowly, feet dragging, never letting the steel door out of your sight. Every step back feels like pulling yourself out of the mouth of something asleep.", "At the junction, the light greets you faintly \u2014 and only there do you realize your breath is coming fast, cold sweat beading on your neck. You have returned. But behind you, the left corridor still gapes open, and you do not dare turn your back on it for long."], "next": "reception_hub", "setFlag": {"rec_left": true}},
  rec_papers_1: {"id": "rec_papers_1", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau mendekati meja resepsionis. Di atasnya: tumpukan kertas berdebu, beberapa terikat tali yang sudah lusuh dan lapuk, tepi-tepinya menguning dimakan waktu. Debu beterbangan di udara saat kau bergerak, menari dalam cahaya samar seperti abu dari sesuatu yang terbakar lama.", "Lembar paling atas menyambutmu dengan tulisan tangan yang besar dan tergesa: 'Eksperimen Subjek ke-X'. Huruf-hurufnya miring, ditekan keras sampai menembus kertas. Jantungmu berdebar begitu keras hingga kau yakin lorong-lorong kosong ini bisa mendengarnya."], "storyEn": ["You approach the reception desk. On top of it: a stack of dusty papers, some bound with string gone frayed and brittle, their edges yellowed by time. Dust rises into the air as you move, dancing in the faint light like ash from something burned long ago.", "The topmost sheet greets you with large, hurried handwriting: 'Experiment: Subject X'. The letters slant, pressed hard enough to tear the paper. Your heart pounds so loudly you are certain these empty corridors can hear it."], "next": "rec_papers_2"},
  rec_papers_2: {"id": "rec_papers_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kertas-kertas itu menunggu \u2014 diam, sabar, seolah mereka sudah menunggu seseorang selama bertahun-tahun. Ujung-ujungnya bergetar diterpa udara dingin... atau itu tanganmu yang gemetar. Kau tidak bisa lagi membedakannya."], "storyEn": ["The papers wait \u2014 silent, patient, as if they have been waiting for someone for years. Their edges tremble in the cold air... or is that your hand shaking. You can no longer tell the difference."], "choices": [{"text": "Baca lembar paling atas", "textEn": "Read the topmost sheet", "target": "rec_papers_read", "doneFlag": "rec_read", "blockedIfFlag": "rec_read", "doneText": "\u2713 Lembar paling atas sudah dibaca", "doneTextEn": "\u2713 Topmost sheet already read"}, {"text": "Lihat foto-foto terlampir", "textEn": "Look at the attached photos", "target": "rec_papers_photos", "doneFlag": "rec_photos", "blockedIfFlag": "rec_photos", "doneText": "\u2713 Foto-foto sudah dilihat", "doneTextEn": "\u2713 Attached photos already viewed"}, {"text": "Ambil beberapa lembar yang utuh", "textEn": "Take a few intact sheets", "target": "rec_papers_take", "canon": true}]},
  rec_papers_read: {"id": "rec_papers_read", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Catatan itu ditulis dengan ketenangan yang menjijikkan. Setiap halaman menjabarkan prosedurnya secara rinci dan dingin \u2014 bagaimana seorang manusia dibelah, dipotong-potong, lalu disusun ulang dengan bagian-bagian yang tidak semestinya menempel pada tubuh siapa pun. Langkah demi langkah, tanpa ragu, sampai yang tersisa tidak lagi bisa disebut manusia. Hanya disebut sebagai... subjek.", "Lambungmu bergejolak, asam naik sampai ke tenggorokan dan membakar. Tapi jemarimu terus membalik halaman, seolah tanganmu bergerak sendiri. Kau harus tahu. Kau harus tahu apa yang telah mereka lakukan di sini \u2014 dan apa yang mungkin sudah menunggumu di luar ruangan ini.", "Setiap baris lebih buruk dari baris sebelumnya. Dan di suatu tempat di dalam kepalamu, sebuah suara kecil mulai bertanya dengan nada yang tidak ingin kau dengar: apakah mereka juga melakukan ini pada orang-orang sepertimu? Orang-orang yang terbangun tanpa ingatan apa pun?"], "storyEn": ["The notes are written with a sickening calm. Each page lays out the procedure in cold, painstaking detail \u2014 how a human being is cut open, taken apart, and reassembled with parts that should never belong to any living body. Step by step, without hesitation, until what remains can no longer be called human. Only a 'subject.'", "Your stomach churns, acid rising to your throat and burning. But your fingers keep turning the pages, as if your hands are moving on their own. You have to know. You have to know what they did here \u2014 and what might already be waiting for you beyond this room.", "Every line is worse than the one before. And somewhere inside your head, a small voice begins to ask in a tone you do not want to hear: did they do this to people like you? People who wake up remembering nothing?"], "next": "rec_papers_2", "setFlag": {"rec_read": true}, "addEmotion": [{"amt": 1, "n": "Takut"}]},
  rec_papers_photos: {"id": "rec_papers_photos", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Di antara tumpukan kertas, ada amplop cokelat yang berat berisi foto-foto hitam putih. Yang gagal \u2014 dan yang, menurut tulisan tangan di bagian belakangnya, 'berhasil'. Tubuh-tubuh yang pernah menjadi manusia, dipajang seperti barang dagangan di atas baki-baki laboratorium, difoto dengan rapi seolah itu hal biasa.", "Wajah-wajah itu masih menyerupai wajah. Itulah yang paling mengerikan. Kau memalingkan muka secepat mungkin, tapi sudah terlambat \u2014 gambar-gambar itu terbakar ke dalam kepalamu, tajam dan kejam, menolak pergi setiap kali kau berkedip.", "Tanganmu gemetar begitu hebat hingga amplop itu hampir terlepas dari genggamanmu. Kau memaksakan diri menutupnya dan melemparkannya kembali ke tumpukan, tapi bau bahan kimia dari kertas foto itu masih menempel di hidungmu, menempel seperti kenangan."], "storyEn": ["Among the stack of papers lies a heavy brown envelope of black-and-white photographs. The failures \u2014 and, according to the handwriting on the back, the 'successes.' Bodies that were once human, displayed like merchandise on laboratory trays, photographed neatly as if it were ordinary.", "The faces still resemble faces. That is the most horrifying part. You look away as fast as you can, but it is already too late \u2014 the images are burned into your head, sharp and merciless, refusing to leave every time you blink.", "Your hands shake so violently the envelope nearly slips from your grasp. You force yourself to close it and toss it back onto the pile, but the chemical smell of the photo paper still clings to your nose, clinging like a memory."], "next": "rec_papers_2", "setFlag": {"rec_photos": true}, "addEmotion": [{"amt": 1, "n": "Takut"}]},
  rec_papers_take: {"id": "rec_papers_take", "kind": "result", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Dengan tangan yang masih gemetar, kau menyambar beberapa lembar yang tampak paling utuh \u2014 yang tulisannya masih bisa terbaca, yang diagramnya belum robek. Kertasnya dingin dan licin oleh kelembapan di bawah jemarimu, dan kau melipatnya dengan hati-hati sebelum menyelipkannya jauh ke dalam saku.", "Sekarang kau mengerti. Potongan-potongan yang kau lihat bergerak dalam gelap tadi, sosok-sosok yang mengintai di sudut ruangan \u2014 mereka semua adalah hasil dari eksperimen mengerikan ini. Mereka bukan monster yang lahir dari Kegelapan. Mereka dibuat. Dengan sengaja. Oleh tangan manusia.", "Lambungmu bergejolak lagi, asam pahit membakar tenggorokanmu. Pikiranmu kacau, gambar-gambar itu terus bermunculan di balik kelopak matamu \u2014 tapi kau menyimpan catatan itu erat-erat. Di suatu tempat di dalam tulisan yang dingin itu mungkin tersembunyi kelemahan mereka. Dan kau tahu kau akan membutuhkannya."], "storyEn": ["With hands that still will not stop shaking, you snatch up the most intact pages \u2014 the ones whose writing is still legible, whose diagrams are not yet torn. The paper is cold and damp under your fingers, and you fold it carefully before tucking it deep into your pocket.", "Now you understand. The shapes you saw moving in the dark earlier, the figures lurking in the corners of the room \u2014 they are all products of this horrible experiment. They were not born of the Darkness. They were made. Deliberately. By human hands.", "Your stomach churns again, bitter acid burning your throat. Your mind is a mess, the images surfacing again and again behind your eyelids \u2014 but you clutch the notes tightly. Somewhere inside that cold writing may hide their weakness. And you know you will need it."], "next": "s12_a", "status": "safe", "tag": "[Canon]", "tierUp": ["Stress"], "setBody": "Sangat Mual", "grantItems": [{"icon": "\ud83d\udcdc", "id": "catatan_eksperimen", "kind": "consumable", "name": "Catatan Eksperimen", "nameEn": "Experiment Notes", "note": "Catatan mengerikan \u2014 mungkin ada gunanya", "noteEn": "Gruesome notes \u2014 they might be useful"}], "tutPop": "tier_tutorial", "tagEn": "[Canon]"},
  s12_a: {"id": "s12_a", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau mengikuti secercah cahaya redup yang merembes dari ujung lorong, berharap itu adalah jalan keluar. Kegelapan di belakangmu terasa menekan punggungmu seperti beban yang hidup, dan gambar-gambar dari catatan itu masih menempel di pelupuk matamu setiap kali kau berkedip \u2014 wajah-wajah itu, tubuh-tubuh itu.", "Cahaya itu ternyata berasal dari lampu darurat yang tergantung miring di langit-langit aula yang luas \u2014 kedipannya tidak beraturan, menyalakan dan memadamkan ruangan dalam denyut merah yang menyakitkan mata. Udara dipenuhi bau debu, karat, dan sesuatu yang jauh lebih busuk, sesuatu yang manis dan membusuk sekaligus.", "Kau mengintip dari balik kusen pintu yang retak \u2014 dan matamu terbelalak. Aula itu dipenuhi oleh mereka. Makhluk-makhluk hasil eksperimen, bergerak, bernapas, hidup. Puluhan. Mungkin lebih. Dan semuanya berada di antara kau dan sisi lain ruangan."], "storyEn": ["You follow the faint sliver of light seeping from the far end of the corridor, hoping it leads out. The Darkness behind you presses against your back like a living weight, and the images from the notes still cling to your eyelids every time you blink \u2014 those faces, those bodies.", "The light comes from an emergency lamp hanging crooked from the ceiling of a vast hall \u2014 flickering erratically, switching the room on and off in a sick red pulse that hurts the eyes. The air reeks of dust, rust, and something far more rotten, something sweet and decaying at once.", "You peer through the cracked doorframe \u2014 and your eyes widen. The hall is filled with them. The experiment creatures, moving, breathing, alive. Dozens. Perhaps more. And all of them stand between you and the far side of the room."], "next": "s12_b"},
  s12_b: {"id": "s12_b", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Wujud mereka adalah penghinaan terhadap segala sesuatu yang seharusnya hidup. Tungkai-tungkai tambahan tumbuh dari punggung-punggung yang bungkuk, menyeret jejak basah yang mengilap di atas lantai beton. Beberapa tubuh membesar hingga pakaiannya \u2014 kalau itu masih bisa disebut pakaian \u2014 robek dan menggantung seperti kain kafan. Kulit sebagian di antara mereka begitu tipis hingga organ-organ di bawahnya berdenyut dengan jelas, merah dan basah dan hidup.", "Sosok tinggi kurus berdiri di tengah aula, lengannya yang panjang menjuntai hingga ujung jarinya menyentuh lantai, jari-jari runcingnya menggores beton dengan bunyi berderit pelan setiap kali ia bergeser. Tidak jauh darinya, segumpalan daging merayap dengan kaki-kaki kecil yang tak terhitung jumlahnya, meninggalkan lendir asam yang mendesis pelan setiap kali menyentuh lantai.", "Dari balik pilar yang runtuh, sesuatu mengawasimu \u2014 atau mengawasi ke arahmu. Ia memiliki mata yang terlalu banyak untuk satu kepala, berbaris dan berputar masing-masing dengan caranya sendiri. Satu di antaranya berhenti, tepat mengarah padamu. Jantungmu berhenti berdetak. Lalu mata itu berputar pergi, acuh, seolah kau tidak lebih penting dari debu yang menempel di lantai."], "storyEn": ["Their forms are an insult to everything that should live. Extra limbs sprout from hunched backs, dragging wet, glistening trails across the concrete floor. Some bodies have swollen until their clothes \u2014 if they can still be called clothes \u2014 hang torn like burial shrouds. Some skins are so thin that the organs beneath pulse visibly, red and wet and alive.", "The tall gaunt one stands at the center of the hall, its long arms dangling until its fingertips touch the floor, its pointed fingers scraping the concrete with a soft screech whenever it shifts. Not far from it, a mound of flesh crawls on countless tiny legs, leaving a trail of acidic slime that hisses faintly each time it touches the floor.", "From behind a collapsed pillar, something watches you \u2014 or watches in your direction. It has too many eyes for one head, arranged in rows, each rolling in its own way. One of them stops, pointed straight at you. Your heart stops beating. Then the eye rolls away, indifferent, as if you were no more important than the dust clinging to the floor."], "next": "s12_c"},
  s12_c: {"id": "s12_c", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["DENTUMAN keras memecah udara dari sudut jauh aula \u2014 sesuatu yang besar jatuh dari langit-langit, menghantam lantai dengan gemerincing logam yang bergema panjang di antara dinding-dinding beton. Semua makhluk itu berhenti serentak, seperti satu tubuh. Puluhan kepala menoleh ke arah suara itu.", "Beberapa di antara mereka mulai bergerak ke sana, langkah-langkah berat dan gesekan daging yang diseret memenuhi ruangan. Dan di saat yang bersamaan \u2014 dari lorong belakang, dari arah meja resepsionis \u2014 terdengar gemerusuk yang keras dan tergesa-gesa, seperti sesuatu yang menyeret tubuhnya sendiri dengan panik.", "Lalu ia melesat melewatimu. Makhluk kecil gesit seukuran anjing, dengan kaki-kaki seperti serangga yang bergerak terlalu cepat untuk diikuti mata, melintas begitu dekat hingga hembusan anginnya menyentuh kulitmu. Jantungmu berhenti sesaat. Ia tidak berhenti. Ia tidak menoleh. Ia hanya... lewat, seolah kau bahkan tidak ada di sana."], "storyEn": ["A heavy CRASH splits the air from the far corner of the hall \u2014 something large has fallen from the ceiling, striking the floor with a long clatter of metal echoing between the concrete walls. Every creature stops at once, like a single body. Dozens of heads turn toward the sound.", "Several of them begin moving toward it, heavy footsteps and the scrape of dragged flesh filling the room. And at the same moment \u2014 from the corridor behind you, from the direction of the reception desk \u2014 comes a loud, hurried rustling, like something dragging its own body in a panic.", "Then it shoots past you. The swift little creature, dog-sized, with insect legs moving too fast for the eye to follow, passes so close that the rush of its wind brushes your skin. Your heart stops for a beat. It does not stop. It does not turn. It only... passes, as if you were not even there."], "next": "s12_hub"},
  s12_hub: {"id": "s12_hub", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau berdiri di ambang pintu aula, sebagian tubuhmu masih tersembunyi di balik bayangan kusen yang retak. Di depanmu, kekacauan itu bergolak \u2014 makhluk-makhluk teralihkan, perhatian mereka tercerai-berai ke berbagai arah. Ini adalah kesempatan. Atau jebakan. Udara dingin menusuk paru-parumu, dan setiap detik yang kau habiskan untuk berpikir adalah satu detik lagi kau terlihat."], "storyEn": ["You stand on the threshold of the hall, half your body still hidden in the shadow of the cracked doorframe. Before you, the chaos churns \u2014 the creatures distracted, their attention scattered in every direction. This is an opportunity. Or a trap. Cold air stings your lungs, and every second you spend thinking is one more second of being seen."], "choices": [{"text": "Lari panik kembali ke meja resepsionis", "textEn": "Flee back to the reception desk in a panic", "target": "s12_panic"}, {"text": "Bersembunyi di balik tumpukan peti tua", "textEn": "Hide behind the pile of old crates", "target": "s12_hide_1", "canon": true}, {"text": "Menyelinap melewati aula selagi mereka teralihkan", "textEn": "Slip through the hall while they are distracted", "target": "s12_run_1"}]},
  faint_killed: {"id": "faint_killed", "kind": "death",
    "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning",
    "story": ["Dunia berputar. Lututmu lemas \u2014 kegelapan menelanmu dari tepi penglihatan.",
      "Kau tidak pernah bangun.",
      "Dalam gelap, sesuatu menemukan tubuhmu yang tak berdaya... dan berpesta."],
    "storyEn": ["The world spins. Your knees buckle \u2014 darkness swallows you from the edges of sight.",
      "You never wake up.",
      "In the dark, something finds your helpless body... and feasts."],
    "next": null},
  rest_killed: {"id": "rest_killed", "kind": "death",
    "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning",
    "story": ["Kau memaksakan tubuhmu beristirahat \u2014 untuk keempat kalinya, di tempat yang sama, dengan cara yang sama.",
      "Sesuatu sudah hafal polamu. Ia bahkan tidak perlu mengendap-endap.",
      "Kau tidak pernah bangun."],
    "storyEn": ["You force your body to rest \u2014 for the fourth time, in the same place, in the same way.",
      "Something has memorized your pattern. It does not even need to sneak.",
      "You never wake up."],
    "next": null},
  s12_panic: {"id": "s12_panic", "kind": "death", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Rasa takut mengambil alih sepenuhnya. Ia tidak bertanya, tidak menunggu, tidak memberi pilihan \u2014 ia hanya menarik kakimu berbalik dan mendorong tubuhmu menjauh dari aula, dari makhluk-makhluk itu, dari segala hal yang tidak bisa kau pahami.", "Kau mencoba keluar tanpa suara, langkahmu ditahan, napasmu dicekik di tenggorokan. Tapi lorong itu tidak kosong. Beberapa pasang mata menatapmu dari dalam kegelapan \u2014 mata-mata yang sepertinya sudah menunggumu sejak awal. Dan di antara mereka, sosok tinggi kurus itu bergerak. SANGAT cepat. Terlalu cepat untuk sesuatu setinggi itu.", "Jari-jarinya yang runcing mencabik tubuhmu sebelum kau sempat berteriak, sebelum kau sempat berbuat apa-apa. Dunia menjadi merah, lalu gelap, lalu tidak ada sama sekali."], "storyEn": ["Fear takes over completely. It does not ask, it does not wait, it offers no choice \u2014 it simply turns your legs around and pushes your body away from the hall, from the creatures, from everything you cannot understand.", "You try to slip out without a sound, your steps held back, your breath strangled in your throat. But the corridor is not empty. Several pairs of eyes stare at you from within the darkness \u2014 eyes that seem to have been waiting for you all along. And among them, the tall gaunt one moves. SO fast. Too fast for something that tall.", "Its pointed fingers tear through your body before you can scream, before you can do anything at all. The world turns red, then dark, then nothing at all."], "next": "s12_hub"},
  s12_hide_1: {"id": "s12_hide_1", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau melompat ke balik tumpukan peti kayu di sudut paling gelap ruangan. Kayunya kasar dan lembap di punggungmu saat tubuhmu menekan dinding yang dingin seperti es, meringkuk sekecil mungkin di antara bayangan-bayangan yang menumpuk.", "Kau menahan napas. Bau busuk yang manis dan menusuk, bercampur dengan bau tajam bahan kimia, menyapu melewatimu saat salah satu dari mereka melintas \u2014 begitu dekat hingga kau bisa mendengar bunyi basah setiap langkahnya dan merasakan getarannya merambat melalui lantai ke tulang-tulangmu.", "Waktu berjalan dengan lambat yang menyiksa, setiap detik meregang seperti karet. Lalu sesuatu yang cepat dan BESAR melintas tepat di depanmu \u2014 bayangan raksasa yang nyaris tak terlihat \u2014 dan menghilang masuk ke dalam lorong. Kau tidak berani bernapas sampai suaranya benar-benar hilang ditelan kegelapan."], "storyEn": ["You leap behind the stack of wooden crates in the darkest corner of the room. The wood is rough and damp against your back as your body presses into the ice-cold wall, curling as small as possible among the piled shadows.", "You hold your breath. A sweet, piercing rot, mingled with the sharp sting of chemicals, washes over you as one of them passes \u2014 so close you can hear the wet sound of every step and feel its vibration traveling through the floor into your bones.", "Time crawls with agonizing slowness, every second stretching like rubber. Then something fast and HUGE sweeps past right in front of you \u2014 a giant shadow barely seen \u2014 and vanishes into the corridor. You do not dare breathe until its sound is truly swallowed by the darkness."], "next": "s12_hide_2"},
  s12_hide_2: {"id": "s12_hide_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau meringkuk di balik peti, lutut ditarik rapat ke dada. Napasmu tertahan di tenggorokan \u2014 setiap tarikan terasa seperti pengkhianatan terhadap dirimu sendiri. Di luar sana, aula masih bergolak dengan suara-suara yang tidak ingin kau kenali, dan yang bisa kau lakukan hanyalah menunggu."], "storyEn": ["You crouch behind the crates, knees drawn tight to your chest. Your breath is caught in your throat \u2014 every inhale feels like a betrayal of yourself. Out there, the hall still churns with sounds you do not want to recognize, and all you can do is wait."], "choices": [{"text": "Tahan napas. Jangan bergerak sama sekali.", "textEn": "Hold your breath. Do not move at all.", "target": "s12_hide_ok"}, {"text": "Mengintip lewat celah peti", "textEn": "Peek through the gaps in the crates", "target": "s12_peek"}, {"text": "Bersiap lari jika ketahuan", "textEn": "Get ready to run if you are spotted", "target": "s12_ready"}]},
  s12_peek: {"id": "s12_peek", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Dari celah sempit di antara peti-peti itu, dunia terpotong menjadi serpihan gelap \u2014 dan kemudian kakinya muncul. Bukan kaki manusia. Sesuatu yang terlalu panjang, dengan terlalu banyak sendi, melintas perlahan dari kiri ke kanan disertai bunyi seret yang membuat bulu kudukmu berdiri. Bersamaan dengan itu, bau busuk menusuk hidungmu \u2014 amis, lembap, seperti daging yang sudah lama membusuk di ruangan tanpa udara.", "Lalu \u2014 satu pasang kaki berhenti. Tepat di depan celahmu. Sekarang kau bisa melihatnya: matanya, kuning redup, menatap lurus ke dalam celah sempit tempat kau meringkuk. Duniamu berhenti. Tidak ada suara. Tidak ada napas. Hanya tatapan itu, menusuk, seolah ia bisa melihat ketakutanmu berdenyut di tenggorokan.", "Lalu ia pergi. Begitu saja \u2014 berbalik dengan acuh, seolah kau hanyalah bayangan yang tidak layak dikejar. Lututmu hampir lemas, dadamu meledak dengan napas yang baru berani kau ambil. Lega membanjirimu \u2014 dan bersamaan dengan itu, rasa takut yang justru lebih tajam. Karena tadi, ia hampir melihatmu."], "storyEn": ["Through the narrow gap between the crates, the world was sliced into shards of darkness \u2014 and then its legs appeared. Not human legs. Something too long, with too many joints, dragging slowly from left to right with a scraping sound that raised every hair on your skin. And with it came the stench \u2014 thick, damp, rancid, like meat left to rot in a room without air \u2014 stabbing into your nose.", "Then \u2014 one pair of legs stopped. Right in front of your crack. Now you could see them: its eyes, dim yellow, staring straight into the narrow gap where you crouched. Your world stopped. No sound. No breath. Just that gaze, piercing, as if it could see your fear pulsing in your throat.", "Then it left. Just like that \u2014 turning away with indifference, as if you were only a shadow not worth chasing. Your knees nearly gave out, your chest bursting with the breath you'd only just dared to take. Relief flooded you \u2014 and with it, a fear somehow sharper than before. Because just now, it had almost seen you."], "next": "s12_hide_2", "addEmotion": [{"amt": 1, "n": "Takut"}]},
  s12_ready: {"id": "s12_ready", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Setiap otot di tubuhmu menegang seperti tali busur yang ditarik sampai batasnya. Matamu memetakan rute dengan cepat: dari peti ini ke pintu seberang, zig-zag di antara pilar-pilar tinggi itu, memanfaatkan setiap bayangan. Tidak ada ruang untuk ragu. Satu langkah salah, dan malam ini berakhir.", "Kau mengatur napas \u2014 masuk perlahan lewat hidung, keluar lewat mulut yang hampir tak bersuara. Keringat dingin merambat di pelipismu, lengket dan menusuk dingin. Tubuhmu condong ke depan, siap melesat kapan pun. Tinggal menunggu momen yang tepat."], "storyEn": ["Every muscle in your body coiled tight like a bowstring drawn to its limit. Your eyes mapped the route in a heartbeat: from these crates to the door across the hall, zigzagging between the tall pillars, using every patch of shadow. No room for hesitation. One wrong step, and tonight ends.", "You steadied your breathing \u2014 slow in through the nose, silent out through the mouth. Cold sweat traced your temple, sticky and chilling. Your body leaned forward, ready to bolt at any instant. Now, only waiting for the right moment."], "next": "s12_ready_2"},
  s12_ready_2: {"id": "s12_ready_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Mereka masih sibuk sendiri \u2014 berpindah-pindah di antara peti, mengendus, tanpa menyadari kehadiranmu. Dan di seberang sana, pintu itu terlihat. Terbuka. Gelap. Menjanjikan sesuatu yang lebih baik daripada tempat ini. Detik ini adalah celahmu."], "storyEn": ["They were still busy with themselves \u2014 drifting between the crates, sniffing, unaware of your presence. And across from you, the door was visible. Open. Dark. Promising something better than this place. This second was your window."], "choices": [{"text": "Tetap bersembunyi", "textEn": "Stay hidden", "target": "s12_hide_ok"}, {"text": "Lari sekarang!", "textEn": "Run now!", "target": "s12_run_1"}]},
  s12_hide_ok: {"id": "s12_hide_ok", "kind": "result", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau tidak bergerak. Kau bahkan tidak bernapas. Tubuhmu merapat ke peti, menjadi satu dengan kegelapan \u2014 dingin, diam, tak berwujud. Hanya jantungmu yang berdebar, dan kau berdoa suaranya tidak keluar dari dadamu.", "Satu per satu, mereka menjauh \u2014 terpancing oleh suara yang entah datang dari mana, langkah-langkah aneh itu menyeret pergi ke sudut aula yang lain. Perlahan, aula itu kembali 'tenang'. Tenang yang palsu, tenang yang bisa pecah kapan saja, tapi tenang.", "Kau berhasil tak terdeteksi. Tapi ketakutan itu tidak ikut pergi. Ia menempel di kulitmu, di napasmu, di setiap bayangan yang bergerak \u2014 setidaknya untuk sementara, kau tidak akan bisa melupakannya."], "storyEn": ["You did not move. You did not even breathe. Your body pressed against the crates, becoming one with the darkness \u2014 cold, silent, shapeless. Only your heart hammered, and you prayed the sound would not escape your chest.", "One by one, they drifted away \u2014 lured by some sound from elsewhere, those strange steps dragging off toward another corner of the hall. Slowly, the hall returned to 'calm'. A false calm, a calm that could shatter at any moment, but calm.", "You had gone undetected. But the fear did not leave with them. It clung to your skin, your breath, every moving shadow \u2014 at least for a while, you would not be able to shake it."], "next": "s12_bridge", "status": "safe", "tag": "[Canon]", "addTemp": [{"n": "Ketakutan", "nodes": 3}], "tagEn": "[Canon]"},
  s12_run_1: {"id": "s12_run_1", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau melesat! Napas dalam membakar paru-parumu, kakimu menghantam lantai dengan bunyi gedebuk yang terdengar terlalu keras di aula yang sunyi. Beberapa pasang mata menoleh ke arahmu \u2014 lalu berpaling, acuh. Mereka tidak peduli. Belum.", "Setengah jalan. Pintu seberang semakin dekat \u2014 kau hampir bisa merasakan udara gelap di baliknya. Lalu, dari sudut matamu: gerakan cepat dari samping! Terlalu cepat untuk sesuatu sebesar itu.", "Makhluk kecil gesit itu berbelok tak terduga \u2014 bukan menjauh, melainkan ke arahmu! Kaki-kakinya yang ramping melesat di atas lantai, matanya terkunci padamu. Ia datang."], "storyEn": ["You bolted! A deep breath seared your lungs, your feet slamming the floor with thuds that sounded far too loud in the silent hall. Several pairs of eyes turned toward you \u2014 then turned away, indifferent. They didn't care. Not yet.", "Halfway there. The door across the hall drew closer \u2014 you could almost feel the dark air beyond it. Then, from the corner of your eye: a swift movement from the side! Too fast for something that size.", "The swift little creature veered without warning \u2014 not away, but toward you! Its slender legs flashed across the floor, its eyes locked on you. It was coming."], "next": "s12_run_2"},
  s12_run_2: {"id": "s12_run_2", "kind": "choice", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Ia datang cepat \u2014 terlalu cepat. Pintu tinggal beberapa langkah lagi, dan kau bisa mendengar cakar-cakar kecil itu mencakar lantai di belakangmu. Pilihanmu sekarang menentukan segalanya."], "storyEn": ["It came fast \u2014 too fast. The door was only a few steps away, and you could hear those small claws scraping the floor behind you. Your choice now decided everything."], "choices": [{"text": "Zig-zag di antara mereka", "textEn": "Weave zigzag between them", "target": "s12_run_ok"}, {"text": "Lari lurus secepat mungkin", "textEn": "Sprint straight as fast as you can", "target": "s12_run_straight"}, {"text": "Batalkan \u2014 kembali bersembunyi", "textEn": "Abort \u2014 hide again", "target": "s12_hide_1"}]},
  s12_run_straight: {"id": "s12_run_straight", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau lari lurus, secepat kaki bisa membawa. Dunia menyempit menjadi satu garis tunggal \u2014 pintu, pintu, pintu. Tidak ada lagi pilar, tidak ada lagi bayangan, hanya tujuan dan deru napasmu sendiri.", "Cakar menyambar dari samping \u2014 kau menghindar tipis, tubuhmu miring dalam sepersekian detik. Udara tersayat di dekat pipimu. Terlalu dekat. Terlalu dekat. Tapi kakimu tidak berhenti."], "storyEn": ["You ran straight, as fast as your legs could carry you. The world narrowed into a single line \u2014 door, door, door. No more pillars, no more shadows, only the goal and the roar of your own breath.", "Claws slashed from the side \u2014 you dodged by a hair, your body tilting in a fraction of a second. The air split near your cheek. Too close. Too close. But your feet did not stop."], "next": "s12_run_ok", "addEmotion": [{"amt": 1, "n": "Takut"}]},
  s12_run_ok: {"id": "s12_run_ok", "kind": "result", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Kau mencapai pintu \u2014 tapi di detik terakhir, cakarnya menyerempet kakimu. Panas menyengat meledak di kaki kirimu. Kau jatuh tersungkur melewati ambang pintu, dan ketika kau menoleh, luka robek menganga di kaki kirimu, darah merembes gelap ke kain celanamu.", "Rasa sakit menyelimuti seluruh kakimu, berdenyut mengikuti detak jantungmu. Kau berhasil lewat \u2014 tapi dengan harga. Setiap langkah kini mengingatkanmu pada makhluk kecil itu.", "Untuk sementara, kau tidak bisa berlari cepat. Kaki kirimu tidak akan mengizinkannya \u2014 dan Kegelapan tidak menunggu orang yang pincang."], "storyEn": ["You reached the door \u2014 but at the last second, its claws raked your leg. Searing heat exploded in your left leg. You stumbled through the doorway, and when you looked back, a gash gaped open on your left leg, blood seeping dark into your trousers.", "Pain swallowed your whole leg, throbbing with your heartbeat. You had made it through \u2014 but at a price. Every step now reminded you of that little creature.", "For a while, you could not run fast. Your left leg would not allow it \u2014 and The Darkness does not wait for the limping."], "next": "s12_bridge", "status": "danger", "tag": "[Terluka]", "setStatus": "wounded", "setBody": "Kaki Kiri Terluka", "tagEn": "[Wounded]"},
  s12_bridge: {"id": "s12_bridge", "kind": "story", "kicker": "Part 1 : Awal Mula", "kickerEn": "Part 1: The Beginning", "story": ["Aula parade mimpi buruk itu tertinggal di belakangmu, suaranya memudar menjadi dengung samar. Lorong di depan sunyi \u2014 terlalu sunyi, seolah tempat ini menahan napas bersamamu.", "Kakimu melangkah \u2014 atau terpincang \u2014 maju di atas lantai yang dingin. Di dalam tasmu, catatan eksperimen itu terasa berat, seolah kertas-kertas itu menyimpan sesuatu yang tidak ingin kau ketahui.", "Sesuatu menunggumu di depan. Kau bisa merasakannya di udara yang semakin dingin, di kegelapan yang semakin pekat. Cerita ini belum selesai."], "storyEn": ["The hall of the nightmare parade fell behind you, its sounds fading into a faint hum. The corridor ahead was silent \u2014 too silent, as if this place were holding its breath with you.", "Your feet stepped \u2014 or limped \u2014 forward across the cold floor. In your bag, the experiment notes felt heavy, as though those papers held something you did not want to know.", "Something waited for you ahead. You could feel it in the air growing colder, in the darkness growing thicker. This story was not over."], "next": "tbc"},
  tbc: { kind: "tbc" }
}
