<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arkandria — Coming Soon</title>
<meta name="description" content="Arkandria. Something beautiful is being built." />
<style>
  :root {
    --crimson: #dc143c;
    --crimson-soft: rgba(220, 20, 60, 0.55);
    --ink: #0a0a0f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: #f5f0f2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .glow {
    position: fixed;
    width: 60vmax; height: 60vmax;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(220,20,60,0.13) 0%, rgba(220,20,60,0.03) 40%, transparent 70%);
    filter: blur(10px);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
  }
  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    animation: rise 1.6s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .kicker {
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    font-size: 0.72rem;
    color: var(--crimson);
    text-transform: uppercase;
    margin-bottom: 1.4rem;
    font-weight: 600;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(3rem, 10vw, 6.5rem);
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    font-weight: 400;
    background: linear-gradient(180deg, #ffffff 30%, #d8c9d2 70%, #8f7d8a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1.2rem;
  }
  .rule {
    width: 72px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--crimson), transparent);
    margin: 0 auto 1.4rem;
  }
  p.sub {
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    color: #b9aeb6;
    letter-spacing: 0.08em;
    line-height: 1.9;
  }
  p.sub em { color: #e8dfe5; font-style: normal; }
  footer {
    position: fixed;
    bottom: 1.6rem; left: 0; right: 0;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #5c5258;
    z-index: 1;
  }
  footer .dot { color: var(--crimson); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="glow"></div>
<main>
  <div class="kicker">Segera Hadir</div>
  <h1>ARKANDRIA</h1>
  <div class="rule"></div>
  <p class="sub"><em>Something beautiful</em> is being built.<br />Coming soon.</p>
</main>
<footer>&copy; 2026 ARKANDRIA <span class="dot">·</span> ALL RIGHTS RESERVED</footer>
<script>
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = c.width = innerWidth; H = c.height = innerHeight;
    stars = Array.from({length: Math.min(220, W * H / 9000)}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      s: Math.random() * 0.35 + 0.05,
      p: Math.random() * Math.PI * 2,
      crimson: Math.random() < 0.12
    }));
  }
  resize(); addEventListener('resize', resize);
  (function tick(t) {
    x.clearRect(0, 0, W, H);
    for (const st of stars) {
      st.y -= st.s; if (st.y < -4) { st.y = H + 4; st.x = Math.random() * W; }
      const tw = 0.45 + 0.55 * Math.abs(Math.sin(t / 900 + st.p));
      x.beginPath();
      x.arc(st.x, st.y, st.r, 0, 7);
      x.fillStyle = st.crimson
        ? `rgba(220,20,60,${0.75 * tw})`
        : `rgba(235,228,236,${0.7 * tw})`;
      x.fill();
    }
    requestAnimationFrame(tick);
  })(0);
</script>
</body>
</html>
