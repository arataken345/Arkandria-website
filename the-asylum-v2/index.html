  /* Never let a story-content slip crash the game: inkjs throws when no
     onError handler is assigned. With a handler, the story simply ends and
     the UI shows the ending screen. (Known part1 case: a hub knot whose
     sticky choices are all exhausted has no fallback divert.) */
  try {
    this.story.onError = function () { /* recorded silently; UI treats as ending */ };
  } catch (e) {}
};

UI.continueGame = function () {
  var self = this;
  /* prefer autosave, then newest manual slot */
  var keys = ["asylum_v2_auto", "asylum_v2_slot_1", "asylum_v2_slot_2", "asylum_v2_slot_3"];
  (function next(i) {
    if (i >= keys.length) { self.startNew(); return; }
    try {
      localforage.getItem(keys[i]).then(function (raw) {
        if (raw) self.loadFromSerialized(raw);
        else next(i + 1);
      }).catch(function () { next(i + 1); });
    } catch (e) { next(i + 1); }
  })(0);
};

UI.loadFromSerialized = function (raw) {
  var inkJson;
  try { inkJson = Bridge.deserialize(raw); }
  catch (e) { this.startNew(); return; }
  this.lang = Bridge.lang || "id";
  document.documentElement.lang = this.lang;
  this.loadStoryFresh();
  try { this.story.state.LoadJson(inkJson); }
  catch (e) { this.startNew(); return; }
  this.dead = false;
  this.hideTitle();
  this._gameStarted = true;
  $("#hud").classList.add("visible");
  $("#dock").classList.add("visible");
  var self = this;
  /* Re-render current position: continue forward from restored state. */
  this.cinematic(function () { self.renderPosition(); });
};

/* Respawn: restore the last CHECKPOINT snapshot (ink ToJson/LoadJson + JS
   state), then jump to the death knot's mapped respawn target, if any
   (d5_trap -> hub_exit, s12_panic -> s12_hub). Falls back to re-rendering
   the checkpoint view, or a fresh start when nothing is available. */
UI.respawn = function () {
  var target = Bridge.respawnTargetFor(Bridge.deathKnot);
  var cp = Bridge.hasCheckpoint() ? Bridge.checkpoints[Bridge.lastCheckpoint] : null;
  if (!cp && !target) { this.startNew(); return; }
  if (cp) {
    try { this.story.state.LoadJson(cp.ink); } catch (e) { /* keep current position */ }
    Bridge.restoreState(cp.state);
  }
  var self = this;
  this.hideDeath(function () {
    self.dead = false;
    var jumped = false;
    if (target) {
      try { self.story.ChoosePathString(target); jumped = true; }
      catch (e) { jumped = false; }
    }
    if (jumped) {
      self.kicker = ""; self.tag = "";
      self.advance();
    } else if (cp && cp.view) {
      self.renderSavedView(cp.view);
    } else {
      self.renderPosition();
    }
  });
};

/* ============ Core advance loop ============ */
UI.advance = function () {
  Bridge.onKnotAdvance();
  this.renderPosition();
};

/* Drain story content at the CURRENT position (no forced forward step). */
UI.renderPosition = function () {
  var story = this.story;
  var paras = [], tags = [];
  this.knotMajor = false; /* F2: drop cap hanya jika knot bertag #MAJOR */
  var guard = 0;
  try {
    while (story.canContinue && guard++ < 200) {
      var line = story.Continue();
      var ct = story.currentTags || [];
      for (var i = 0; i < ct.length; i++) tags.push(ct[i]);
      if (line && line.trim()) paras.push(line.trim());
    }
  } catch (e) { paras.push("…"); }
  this.handleTags(tags);
  var choices = [];
  try {
    choices = story.currentChoices.map(function (c) { return { index: c.index, text: c.text, sourcePath: c.sourcePath || "" }; });
  } catch (e) {}
  var ended = !story.canContinue && choices.length === 0;
  this.renderKnot(paras, choices, ended, tags);
};

UI.handleTags = function (tags) {
  for (var i = 0; i < tags.length; i++) {
    var raw = String(tags[i] || "");
    /* tag berformat KEY:val ATAU bare KEY (mis. MAJOR) */
    var m = raw.match(/^([A-Z_]+)(?::([\s\S]*))?$/);
    if (!m) continue;
    var key = m[1], val = (m[2] || "").trim();
    if (key === "KICKER") this.kicker = val;
    else if (key === "TAG") { this.tag = val; this.updateLocation(); }
    else if (key === "AUDIO") { try { AudioSys.setAmbient(val); } catch (e) {} }
    else if (key === "SFX") { try { AudioSys.sfx(val); } catch (e) {} }  /* one-shot */
    else if (key === "IMAGE") this.setScene(val);
    else if (key === "STATUS") Bridge.applyStatusTag(val);
    else if (key === "MAJOR") this.knotMajor = true;
  }
  this.renderHUD();
};

UI.setScene = function (id) {
  var scene = $("#scene");
  if (!scene) return;
  var name = String(id || "").replace(/^bg_/, "").replace(/[^a-z0-9]/gi, "") || "default";
  var known = ["default", "corridor", "ward", "hall", "dark", "reception", "doorhub",
    "saferoom", "darkstare", "teddyroom", "steeldoor", "leftcorridor", "crates", "death", "title"];
  if (known.indexOf(name) < 0) name = "default";
  var next = "scene-" + name;
  if (scene.className !== next) {
    scene.className = next;
    /* restart the Ken Burns drift so every arrival feels like a new shot */
    try {
      scene.style.animation = "none";
      void scene.offsetWidth;
      scene.style.animation = "";
    } catch (e) {}
  }
};

/* ============ Atmospheric depth: fog, dust, parallax ============ */
UI.reducedMotion = function () {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
};

UI.initAtmosphere = function () {
  var fg = $("#scene-fg");
  if (fg && !fg.dataset.built) {
    fg.dataset.built = "1";
    var mk = function (cls, extra) {
      var d = document.createElement("div");
      d.className = cls;
      for (var k in extra) d.style[k] = extra[k];
      fg.appendChild(d);
    };
    mk("fog", {});
    mk("fog f2", {});
    /* dust motes rising through the light */
    for (var i = 0; i < 16; i++) {
      var s = (1.5 + Math.random() * 2.5).toFixed(1) + "px";
      mk("mote", {
        left: (Math.random() * 100).toFixed(1) + "%",
        top: (20 + Math.random() * 80).toFixed(1) + "%",
        width: s, height: s,
        animationDuration: (9 + Math.random() * 16).toFixed(1) + "s",
        animationDelay: (-Math.random() * 20).toFixed(1) + "s",
        opacity: (0.25 + Math.random() * 0.5).toFixed(2)
      });
    }
  }
  /* mouse parallax — layers drift at different depths */
  if (this.reducedMotion()) return;
  try {
    if (!window.matchMedia("(pointer: fine)").matches) return;
  } catch (e) { return; }
  if (this._parallaxOn) return;
  this._parallaxOn = true;
  var root = document.documentElement, raf = 0, tx = 0, ty = 0;
  var apply = function () {
    raf = 0;
    root.style.setProperty("--px", tx.toFixed(3));
    root.style.setProperty("--py", ty.toFixed(3));
  };
  document.addEventListener("mousemove", function (e) {
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
    if (!raf) raf = requestAnimationFrame(apply);
  }, { passive: true });
};

/* Cinematic location title card when the #TAG changes. */
UI.showLocCard = function (tag) {
  var card = $("#loc-card");
  if (!card || !tag || this.reducedMotion()) return;
  card.innerHTML = '<div class="lc-inner"><div class="lc-name">' + esc(tag.toUpperCase()) +
    '</div><div class="lc-rule"><span></span><i>◆</i><span></span></div></div>';
  card.classList.remove("show");
  void card.offsetWidth;
  card.classList.add("show");
};

/* Cinematic letterbox transition around a content swap. */
UI.cinematic = function (swapFn) {
  var self = this;
  if (reducedMotion()) { swapFn(); return; }
  document.body.classList.add("transitioning");
  setTimeout(function () {
    try { swapFn(); } finally {
      setTimeout(function () { document.body.classList.remove("transitioning"); }, 120);
    }
  }, 420);
};

UI.renderKnot = function (paras, choices, ended, tags) {
  var self = this;
  this.stopTypewriter();
  var view = { paras: paras.slice(), choices: choices.map(function (c) { return c.text; }),
               kicker: this.kicker, tag: this.tag, major: !!this.knotMajor };
  this.lastCheckpointView = view;

  this.cinematic(function () {
    self.buildKnotDOM(paras, choices, ended);
    self.drainBridgeEvents();
  });
};

UI.renderSavedView = function (view) {
  var self = this;
  this.stopTypewriter();
  this.kicker = view.kicker || ""; this.tag = view.tag || "";
  this.knotMajor = !!view.major;
  this.updateLocation();
  var choices = [];
  try {
    choices = this.story.currentChoices.map(function (c) { return { index: c.index, text: c.text, sourcePath: c.sourcePath || "" }; });
  } catch (e) {}
  this.cinematic(function () {
    /* paragraphs shown statically (already read once), choices live */
    self.buildKnotDOM(view.paras, choices, false, true);
    self.drainBridgeEvents();
  });
};

UI.buildKnotDOM = function (paras, choices, ended, instant) {
  var self = this;
  var area = $("#story");
  if (!area) {
    area = el("div"); area.id = "story";
    $("#app").appendChild(area);
  }
  area.innerHTML = "";
  if (this.kicker) {
    var k = el("div", "kicker", esc(this.kicker));
    area.appendChild(k);
  }
  var body = el("div", "narrative" + (this.knotMajor ? " major" : ""));
  area.appendChild(body);
  var choiceBox = el("div", "choices");
  area.appendChild(choiceBox);

  /* typewriter queue */
  this.typeQueue = paras.map(function (p) { return { el: null, text: p, parent: body }; });
  this.typeNext(instant);

  /* choices appear after typing completes */
  var showChoices = function () {
    if (ended) { self.showEnding(); return; }
    /* hardcoded choice locks (bridge.js CHOICE_LOCKS), keyed by knot name
       from the choices' sourcePath (e.g. "d5_1c.0.27" -> "d5_1c") */
    var knot = (choices.length && choices[0].sourcePath)
      ? Bridge.knotNameOf(choices[0].sourcePath) : null;
    var locked = knot ? Bridge.lockedChoiceIndices(knot) : [];
    choices.forEach(function (c, i) {
      var isLocked = locked.indexOf(i) >= 0;
      var b = el("button", "btn-choice" + (isLocked ? " locked" : ""), "");
      b.innerHTML = '<span class="cnum">' + (isLocked ? "🔒" : (i + 1)) + '</span><span>' + esc(c.text) + "</span>";
      if (isLocked) {
        b.disabled = true;
        b.setAttribute("aria-disabled", "true");
      } else {
        b.onclick = function () { self.choose(c.index); };
      }
      choiceBox.appendChild(b);
      /* staggered entrance */
      if (!reducedMotion()) {
        b.style.animationDelay = (i * 90) + "ms";
        b.classList.add("choice-in");
      }
    });
  };
  this._afterType = function () {
    /* cold open finished -> reveal the title overlay (not choices/ending) */
    if (self.coldOpen) { self.coldOpen = false; self.showTitle(); return; }
    if (!ended && choices.length) { try { AudioSys.sfx("choice_appear", { gain: 0.5 }); } catch (e) {} }
    showChoices();
  };
  body.onclick = function () { self.skipTypewriter(); };
};

UI.textSpeed = function () {
  var k = Bridge.settings && Bridge.settings.textSpeed;
  return TEXT_SPEEDS[k] || TEXT_SPEEDS[DEFAULT_TEXT_SPEED];
};

UI.typeNext = function (instant) {
  var self = this;
  var item = this.typeQueue.shift();
  if (!item) {
    this.typing = false;
    if (this._afterType) { var f = this._afterType; this._afterType = null; f(); }
    return;
  }
  var p = el("p", "para");
  item.parent.appendChild(p);
  this.typing = true;
  if (instant || reducedMotion()) {
    p.textContent = item.text;
    this.typeNext(instant);
    return;
  }
  var speed = this.textSpeed();
  var i = 0, text = item.text, sinceTick = 0;
  var tick = function () {
    i += speed.step;
    sinceTick += speed.step;
    p.textContent = text.slice(0, i);
    if (sinceTick >= 6) { sinceTick = 0; try { AudioSys.sfx("type_tick", { gain: 0.10 }); } catch (e) {} }
    if (i >= text.length) {
      self.typeTimer = null;
      setTimeout(function () { self.typeNext(instant); }, 160);
    } else {
      self.typeTimer = setTimeout(tick, speed.ms);
    }
  };
  this._typeSkip = function () {
    if (self.typeTimer) { clearTimeout(self.typeTimer); self.typeTimer = null; }
    p.textContent = text;
    setTimeout(function () { self.typeNext(instant); }, 60);
  };
  tick();
};

UI.skipTypewriter = function () {
  if (this.typing && this._typeSkip) this._typeSkip();
};

/* Complete every queued paragraph instantly (used by Esc). */
UI.finishTyping = function () {
  if (this.typeTimer) { clearTimeout(this.typeTimer); this.typeTimer = null; }
  while (this.typeQueue.length) {
    var item = this.typeQueue.shift();
    var p = el("p", "para");
    p.textContent = item.text;
    item.parent.appendChild(p);
  }
  this.typing = false;
  this._typeSkip = null;
  if (this._afterType) { var f = this._afterType; this._afterType = null; f(); }
};

UI.stopTypewriter = function () {
  if (this.typeTimer) { clearTimeout(this.typeTimer); this.typeTimer = null; }
  this.typeQueue = [];
  this.typing = false;
  this._typeSkip = null;
  this._afterType = null;
};

UI.choose = function (index) {
  if (this.dead || this.typing) return;
  var self = this;
  try { AudioSys.sfx("click"); } catch (e) {}
  Bridge.spendForChoice();
  try { this.story.ChooseChoiceIndex(index); }
  catch (e) { return; }
  this.advance();
};

UI.onKey = function (e) {
  if (this.dead) return;
  var title = $("#title-overlay");
  if (title && !title.classList.contains("hidden")) return; /* title overlay up */
  /* modal open? let it handle keys */
  if ($(".modal-open")) {
    if (e.key === "Escape") this.closeModal();
    return;
  }
  if (e.key === "Escape") {
    /* Esc saat mengetik = selesaikan teks dulu (seperti klik); Esc saat idle = buka menu. */
    if (this._gameStarted && !this.coldOpen) {
      if (this.typing) this.finishTyping();
      else this.openGameMenu();
    }
    return;
  }
  if (e.key >= "1" && e.key <= "9") {
    var btns = document.querySelectorAll("#story .btn-choice");
    var i = parseInt(e.key, 10) - 1;
    if (btns[i]) { btns[i].click(); }
  }
};

/* ============ Bridge event drain ============ */
UI.drainBridgeEvents = function () {
  var evs = Bridge.drainEvents();
  for (var i = 0; i < evs.length; i++) this.handleEvent(evs[i]);
  this.renderHUD();
  this.pumpQueues();
};

UI.handleEvent = function (ev) {
  switch (ev.t) {
    case "toast":
      this.toast(Bridge.L(ev.msg), ev.kind);
      break;
    case "float":
      this.floatText(ev.text, ev.kind);
      break;
    case "sfx":
      try { AudioSys.sfx(ev.id); } catch (e) {}
      break;
    case "hud":
      break; /* batched at end of drain */
    case "achv":
      this.achvToastQueue.push(ev.id);
      break;
    case "tutpop":
      this.eventQueue.push(ev);
      break;
    case "checkpoint":
      this.onCheckpoint(ev.name);
      break;
    case "faint":
      this.eventQueue.push(ev);
      break;
    case "death":
      this.onDeath(ev.reason);
      break;
  }
};

/* Modal-grade events are shown one at a time, in order. */
UI.pumpQueues = function () {
  var self = this;
  /* achievement toasts first */
  if (!this.achvToastShowing && this.achvToastQueue.length) {
    var id = this.achvToastQueue.shift();
    this.showAchvToast(id, function () { self.pumpQueues(); });
    return;
  }
  if (this._modalOpen) return;
  var ev = this.eventQueue.shift();
  if (!ev) return;
  if (ev.t === "tutpop") this.showTutPop(ev.id, function () { self.pumpQueues(); });
  else if (ev.t === "faint") this.showFaint(ev, function () { self.pumpQueues(); });
};

/* ============ Checkpoint ============ */
UI.onCheckpoint = function (name) {
  var self = this;
  if (Bridge.takeCheckpoint(name)) {
    /* attach the current view so respawn re-renders faithfully */
    var cp = Bridge.checkpoints[name];
    if (cp && this.lastCheckpointView) cp.view = JSON.parse(JSON.stringify(this.lastCheckpointView));
    this.toast(t("checkpoint_saved") + ": " + name, "good");
    try { AudioSys.sfx("checkpoint"); } catch (e) {}
    /* autosave */
    try {
      var raw = Bridge.serialize();
      localforage.setItem("asylum_v2_auto", raw).catch(function () {});
    } catch (e) {}
  }
};

/* ============ Death ============ */
UI.onDeath = function (reason) {
  if (this.dead) return;
  this.dead = true;
  this.stopTypewriter();
  var self = this;
  var text = reason === "faint"
    ? Bridge.L(Bridge.FAINT_TEXT.killed)
    : t("death_story");
  setTimeout(function () { self.showDeath(text); }, 900);
};

UI.showDeath = function (text) {
  var self = this;
  document.body.classList.add("dead-veil");
  var root = $("#modal-root");
  root.innerHTML = "";
  var m = el("div", "modal-open death-screen");
  m.innerHTML =
    '<div class="death-inner">' +
      '<div class="death-title">' + esc(t("death_title")) + '</div>' +
      '<p class="death-text">' + esc(text) + '</p>' +
      '<div class="death-count">' + esc(t("death_count")) + ': <b>' + Bridge.S.deaths + '</b></div>' +
      '<div class="btnrow">' +
        ((Bridge.hasCheckpoint() || Bridge.respawnTargetFor(Bridge.deathKnot))
          ? '<button class="btn-choice big" id="btnRespawn">' + esc(t("respawn")) + '</button>'
          : "") +
        '<button class="btn-choice big ghost" id="btnRestart">' + esc(t("restart")) + '</button>' +
        '<button class="btn-choice big ghost" id="btnMenu">' + esc(t("menu")) + '</button>' +
      '</div>' +
    '</div>';
  root.appendChild(m);
  this._modalOpen = true;
  var rs = $("#btnRespawn");
  if (rs) rs.onclick = function () { self.respawn(); };
  $("#btnRestart").onclick = function () { self.hideDeath(function () { self.startNew(); }); };
  $("#btnMenu").onclick = function () {
    self.hideDeath(function () {
      document.body.classList.remove("dead-veil");
      $("#hud").classList.remove("visible");
      $("#dock").classList.remove("visible");
      self.showTitle();
    });
  };
};

UI.hideDeath = function (cb) {
  document.body.classList.remove("dead-veil");
  $("#modal-root").innerHTML = "";
  this._modalOpen = false;
  if (cb) cb();
};

/* Jump the story to a named knot; if the knot is missing, show death instead. */
UI.gotoKnotOrDeath = function (knot, deathReason) {
  var ok = true;
  try { this.story.ChoosePathString(knot); }
  catch (e) { ok = false; }
  if (ok) {
    this.kicker = ""; this.tag = "";
    this.advance(); /* renderKnot wraps its own cinematic transition */
  } else {
    this.onDeath(deathReason || "story");
  }
};

/* ============ Faint interlude ============ */
UI.showFaint = function (ev, done) {
  var self = this;
  var txt = Bridge.L(Bridge.FAINT_TEXT[ev.outcome] || Bridge.FAINT_TEXT.safe);
  if (ev.outcome === "stolen" && ev.item) {
    txt += " (" + Bridge.itemName(ev.item) + ")";
  }
  this.openModal(
    '<div class="faint-inner">' +
      '<div class="modal-kicker">' + esc(t("faint_title")) + '</div>' +
      '<p>' + esc(txt) + '</p>' +
      '<div class="btnrow"><button class="btn-choice big" id="mOk">' + esc(t("understood")) + '</button></div>' +
    '</div>',
    function (root) {
      $("#mOk", root).onclick = function () {
        self.closeModal();
        /* killed-by-faint: the story continues at the faint_killed knot,
           which itself calls ~ DEATH(). */
        if (ev.outcome === "killed") self.gotoKnotOrDeath("faint_killed", "faint");
        done();
      };
    }
  );
};

/* ============ Tutorial popup (single) ============ */
UI.showTutPop = function (id, done) {
  var self = this;
  var d = Bridge.TUT_POP_DEX[id];
  var title = d ? Bridge.L(d.title) : id;
  var body = d ? Bridge.L(d.body) : "";
  this.openModal(
    '<div class="tutpop-inner">' +
      '<div class="modal-kicker">' + esc(title) + '</div>' +
      '<p>' + body + '</p>' +
      '<div class="btnrow"><button class="btn-choice big" id="mOk">' + esc(t("understood")) + '</button></div>' +
    '</div>',
    function (root) {
      $("#mOk", root).onclick = function () { self.closeModal(); done(); };
    }
  );
};

/* ============ Full tutorial ============ */
UI.openTutorial = function (done) {
  var self = this, idx = 0;
  var render = function () {
    var st = TUT_STEPS[idx], last = idx === TUT_STEPS.length - 1;
    var dots = TUT_STEPS.map(function (_, k) {
      return '<span class="' + (k === idx ? "on" : k < idx ? "done" : "") + '"></span>';
    }).join("");
    self.openModal(
      '<div class="tut-inner">' +
        '<div class="tut-progress">' + esc(tf("tut_progress", idx + 1, TUT_STEPS.length)) + '</div>' +
        '<div class="tut-dots">' + dots + '</div>' +
        '<h2>' + esc(Bridge.L(st.t)) + '</h2>' +
        '<div class="tut-body">' + Bridge.L(st.h) + '</div>' +
        '<div class="btnrow">' +
          (idx > 0 ? '<button class="btn-choice ghost" id="mBack">' + esc(t("back")) + '</button>' : "") +
          (!last ? '<button class="btn-choice big" id="mNext">' + esc(t("next")) + '</button>'
                 : '<button class="btn-choice big primary" id="mNext">' + esc(t("tut_start")) + '</button>') +
        '</div>' +
        '<div class="center"><button class="mini-btn" id="mSkip">' + esc(t("skip")) + '</button></div>' +
      '</div>',
      function (root) {
        var nx = $("#mNext", root), bk = $("#mBack", root), sk = $("#mSkip", root);
        if (nx) nx.onclick = function () {
          if (last) { Bridge.S.tutDone = true; self.closeModal(); done(); }
          else { idx++; render(); }
        };
        if (bk) bk.onclick = function () { idx--; render(); };
        if (sk) sk.onclick = function () { Bridge.S.tutDone = true; self.closeModal(); done(); };
      }
    );
  };
  render();
};

/* ============ Modal plumbing ============ */
UI.openModal = function (html, wire) {
  var root = $("#modal-root");
  root.innerHTML = "";
  var m = el("div", "modal-open modal-veil");
  m.innerHTML = '<div class="modal-card">' + html + "</div>";
  root.appendChild(m);
  this._modalOpen = true;
  var self = this;
  m.addEventListener("pointerdown", function (e) {
    if (e.target === m) { self.closeModal(); self.pumpQueues(); }
  });
  if (wire) wire(m);
};

UI.closeModal = function () {
  $("#modal-root").innerHTML = "";
  this._modalOpen = false;
};

/* ============ Inventory ============ */
UI.openInventory = function () {
  var self = this;
  var S = Bridge.S;
  var rows = (S.items || []).map(function (it) {
    var dex = Bridge.itemDex(it.id);
    var name = dex ? Bridge.L(dex.name) : it.id;
    var note = dex ? Bridge.L(dex.note || dex.desc) : "";
    var icon = dex ? dex.icon : "❔";
    var btns = "";
    if (dex && dex.use) btns += '<button class="mini-btn" data-use="' + esc(it.id) + '">' + esc(t("inv_use")) + '</button>';
    if (dex && dex.slot && dex.kind !== "story") btns += '<button class="mini-btn" data-equip="' + esc(it.id) + '">' + esc(t("inv_equip")) + '</button>';
    return '<div class="inv-row">' +
      '<span class="inv-icon">' + icon + '</span>' +
      '<span class="inv-meta"><b>' + esc(name) + '</b> <i>×' + (it.qty || 1) + '</i><br><small>' + esc(note) + '</small></span>' +
      '<span class="inv-btns">' + btns + '</span></div>';
  }).join("");

  var eqRows = Bridge.EQ_SLOTS.map(function (slot) {
    var cur = (S.equipment || {})[slot.key];
    var right;
    if (cur) {
      var dex = Bridge.itemDex(cur.id);
      right = '<span class="eq-item">' + (dex ? dex.icon : "❔") + " " + esc(Bridge.itemName(cur.id)) + '</span>' +
        '<button class="mini-btn danger" data-unequip="' + esc(slot.key) + '">' + esc(t("inv_unequip")) + '</button>';
    } else {
      right = '<span class="eq-empty">' + esc(t("eq_empty")) + '</span>';
    }
    return '<div class="eq-row"><span>' + slot.icon + " " + esc(Bridge.L(slot.name)) + '</span><span class="eq-right">' + right + '</span></div>';
  }).join("");

  this.openModal(
    '<div class="modal-kicker">' + esc(t("inv_title")) + '</div>' +
    '<div class="eq-block"><div class="eq-title">' + esc(t("eq_title")) + '</div>' + eqRows + '</div>' +
    '<div class="inv-list">' + (rows || '<p class="dim">' + esc(t("inv_empty")) + '</p>') + '</div>' +
    '<div class="btnrow"><button class="btn-choice ghost" id="mClose">' + esc(t("close")) + '</button></div>',
    function (root) {
      $("#mClose", root).onclick = function () { self.closeModal(); self.pumpQueues(); };
      root.querySelectorAll("[data-use]").forEach(function (b) {
        b.onclick = function () {
          Bridge.useItem(b.getAttribute("data-use"));
          self.renderHUD(); self.openInventory();
        };
      });
      root.querySelectorAll("[data-equip]").forEach(function (b) {
        b.onclick = function () {
          Bridge.equipItem(b.getAttribute("data-equip"));
          self.renderHUD(); self.openInventory();
        };
      });
      root.querySelectorAll("[data-unequip]").forEach(function (b) {
        b.onclick = function () {
          Bridge.unequipItem(b.getAttribute("data-unequip"));
          self.renderHUD(); self.openInventory();
        };
      });
    }
  );
};

/* ============ Achievements ============ */
UI.openAchievements = function () {
  var self = this;
  var S = Bridge.S;
  var cards = Bridge.ACHV.map(function (a) {
    var un = !!(S.achv && S.achv[a.id]);
    return '<div class="achv-card' + (un ? " un" : "") + '">' +
      '<div class="achv-icon">' + (un ? a.icon : "🔒") + '</div>' +
      '<div class="achv-name">' + esc(un ? Bridge.L(a.name) : t("achv_locked")) + '</div>' +
      (un ? '<div class="achv-desc">' + esc(Bridge.L(a.desc)) + '</div>' : "") +
      '</div>';
  }).join("");
  this.openModal(
    '<div class="modal-kicker">' + esc(t("achv_title")) + ' · ' +
      Object.keys(S.achv || {}).length + "/" + Bridge.ACHV.length + '</div>' +
    '<div class="achv-grid">' + cards + '</div>' +
    '<div class="btnrow"><button class="btn-choice ghost" id="mClose">' + esc(t("close")) + '</button></div>',
    function (root) {
      $("#mClose", root).onclick = function () { self.closeModal(); self.pumpQueues(); };
    }
  );
};

UI.showAchvToast = function (id, done) {
  var a = Bridge.achvDex(id);
  if (!a) { done(); return; }
  this.achvToastShowing = true;
  var box = $("#toasts");
  var d = el("div", "toast achv-toast");
  d.innerHTML = '<span class="ai">' + a.icon + '</span>' +
    '<span><b>' + esc(t("achv_unlocked_title")) + '</b><br>' + esc(Bridge.L(a.name)) + '</span>';
  box.appendChild(d);
  var self = this;
  setTimeout(function () {
    d.classList.add("out");
    setTimeout(function () { if (d.remove) d.remove(); }, 500);
    self.achvToastShowing = false;
    done();
  }, 2600);
};

/* ============ Save / Load ============ */
UI.slotKey = function (n) { return "asylum_v2_slot_" + n; };

UI.openSave = function () {
  var self = this;
  var rows = [1, 2, 3].map(function (n) {
    return '<div class="save-row" data-slot="' + n + '">' +
      '<span class="save-meta"><i>' + esc(t("slot_empty")) + '</i></span>' +
      '<span class="save-btns">' +
        '<button class="mini-btn" data-act="save">' + esc(t("slot_save")) + '</button>' +
        '<button class="mini-btn" data-act="load" disabled>' + esc(t("slot_load")) + '</button>' +
        '<button class="mini-btn danger" data-act="del" disabled>✕</button>' +
      '</span></div>';
  }).join("");
  this.openModal(
    '<div class="modal-kicker">' + esc(t("save_title")) + '</div>' +
    '<p class="dim small">' + esc(t("autosave_note")) + '</p>' +
    '<div class="save-list">' + rows + '</div>' +
    '<div class="btnrow"><button class="btn-choice ghost" id="mClose">' + esc(t("close")) + '</button></div>',
    function (root) {
      $("#mClose", root).onclick = function () { self.closeModal(); self.pumpQueues(); };
      [1, 2, 3].forEach(function (n) { self.refreshSlotRow(root, n); });
      root.querySelectorAll(".save-row").forEach(function (row) {
        var n = parseInt(row.getAttribute("data-slot"), 10);
        row.querySelector('[data-act="save"]').onclick = function () { self.saveToSlot(n); };
        row.querySelector('[data-act="load"]').onclick = function () { self.loadFromSlot(n); };
        row.querySelector('[data-act="del"]').onclick = function () {
          if (!window.confirm(t("delete_confirm"))) return;
          try {
            localforage.removeItem(self.slotKey(n)).then(function () { self.refreshSlotRow(root, n); });
          } catch (e) {}
        };
      });
    }
  );
};

UI.refreshSlotRow = function (root, n) {
  var row = root.querySelector('.save-row[data-slot="' + n + '"]');
  if (!row) return;
  var meta = row.querySelector(".save-meta");
  var btnLoad = row.querySelector('[data-act="load"]');
  var btnDel = row.querySelector('[data-act="del"]');
  try {
    localforage.getItem(this.slotKey(n)).then(function (raw) {
      if (!raw) {
        meta.innerHTML = "<i>" + esc(t("slot_empty")) + "</i>";
        btnLoad.disabled = true; btnDel.disabled = true;
        return;
      }
      var label = "", d = null;
      try {
        var parsed = JSON.parse(raw);
        d = parsed.state || {};
        label = (parsed.lang === "en" ? "EN · " : "ID · ") +
          (d.deaths || 0) + "☠ · " + (d.knotsVisited || 0) + " " + t("knots");
        if (parsed.at) label += " · " + new Date(parsed.at).toLocaleDateString();
      } catch (e) { label = t("slot_saved"); }
      meta.textContent = label;
      btnLoad.disabled = false; btnDel.disabled = false;
    }).catch(function () {});
  } catch (e) {}
};

UI.saveToSlot = function (n) {
  var self = this;
  var doSave = function () {
    try {
      var raw = Bridge.serialize();
      /* stamp save time */
      var stamped;
      try {
        var p = JSON.parse(raw); p.at = Date.now(); stamped = JSON.stringify(p);
      } catch (e) { stamped = raw; }
      localforage.setItem(self.slotKey(n), stamped).then(function () {
        self.toast(t("slot_saved"), "good");
        var root = $("#modal-root");
        if (root) self.refreshSlotRow(root, n);
      }).catch(function () {});
    } catch (e) {}
  };
  try {
    localforage.getItem(this.slotKey(n)).then(function (raw) {
      if (raw && !window.confirm(t("save_confirm_overwrite"))) return;
      doSave();
    }).catch(doSave);
  } catch (e) { doSave(); }
};

UI.loadFromSlot = function (n) {
  var self = this;
  try {
    localforage.getItem(this.slotKey(n)).then(function (raw) {
      if (!raw) return;
      self.closeModal();
      self.loadFromSerialized(raw);
    }).catch(function () {});
  } catch (e) {}
};

/* ============ Ending ============ */
UI.showEnding = function () {
  var self = this;
  var area = $("#story");
  var d = el("div", "ending");
  d.innerHTML =
    '<div class="end-title">' + esc(t("end_title")) + '</div>' +
    '<p class="dim">' + esc(t("end_sub")) + '</p>' +
    '<div class="end-stats">' + esc(t("end_stats")) + ': ' +
      esc(t("death_count")) + ' <b>' + Bridge.S.deaths + '</b> · ' +
      esc(t("knots")) + ' <b>' + Bridge.S.knotsVisited + '</b></div>' +
    '<div class="btnrow">' +
      '<button class="btn-choice big" id="btnAgain">' + esc(t("play_again")) + '</button>' +
      '<button class="btn-choice big ghost" id="btnMenu2">' + esc(t("menu")) + '</button>' +
    '</div>';
  area.appendChild(d);
  $("#btnAgain").onclick = function () { self.startNew(); };
  $("#btnMenu2").onclick = function () {
    $("#hud").classList.remove("visible");
    $("#dock").classList.remove("visible");
    self.showTitle();
  };
  try { AudioSys.setAmbient("title"); } catch (e) {}
};

/* ============ Toasts & floats ============ */
UI.toast = function (msg, kind) {
  var box = $("#toasts");
  var d = el("div", "toast" + (kind ? " " + kind : ""));
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(function () {
    d.classList.add("out");
    setTimeout(function () { if (d.remove) d.remove(); }, 500);
  }, 3000);
  while (box.children.length > 4) box.removeChild(box.firstChild);
};

UI.floatText = function (text, kind) {
  if (reducedMotion()) return;
  var s = el("span", "efloat " + (kind || ""), esc(text) + " ⚡");
  s.style.left = (window.innerWidth - 90) + "px";
  s.style.top = "86px";
  document.body.appendChild(s);
  setTimeout(function () { if (s.remove) s.remove(); }, 1000);
};

/* ============ HUD ============ */
UI.updateLocation = function () {
  var loc = $("#hud-loc");
  if (loc) loc.textContent = this.tag || "";
  /* cinematic title card when entering a new location */
  if (this.tag && this.tag !== this._lastTag) {
    var first = !this._lastTag;
    this._lastTag = this.tag;
    if (!first && this._gameStarted) {
      try { this.showLocCard(this.tag); } catch (e) {}
    }
  }
};

UI.renderHUD = function () {
  var S = Bridge.S;
  if (!S) return;
  /* mental */
  var mWrap = $("#hud-mental");
  if (mWrap) {
    var segs = "";
    for (var i = 0; i < 5; i++) segs += '<span class="mseg' + (i <= S.mental ? " on m" + S.mental : "") + '"></span>';
    mWrap.innerHTML = '<label>' + esc(t("hud_mental")) + '</label>' +
      '<div class="mbar">' + segs + '</div>' +
      '<span class="mname">' + esc(Bridge.mentalName()) + '</span>';
  }
  /* status pill */
  var pill = $("#hud-status");
  if (pill) {
    var st = S.status || "safe";
    pill.className = "status-pill st-" + st;
    pill.textContent = Bridge.statusName();
    /* atmosphere follows the body: danger flickers the light, wounds bleed the edges */
    document.body.classList.toggle("st-danger", st === "danger");
    document.body.classList.toggle("st-wounded", st === "wounded");
  }
  /* energy */
  var bar = $("#hud-energy-fill");
  if (bar) {
    var e = S.energy == null ? 100 : S.energy;
    bar.style.width = e + "%";
    bar.className = "fill et-" + Bridge.energyTier();
  }
  var eNum = $("#hud-energy-num");
  if (eNum) eNum.textContent = Math.round(S.energy == null ? 100 : S.energy);
  /* body tiers */
  var tiers = $("#hud-tiers");
  if (tiers) {
    var html = "";
    Bridge.TIER_STATS.forEach(function (s) {
      var tv = Bridge.tierGet(s);
      if (tv >= 0) {
        html += '<span class="tier-chip tl' + tv + '">' + esc(Bridge.tierStatName(s)) +
          ' · ' + esc(Bridge.tierName(tv)) + '</span>';
      }
    });
    tiers.innerHTML = html;
    tiers.style.display = html ? "" : "none";
  }
  /* emotions + temp */
  var fx = $("#hud-fx");
  if (fx) {
    var fh = "";
    for (var k in (S.emotions || {})) {
      fh += '<span class="fx-chip emo">' + esc(Bridge.emotionName(k)) + " " + "●".repeat(S.emotions[k]) + "</span>";
    }
    (S.temp || []).forEach(function (tmp) {
      fh += '<span class="fx-chip tmp">' + esc(tmp.n) + " (" + tmp.left + ")</span>";
    });
    fx.innerHTML = fh;
    fx.style.display = fh ? "" : "none";
  }
  /* death count */
  var dc = $("#hud-deaths");
  if (dc) dc.textContent = "☠ " + S.deaths;
  this.updateLocation();
};

/* ============ Game menu (F1: navigasi persisten) ============ */
UI.openGameMenu = function () {
  var self = this;
  var rows =
    '<button class="menu-row" id="mResume"><span class="mr-ic">▶</span><span>' + esc(t("continue")) + '</span></button>' +
    '<button class="menu-row" id="mSettings"><span class="mr-ic">⚙</span><span>' + esc(t("settings")) + '</span></button>' +
    '<button class="menu-row" id="mSave"><span class="mr-ic">💾</span><span>' + esc(t("save_title")) + '</span></button>' +
    '<button class="menu-row" id="mTitle"><span class="mr-ic">⌂</span><span>' + esc(t("back_to_title")) + '</span></button>' +
    '<button class="menu-row hub" id="mHub"><span class="mr-ic">⛩</span><span>' + esc(t("back_to_hub")) + '</span></button>';
  this.openModal(
    '<div class="modal-kicker">' + esc(t("game_menu")) + '</div>' +
    '<div class="menu-list">' + rows + '</div>',
    function (root) {
      $("#mResume", root).onclick = function () { self.closeModal(); self.pumpQueues(); };
      $("#mSettings", root).onclick = function () { self.openSettings(); };
      $("#mSave", root).onclick = function () { self.openSave(); };
      $("#mTitle", root).onclick = function () {
        if (Bridge.S && (Bridge.S.knotsVisited > 1 || (Bridge.S.items || []).length > 0)) {
          if (!window.confirm(t("quit_to_title_confirm"))) return;
        }
        self.closeModal();
        self.stopTypewriter();
        $("#hud").classList.remove("visible");
        $("#dock").classList.remove("visible");
        self.showTitle();
      };
      $("#mHub", root).onclick = function () { window.location.href = "../"; };
    }
  );
};

UI.openSettings = function () {
  var self = this;
  var muted = false;
  try { muted = AudioSys.isMuted(); } catch (e) {}
  var spd = (Bridge.settings && Bridge.settings.textSpeed) || DEFAULT_TEXT_SPEED;
  var seg = function (name, opts, cur) {
    return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) {
      return '<button type="button" class="' + (o.v === cur ? "on" : "") + '" data-val="' + o.v + '">' + esc(o.l) + '</button>';
    }).join("") + '</div>';
  };
  this.openModal(
    '<div class="modal-kicker">' + esc(t("settings")) + '</div>' +
    '<div class="set-row"><span>' + esc(t("language")) + '</span>' +
      seg("lang", [{ v: "id", l: "ID" }, { v: "en", l: "EN" }], self.lang) + '</div>' +
    '<div class="set-row"><span>' + esc(t("sound")) + '</span>' +
      seg("mute", [{ v: "on", l: t("sound_on") }, { v: "off", l: t("sound_off") }], muted ? "off" : "on") + '</div>' +
    '<div class="set-row"><span>' + esc(t("text_speed")) + '</span>' +
      seg("speed", [
        { v: "lambat", l: t("speed_lambat") },
        { v: "normal", l: t("speed_normal") },
        { v: "cepat", l: t("speed_cepat") }
      ], spd) + '</div>' +
    '<div class="btnrow"><button class="btn-choice ghost" id="mBack">' + esc(t("back")) + '</button></div>',
    function (root) {
      $("#mBack", root).onclick = function () { self.openGameMenu(); };
      root.querySelectorAll(".seg").forEach(function (s) {
        var name = s.getAttribute("data-seg");
        s.querySelectorAll("button").forEach(function (b) {
          b.onclick = function () {
            var v = b.getAttribute("data-val");
            s.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
            b.classList.add("on");
            if (name === "lang") {
              if (v !== self.lang) {
                self.toggleLang();
                try { $("#dock-lang").textContent = self.lang === "id" ? "EN" : "ID"; } catch (e) {}
                self.renderHUD();
              }
            } else if (name === "mute") {
              var wantMute = (v === "off");
              try { if (AudioSys.isMuted() !== wantMute) AudioSys.toggleMute(); } catch (e) {}
              try { $("#dock-mute").textContent = wantMute ? "🔇" : "🔊"; } catch (e) {}
            } else if (name === "speed") {
              try { Bridge.setTextSpeed(v); } catch (e) {}
            }
          };
        });
      });
    }
  );
};

/* ============ Dock (bottom bar) ============ */
UI.wireDock = function () {
  var self = this;
  $("#dock-menu").onclick = function () { self.openGameMenu(); };
  $("#dock-inv").onclick = function () { self.openInventory(); };
  $("#dock-achv").onclick = function () { self.openAchievements(); };
  $("#dock-save").onclick = function () { self.openSave(); };
  $("#dock-mute").onclick = function () {
    var m = AudioSys.toggleMute();
    $("#dock-mute").textContent = m ? "🔇" : "🔊";
  };
  $("#dock-lang").onclick = function () {
    self.toggleLang();
    $("#dock-lang").textContent = self.lang === "id" ? "EN" : "ID";
    /* rebuild current screen texts where cheap */
    self.renderHUD();
  };
};

/* ---------------- Boot ---------------- */
document.addEventListener("DOMContentLoaded", function () {
  UI.wireDock();
  UI.init();
});

if (typeof window !== "undefined") window.UI = UI;
if (typeof module !== "undefined" && module.exports) module.exports = UI;

})();

</script>

an, lorong terus berlanjut ke dalam kegelapan yang semakin pekat.","\n","^Apa yang akan kau lakukan?","\n","ev","str","^Mengecek pintu pertama di kiri","/str",{"VAR?":"f_d1"},"!","/ev",{"*":".^.c-0","flg":21},"ev","str","^Mengecek pintu kedua di kiri","/str",{"VAR?":"f_d2"},"!","/ev",{"*":".^.c-1","flg":21},"ev","str","^Mengecek pintu pertama di kanan","/str",{"VAR?":"f_d3"},"!","/ev",{"*":".^.c-2","flg":21},"ev","str","^Mengecek pintu kedua di kanan","/str",{"VAR?":"f_d4"},"!","/ev",{"*":".^.c-3","flg":21},"ev","str","^Terus maju meski ragu.","/str","/ev",{"*":".^.c-4","flg":20},{"c-0":["\n","ev",true,"/ev",{"VAR=":"f_d1","re":true},{"->":"d1_hub"},{"#f":5}],"c-1":["\n","ev",true,"/ev",{"VAR=":"f_d2","re":true},{"->":"d2_hub"},{"#f":5}],"c-2":["\n","ev",true,"/ev",{"VAR=":"f_d3","re":true},{"->":"d3_hub"},{"#f":5}],"c-3":["\n","ev",true,"/ev",{"VAR=":"f_d4","re":true},{"->":"d4_hub"},{"#f":5}],"c-4":["^ ",{"->":"d5_1"},"\n",{"#f":5}]}],null],"d1_hub":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","#","^MAJOR","/#","^Kau mendekati pintu paling kiri. Tertutup rapat. Engselnya berkarat — tapi gagang pintunya bersih. Terlalu bersih untuk tempat sekotor ini.","\n","^Seperti baru saja digenggam. Oleh seseorang. Atau sesuatu.","\n","^Kayunya dingin saat kau mendekat.","\n","ev","str","^Tempelkan telinga ke pintu, dengarkan dulu","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Dorong perlahan, intip lewat celah","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Buka lebar-lebar sekaligus","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d1_a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d1_b"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d1_c"},"\n",{"#f":5}]}],null],"d1_a":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Kau menempelkan telinga ke permukaan kayu yang dingin dan menahan napas.","\n","^Hening.","\n","^Kau mencoba mendengar sesuatu — apa pun — dari balik pintu. Tidak ada. Hanya dengung darah di telingamu sendiri dan... tunggu. Apakah itu detak?","\n","^Detak jantungmu sendiri, tentu saja. Pasti.","\n","^Tidak ada suara lain. Ruangan di baliknya sepertinya kosong.","\n",{"->":"d1_a2"},null],"d1_a2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Pintu itu diam. Keputusanmu?","\n","ev","str","^Buka pintunya, masuk","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Urungkan — kembali ke lorong","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d1_room"},"\n",{"#f":5}],"c-1":["^ ",{"->":"opening"},"\n",{"#f":5}]}],null],"d1_b":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Kau mendorong pintu itu satu sentimeter. Dua sentimeter. Celah tipis menganga, dan kau mengintip dengan satu mata.","\n","^Gelap. Bau lembap yang lebih pekat menyeruak keluar. Samar-samar kau bisa melihat bentuk-bentuk: meja terbalik, kaki kursi yang patah. Tidak ada gerakan.","\n","^Tapi di ujung penglihatanmu, ada sesuatu yang berkilau redup di lantai — seperti bungkus plastik.","\n",{"->":"d1_b2"},null],"d1_b2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Celah itu menunggu. Keputusanmu?","\n","ev","str","^Masuk dan periksa","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Tutup perlahan, jangan ambil risiko","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d1_room"},"\n",{"#f":5}],"c-1":["^ ",{"->":"opening"},"\n",{"#f":5}]}],null],"d1_c":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Kau menarik napas, lalu mendorong pintu itu lebar-lebar.","\n","^KRIIEEK.","\n","^Engsel berkarat itu menjerit — suaranya memantul di sepanjang lorong, terlalu keras, terlalu lama. Jantungmu berhenti sesaat. Kau berdiri mematung, menunggu. Apakah ada yang mendengar?","\n","^Satu detik. Dua detik. Tidak ada yang datang. Lorong kembali sunyi, seolah tidak terjadi apa-apa.","\n","^Ruangan di baliknya kosong dan gelap. Meja-meja terbalik. Hening.","\n",{"->":"d1_c2"},null],"d1_c2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Derit itu mungkin terdengar sampai ujung lorong. Keputusanmu?","\n","ev","str","^Masuk cepat sebelum ada yang datang","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Tutup dan mundur — terlalu berisik","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d1_room"},"\n",{"#f":5}],"c-1":["^ ",{"->":"opening"},"\n",{"#f":5}]}],null],"d1_room":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Kau melangkah masuk. Udara di sini lebih dingin, dan baunya... tua. Seperti ruangan yang sudah bertahun-tahun tidak disentuh siapa pun.","\n","^Meja-meja terbalik berserakan. Di sudut, ada noda gelap di lantai — besar, tidak beraturan, meresap ke dalam beton. Kau tidak mau terlalu memikirkan apa itu.","\n","^Di bawah salah satu meja yang masih berdiri, ada sesuatu: sebungkus plastik bening berisi roti kering. Dan di sampingnya, selembar surat terlipat yang sudah menguning.","\n","ev","str","^Ambil bungkusan itu","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Periksa noda gelap itu dulu","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d1_loot"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d1_stain"},"\n",{"#f":5}]}],null],"d1_stain":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Kau berjongkok di dekat noda itu. Warnanya cokelat kehitaman, tepinya tidak rata — merembes, bukan tumpah. Bau besi samar masih tercium jika kau mendekat.","\n","^Darah. Sudah sangat lama. Kering sepenuhnya.","\n","^Kau tidak tahu apakah itu membuatmu lega atau justru lebih takut.","\n",{"->":"d1_stain2"},null],"d1_stain2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","^Noda itu tidak menjawab apa-apa. Bungkusan di bawah meja masih di sana.","\n","ev","str","^Kembali dan ambil bungkusan itu","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Tinggalkan semuanya, keluar dari sini","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d1_loot"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d1_empty"},"\n",{"#f":5}]}],null],"d1_loot":["#","^TAG:[Aman]","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","ev","str","^roti_kering","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev","str","^surat_terlipat","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d1","re":true},"^Kau meraih bungkusan plastik itu. Roti kering — tiga potong, masih dalam kemasan. Di sampingnya, surat terlipat itu terasa rapuh di jarimu.","\n","^Kau membukanya sekilas: tulisan tangan yang gemetar. 'Maafkan aku. Aku tidak bisa pulang. Jangan cari aku.' Tidak ada nama. Tidak ada tanggal.","\n","^Kau melipatnya kembali dan menyimpan keduanya. Setidaknya, perutmu tidak akan kosong untuk sementara waktu.","\n",{"->":"opening"},null],"d1_empty":["#","^TAG:[Aman]","/#","#","^AUDIO:saferoom","/#","#","^IMAGE:bg_saferoom","/#","ev",true,"/ev",{"VAR=":"f_d1","re":true},"^Kau memutuskan bungkusan itu tidak sepadan dengan firasat burukmu. Kau keluar dan menutup pintu perlahan.","\n","^Lorong menyambutmu kembali — sama gelapnya, sama sunyinya.","\n",{"->":"opening"},null],"d2_hub":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","#","^MAJOR","/#","^Pintu kedua di kiri terbuka lebar, setengah rusak — kayunya retak, tergantung miring di satu engsel.","\n","^Di baliknya: ruang sempit yang dipenuhi lemari-lemari tua berderet, seperti arsip atau gudang penyimpanan. Bau kapur barus dan kayu lapuk menyambutmu.","\n","^Semuanya diam. Terlalu diam?","\n","ev","str","^Lempar kerikil ke dalam, dengarkan","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Masuk dan buka lemari satu per satu","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Firasat buruk — mundur","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d2_a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d2_room"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d2_c"},"\n",{"#f":5}]}],null],"d2_a":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","^Kau memungut pecahan kaca dari lantai dan melemparkannya ke dalam ruangan. KLONTANG — memantul di lantai beton, menggelinding.","\n","^Sunyi. Lalu... dari dalam salah satu lemari, terdengar bunyi pelan: tuk.","\n","^Seperti sesuatu yang jatuh. Atau bergeser.","\n","^Kau menunggu. Tidak ada lagi.","\n",{"->":"d2_a2"},null],"d2_a2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Bunyi itu tidak terulang. Keputusanmu?","\n","ev","str","^Masuk dan periksa","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Batalkan — kembali ke lorong","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d2_room"},"\n",{"#f":5}],"c-1":["^ ",{"->":"opening"},"\n",{"#f":5}]}],null],"d2_c":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","^Kau mempercayai firasatmu dan melangkah mundur.","\n","^Tidak terjadi apa-apa. Dan justru itu yang mengganggumu — keheningan ruangan itu terasa... memperhatikan.","\n",{"->":"opening"},null],"d2_room":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","^Ruangan sempit. Tiga lemari tua berderet di dinding, pintunya kusam. Bau kapur barus menusuk hidung.","\n","^Lemari pertama: pintunya sedikit terbuka. Lemari kedua: tertutup rapat. Lemari ketiga: terkunci — dan di permukaannya ada goresan-goresan panjang. Dari dalam.","\n","ev","str","^Buka lemari pertama","/str",{"VAR?":"f_d2c1"},"!","/ev",{"*":".^.c-0","flg":21},"ev","str","^Buka lemari kedua","/str",{"VAR?":"f_d2c2"},"!","/ev",{"*":".^.c-1","flg":21},"ev","str","^Periksa lemari ketiga yang terkunci","/str",{"VAR?":"f_d2c3"},"!","/ev",{"*":".^.c-2","flg":21},"ev","str","^Keluar dari ruangan ini","/str","/ev",{"*":".^.c-3","flg":20},{"c-0":["\n","ev",true,"/ev",{"VAR=":"f_d2c1","re":true},{"->":"d2_c1"},{"#f":5}],"c-1":["\n","ev",true,"/ev",{"VAR=":"f_d2c2","re":true},{"->":"d2_c2"},{"#f":5}],"c-2":["\n","ev",true,"/ev",{"VAR=":"f_d2c3","re":true},{"->":"d2_c3"},{"#f":5}],"c-3":["^ ",{"->":"d2_done"},"\n",{"#f":5}]}],null],"d2_c1":["#","^TAG:[Aman]","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev","str","^perban_kotor","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d2c1","re":true},"^Kosong. Hanya debu tebal dan bau apek. Tapi di sudut bawahnya ada sesuatu yang terlipat: sepotong kain putih kusam — perban, masih digulung, meski kotor.","\n","^Kau mengambilnya. Lebih baik daripada tidak sama sekali. Mungkin.","\n",{"->":"d2_room"},null],"d2_c2":["#","^TAG:[Aman]","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev","str","^Sedih","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev","str","^cokelat","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d2c2","re":true},"^Kau membuka lemari kedua — dan sesuatu jatuh dari rak atas: sepatu kecil. Sepatu anak.","\n","^Kau menatapnya sesaat, lalu memaksakan diri melihat isi lemari: di rak bawah ada sebatang cokelat yang masih terbungkus rapat. Sedikit meleleh, tapi utuh.","\n","^Kau mengambil cokelat itu. Sepatu itu kau biarkan. Kau tidak sanggup menyentuhnya.","\n",{"->":"d2_room"},null],"d2_c3":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","^Kau mendekati lemari ketiga. Terkunci. Goresan-goresan panjang menghiasi pintunya — dalam, berulang, seperti dibuat dengan kuku. Dari dalam.","\n","^Kau menempelkan tangan ke kayunya. Dingin.","\n",{"->":"d2_c3x"},null],"d2_c3x":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","^Lemari itu diam. Terlalu diam.","\n","ev","str","^Tempelkan telinga, dengarkan","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Jangan sentuh — jauhi","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d2_c3b"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d2_c3c"},"\n",{"#f":5}]}],null],"d2_c3b":["#","^TAG:[Aman]","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev","str","^Stress","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev","str","^Takut","/str",2,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d2c3","re":true},"^Sunyi... lalu: napas. Pelan, berat, tepat di balik kayu tipis itu.","\n","^Kau melompat mundur, jantung menghantam rusuk. Napas itu berhenti. Tidak ada lagi.","\n","^Apapun itu — ia masih di sana. Atau baru saja pergi. Kau tidak mau tahu.","\n",{"->":"d2_room"},null],"d2_c3c":["#","^TAG:[Aman]","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev","str","^Lega","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d2c3","re":true},"^Kau mundur perlahan, tidak melepaskan pandangan dari lemari itu.","\n","^Tidak terjadi apa-apa. Untuk kali ini, kehati-hatianmu terbayar.","\n",{"->":"d2_room"},null],"d2_done":["#","^TAG:[Aman]","/#","#","^AUDIO:darkstare","/#","#","^IMAGE:bg_darkstare","/#","ev",true,"/ev",{"VAR=":"f_d2","re":true},"^Kau keluar dari ruang lemari dan kembali ke lorong.","\n","^Di belakangmu, ruangan itu kembali sunyi — tapi kau tidak bisa menghilangkan perasaan bahwa keheningan itu menunggu.","\n",{"->":"opening"},null],"d3_hub":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","#","^MAJOR","/#","^Pintu pertama di kanan berayun pelan. Berderit kecil. Tidak ada angin — tapi ia bergerak, seperti dihembus sesuatu yang tidak terlihat.","\n","^Dari celahnya, kau mendengar sesuatu: detak. Pelan, berirama. Seperti... detak jantung? Atau jam?","\n","^Udara yang keluar dari celah itu dingin. Tidak wajar dinginnya.","\n","ev","str","^Ikuti suara detak itu — masuk","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Diam di ambang pintu, amati dulu","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Mundur perlahan, tutup pintu","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d3_a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d3_b"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d3_c"},"\n",{"#f":5}]}],null],"d3_a":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","^Kau melangkah masuk. Dingin langsung merayap naik dari kakimu, seperti air es.","\n","^Detak itu semakin jelas — tapi kau sadar, itu bukan jam. Terlalu tidak beraturan. Terlalu... hidup.","\n","^Lalu kau melihatnya. Di sudut ruangan, udara beriak seperti air — dan sepasang mata merah menyala membuka di dalam kegelapan yang tak berwujud.","\n","^Ia melihatmu.","\n",{"->":"d3_a2"},null],"d3_a2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","ev","str","^Takut","/str",2,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Mata merah itu menyipit. Ia mulai bergerak ke arahmu.","\n","ev","str","^Beku — jangan bergerak sama sekali","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Putar balik dan LARI","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"d3_a2a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d3_a2b"},"\n",{"#f":5}]}],null],"d3_a2a":["#","^TAG:[Dalam bahaya]","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","ev","str","^danger","/str",{"x()":"SET_STATUS","exArgs":1},"pop","/ev","\n","ev","str","^Stress","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d3","re":true},"^Kau memaksa tubuhmu diam. Jangan bernapas. Jangan berkedip.","\n","^Sosok transparan itu melayang mendekat. Dingin menusuk tulangmu saat ia mengitarimu — kau bisa merasakan kebencian memancar darinya, seperti radiasi.","\n","^Lalu... ia berhenti. Mata merah itu menyipit. Perlahan, ia mundur, melebur kembali ke dalam kegelapan ruangan.","\n","^Kau tidak tahu kenapa ia melepaskanmu. Kau tidak mau tahu. Kakimu gemetar saat kau melangkah mundur keluar.","\n",{"->":"opening"},null],"d3_a2b":["#","^TAG:[Terluka]","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","ev","str","^wounded","/str",{"x()":"SET_STATUS","exArgs":1},"pop","/ev","\n","ev","str","^Stress","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev","str","^Lengan Kiri Tergores","/str",{"x()":"SET_BODY","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d3","re":true},"^Kau berbalik dan lari — tapi ia lebih cepat.","\n","^Dingin membakar lengan kirimu saat sesuatu yang tak terlihat mencakar lewat. Kau terhuyung, tapi terus berlari, menerobos pintu dan membantingnya di belakangmu.","\n","^Napasmu memburu. Lengan kirimu perih — tiga garis merah menganga di kulitmu, dan dinginnya masih terasa menusuk sampai ke tulang.","\n","^Kau terluka. Dan kau sadar satu hal: ia tidak mengejarmu keluar. Ia hanya... menjaga ruangan itu.","\n",{"->":"opening"},null],"d3_b":["#","^TAG:[Dalam bahaya]","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","ev","str","^danger","/str",{"x()":"SET_STATUS","exArgs":1},"pop","/ev","\n","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d3","re":true},"^Kau tetap di ambang pintu, tidak masuk. Hanya mengamati.","\n","^Detak itu berlanjut. Lalu, perlahan, sepasang mata merah menyala muncul dari kegelapan — dan menatap lurus ke arahmu.","\n","^Kau tidak bergerak. Ia tidak bergerak. Waktu berhenti.","\n","^Kemudian mata itu berkedip — sekali — dan menghilang. Detak itu pun berhenti.","\n","^Pesannya jelas: ia tahu kau di sini. Dan ia membiarkanmu pergi. Untuk sekarang.","\n",{"->":"opening"},null],"d3_c":["#","^TAG:[Aman]","/#","#","^AUDIO:teddyroom","/#","#","^IMAGE:bg_teddyroom","/#","ev","str","^Stress","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d3","re":true},"^Kau mundur selangkah. Dua langkah. Tanganmu meraih gagang pintu.","\n","^Tepat saat pintu hampir tertutup, detak itu... berhenti.","\n","^Hening total. Lalu, dari balik pintu yang nyaris rapat, terdengar bunyi gesekan pelan — seperti kuku di kayu. Sekali. Dua kali.","\n","^Kau menutup pintu sepenuhnya dan mundur. Jantungmu masih berdebar lama setelahnya.","\n",{"->":"opening"},null],"d4_hub":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","#","^MAJOR","/#","^Pintu kedua di kanan lebih tenang. Dari celahnya, kau bisa melihat sebuah meja — dan di atasnya, bayangan samar.","\n","^Kau mendorong pintu itu. Ruangan kecil. Meja kayu di tengah. Dan di atasnya...","\n","^Sebuah boneka beruang. Usang, satu matanya lepas, tapi bersih — terlalu bersih untuk tempat ini. Seolah seseorang merawatnya.","\n","ev","str","^Ambil bonekanya langsung","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Periksa meja dan sekitarnya dulu","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Jangan sentuh apa pun — pergi","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d4_a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d4_b"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d4_c"},"\n",{"#f":5}]}],null],"d4_a":["#","^TAG:[Aman]","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","ev","str","^Lega","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev","str","^boneka","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d4","re":true},"^Kau mengangkat boneka itu. Ringan. Dan... hangat.","\n","^Kehangatan yang aneh menjalar ke tanganmu — seperti baru saja dipeluk seseorang. Kau merinding.","\n","^Lalu kau menyadarinya: mata boneka yang masih ada itu... menatapmu. Tadi, saat di atas meja, ia menghadap ke arah lain. Bukankah begitu?","\n","^Kau memeluknya erat-erat. Entah kenapa, benda ini terasa penting.","\n",{"->":"opening"},null],"d4_b":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","^Kau menahan diri dan memeriksa ruangan dulu. Meja itu kosong selain boneka. Tapi di bawah meja, terselip sesuatu: selembar kertas gambar anak-anak, digambar dengan crayon.","\n","^Gambarnya: sebuah keluarga — ayah, ibu, anak — bergandengan tangan. Dan di belakang mereka, sosok tinggi hitam dengan mata merah.","\n","^Crayon merahnya ditekan begitu keras sampai kertasnya sobek tepat di bagian mata itu.","\n",{"->":"d4_b2"},null],"d4_b2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","^Gambar itu terasa dingin di jarimu. Boneka itu masih di atas meja.","\n","ev","str","^Ambil bonekanya juga","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Ambil gambarnya saja, tinggalkan boneka","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Tinggalkan semuanya","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d4_a"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d4_draw"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d4_c"},"\n",{"#f":5}]}],null],"d4_draw":["#","^TAG:[Aman]","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev","str","^gambar_crayon","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d4","re":true},"^Kau mengambil gambar itu dan melipatnya hati-hati. Bonekanya kau biarkan di atas meja.","\n","^Saat kau berbalik, dari sudut matamu — kau bersumpah kepala boneka itu sedikit miring. Mengikutimu.","\n","^Kau tidak menoleh lagi.","\n",{"->":"opening"},null],"d4_c":["#","^TAG:[Aman]","/#","#","^AUDIO:corridor","/#","#","^IMAGE:bg_corridor","/#","ev","str","^Stress","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev","str","^Takut","/str",2,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_d4","re":true},"^Kau memutuskan untuk tidak menyentuh apa pun. Nalurimu berteriak.","\n","^Kau melangkah mundur menuju pintu. Dan saat itulah kau mendengarnya — pelan, hampir tidak ada:","\n","^'...jangan pergi.'","\n","^Suaranya seperti anak kecil. Berasal dari... boneka itu? Atau dari kepalamu sendiri?","\n","^Kau keluar dan menutup pintu. Tanganmu gemetar.","\n",{"->":"opening"},null],"d5_1":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:doorhub","/#","#","^IMAGE:bg_doorhub","/#","^Kau mengabaikan pintu-pintu itu dan terus melangkah ke ujung lorong.","\n","^Lampu-lampu di sini berkedip makin cepat. Langkah kakimu bergema... dan kau menyadarinya: gemanya salah. Ada setengah ketukan tambahan di antara langkahmu — seperti ada yang berjalan bersamamu, sedikit tidak selaras.","\n","^Kau berhenti. Gema itu berhenti... setengah detik lebih lambat.","\n","^Di depan, deretan lampu di langit-langit berkedip liar — kecuali satu. Satu lampu menyala stabil, terang, mengundang.","\n","^Di bawah lampu yang stabil itu, kau melihat sesuatu yang janggal: lantainya bersih. Tidak ada debu, tidak ada puing — padahal seluruh lorong ini kotor. Seperti tempat itu... dirawat. Atau sering ditunggu.","\n","^Dan kau teringat: tadi, saat bayangan besar melintas di kejauhan, setiap lampu yang dilewatinya berkedip liar.","\n",{"->":"d5_1c"},null],"d5_1c":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:doorhub","/#","#","^IMAGE:bg_doorhub","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Gema langkah itu masih ada — setengah ketukan di belakangmu. Lampu yang stabil itu menunggu.","\n","^Apa yang akan kau lakukan?","\n","ev","str","^Berlari ke lampu yang stabil — terang berarti aman (butuh 15 energi)","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Bergerak di antara kedipan, tetap dalam bayangan — Butuh fokus (mental ≤ Gelisah)","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Berbalik kembali ke persimpangan pintu","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"d5_trap"},"\n",{"#f":5}],"c-1":["^ ",{"->":"d5_smart"},"\n",{"#f":5}],"c-2":["^ ",{"->":"d5_back"},"\n",{"#f":5}]}],null],"d5_trap":["#","^AUDIO:doorhub","/#","#","^IMAGE:bg_doorhub","/#","^Kau berlari menuju cahaya. Terang berarti aman — itu naluri, itu logika.","\n","^Cahaya itu menyilaukan. Kau tidak melihat kegelapan di sekitarnya — dan di situlah ia berdiri.","\n","^Sosok besar tanpa kepala. Bertangan banyak. Kapak besar terangkat.","\n","^Lampu yang stabil itu bukan tempat aman. Itu tempatnya menunggu. Lampu-lampu lain berkedip karena ia lewat — yang satu ini stabil karena ia tidak pernah pergi.","\n","^Kau tak sempat menyesal.","\n","ev",{"x()":"DEATH"},"pop","/ev","\n","end",null],"d5_smart":["#","^TAG:[Aman]","/#","#","^AUDIO:doorhub","/#","#","^IMAGE:bg_doorhub","/#","ev","str","^Kelelahan","/str",{"x()":"TIER_UP","exArgs":1},"pop","/ev","\n","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Kau memaksa kakimu diam. Bernapas pelan. Mengamati.","\n","^Pola kedip lampu-lampu itu... tidak acak. Setiap beberapa detik, satu lampu berkedip liar — berpindah, mendekat. Sesuatu bergerak di lorong itu, dari lampu ke lampu.","\n","^Kau bergerak hanya saat lampu di depanmu padam dalam kedipnya — berlari pendek dalam gelap, berhenti dalam bayangan. Jantungmu menghantam rusuk, tapi kau tidak berhenti.","\n","^Saat kau melewati lampu yang stabil itu, kau tidak menoleh. Kau sudah tahu apa yang menunggu di sana.","\n","^Lorong terbuka ke sebuah pertigaan. Kau berhasil.","\n",{"->":"hub_exit"},null],"d5_back":["#","^TAG:[Aman]","/#","#","^AUDIO:doorhub","/#","#","^IMAGE:bg_doorhub","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","^Kau berbalik — perlahan, tanpa membelakangi kegelapan terlalu lama.","\n","^Gema setengah ketukan itu mengikutimu beberapa langkah, lalu... hilang. Seperti tidak pernah ada.","\n","^Kau kembali ke persimpangan pintu dengan napas memburu. Setidaknya kau masih hidup.","\n",{"->":"opening"},null],"hub_exit":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","#","^MAJOR","/#","^Langkah-langkahmu melambat, nyaris tanpa suara di atas lantai yang dingin, hingga kau tiba di sebuah pertigaan lorong. Di tengahnya, seperti bangkai hewan purba, berdiri meja resepsionis tua yang nyaris hancur — permukaannya retak, tepinya mengelupas, dan di atasnya berserakan tumpukan kertas yang telah menjadi sarang debu. Dari balik meja itu, dua lorong lain membentang: yang kiri tenggelam dalam kegelapan pekat, sunyi hingga kau bisa mendengar darahmu sendiri berdenyut di telinga; yang kanan, di ujungnya, memancarkan secercah cahaya redup yang bergoyang pelan, seolah mengundangmu mendekat — atau memancingmu.","\n","^Kau menarik napas, dan udara di sini terasa salah — berat, pengap, seakan tempat ini menyimpan terlalu banyak hal yang tak seharusnya diingat. Dan suara-suara itu… bisikan-bisikan samar yang sejak tadi mengikutimu, kini terdengar lebih dekat, merayap di sepanjang dinding seperti sesuatu yang hidup, menolak pergi, menolak membiarkanmu sendirian dengan pikiranmu sendiri.","\n",{"->":"reception_hub"},null],"reception_hub":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","#","^MAJOR","/#","^Kau berdiri di jantung pertigaan itu, dikelilingi kebisuan yang terasa berat menekan kulitmu. Meja resepsionis yang hancur itu membusuk dalam diam di tengah ruangan, tumpukan kertas berdebu di atasnya seolah menyimpan rahasia yang tak berani dibuka. Lorong kiri menganga gelap dan sunyi, menelan setiap suara; lorong kanan menjanjikan cahaya redup yang tak bisa sepenuhnya kau percaya. Dan di antara semuanya, suara-suara aneh itu masih berkeliaran — samar, sabar, menghantuimu.","\n","ev","str","^Periksa area sekitar meja resepsionis","/str",{"VAR?":"f_rec_desk"},"!","/ev",{"*":".^.c-0","flg":21},"ev","str","^Masuki lorong kiri yang gelap dan sunyi","/str",{"VAR?":"f_rec_left"},"!","/ev",{"*":".^.c-1","flg":21},"ev","str","^Periksa tumpukan kertas di atas meja","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["\n","ev",true,"/ev",{"VAR=":"f_rec_desk","re":true},{"->":"rec_desk_1"},{"#f":5}],"c-1":["\n","ev",true,"/ev",{"VAR=":"f_rec_left","re":true},{"->":"rec_left_1"},{"#f":5}],"c-2":["^ ",{"->":"rec_papers_1"},"\n",{"#f":5}]}],null],"rec_desk_1":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Kau berjongkok di sisi meja, dan lututmu langsung tenggelam dalam lapisan debu yang tebalnya hampir seperti kain. Bau apek menyengat naik ke hidungmu — bau kertas busuk, kayu lapuk, dan sesuatu yang lebih tua, lebih manis, yang tak ingin kau kenali. Kolong meja di hadapanmu gelap seperti mulut yang menganga, menolak memantulkan cahaya apa pun.","\n","^Jari-jarimu meraba di antara serpihan-serpihan tak dikenal — pecahan yang tajam di satu sisi, lunak dan berlendir di sisi lain — hingga ujung jarimu menyentuh sesuatu yang berbeda: kecil, bulat, dan dingin seperti es, tergeletak diam di lantai yang berdebu.","\n",{"->":"rec_desk_2"},null],"rec_desk_2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Kau masih berjongkok, napasmu tertahan, dan dalam gelap kolong meja itu dua hal menarik perhatianmu: lantai berdebu yang dingin di bawah telapak tanganmu, dan gundukan puing di sekitar kaki meja — keduanya seolah menyimpan sesuatu yang menunggu ditemukan.","\n","ev","str","^Raba lantai berdebu di kolong meja","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Periksa puing di sekitar kaki meja","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"rec_desk_floor"},"\n",{"#f":5}],"c-1":["^ ",{"->":"rec_desk_rubble"},"\n",{"#f":5}]}],null],"rec_desk_floor":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Kau meraba dalam kegelapan kolong meja, jari-jarimu menyapu lantai yang dingin dan berpasir. Lalu — sentuhan logam. Kecil, bulat, dingin menusuk, dengan permukaan kasar yang menggores kulitmu. Jantungmu berdebar sedikit lebih kencang, tanpa alasan yang jelas.","\n","^Kau menariknya keluar ke cahaya: sebuah koin logam tua, permukaannya begitu kusam hingga nyaris hitam, tepiannya terkikis waktu. Tidak ada ukiran yang bisa dikenali, tidak ada kilau, tidak ada makna. Tidak istimewa — tapi nyata, berat di telapak tanganmu, sebuah benda yang pernah disentuh tangan orang lain di tempat yang sudah lama mati ini.","\n",{"->":"rec_desk_floor_2"},null],"rec_desk_floor_2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Koin itu tergeletak di telapak tanganmu yang kotor, dinginnya perlahan meresap ke kulitmu, seolah menuntut sebuah keputusan.","\n","ev","str","^Ambil koin itu","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Biarkan saja di sana","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"rec_coin"},"\n",{"#f":5}],"c-1":["^ ",{"->":"rec_desk_back"},"\n",{"#f":5}]}],null],"rec_desk_rubble":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Kau menggeser puing-puing itu satu per satu: pecahan ubin yang tajam seperti gigi, sebuah cangkir kertas yang penyok dan menguning, pulpen plastik yang tintanya sudah lama kering. Sampah-sampah biasa dari sebuah kehidupan yang sudah berhenti.","\n","^Lalu matamu menangkap selembar kertas robek, terjepit di bawah pecahan ubin. Di atasnya, dengan tinta yang memudar, tertulis setengah kalimat: '...jangan percaya...' — dan sisanya hilang, terkoyak bersama separuh kertas yang tak pernah ditemukan. Jari-jarimu gemetar sedikit saat memegangnya.","\n","^Kau mengobrak-abrik sisa puing itu, tapi tidak ada lagi. Hanya debu yang beterbangan dan menempel di tenggorokanmu, dan bau apek yang semakin pekat, seolah tempat ini kecewa kau tidak menemukan apa-apa.","\n",{"->":"rec_desk_rubble_2"},null],"rec_desk_rubble_2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","^Puing itu tidak menyimpan apa-apa lagi — hanya bisu, debu, dan bau lapuk yang menempel di pakaianmu.","\n","ev","str","^Kembali berdiri","/str","/ev",{"*":".^.c-0","flg":20},{"c-0":["^ ",{"->":"rec_desk_back"},"\n",{"#f":5}]}],null],"rec_coin":["#","^KICKER:Part 1 : Awal Mula","/#","#","^TAG:[Aman]","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","ev","str","^koin_logam","/str",{"x()":"GRANT_ITEM","exArgs":1},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_rec_coin","re":true},"ev",true,"/ev",{"VAR=":"f_rec_desk","re":true},"^Kau memungut koin itu. Kusam, ringan, biasa saja — dinginnya menusuk telapak tanganmu sesaat sebelum perlahan menghangat oleh panas tubuhmu. Tidak ada ukiran rahasia, tidak ada petunjuk tersembunyi, tidak ada bisikan dari masa lalu.","\n","^Hanya sebuah koin tua. Benda mati dari tempat yang mati. Kau menyimpannya ke dalam saku — bukan karena berharga, tapi karena di tempat seperti ini, sesuatu yang nyata terasa lebih baik daripada tidak memegang apa-apa.","\n",{"->":"reception_hub"},null],"rec_desk_back":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","ev",true,"/ev",{"VAR=":"f_rec_desk","re":true},"^Kau berdiri, menepuk debu dari lututmu hingga awan kelabu kecil beterbangan di udara. Area meja tidak menyimpan apa-apa lagi — hanya bangkai kayu tua dan tumpukan kertas yang akan terus membusuk dalam diam.","\n","^Di belakangmu, pertigaan itu menunggumu kembali: lorong kiri yang gelap gulita, lorong kanan dengan cahaya redupnya, dan suara-suara aneh yang tak pernah benar-benar pergi.","\n",{"->":"reception_hub"},null],"rec_left_1":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:leftcorridor","/#","#","^IMAGE:bg_leftcorridor","/#","^Kau melangkah ke lorong kiri, dan seketika dunia di belakangmu terasa runtuh. Udara di sini berbeda — lebih dingin, lebih lembap, lebih berat, seperti paru-paru tempat ini sendiri sedang membusuk perlahan. Setiap langkahmu bergema pelan di lantai beton, sebuah bunyi yang tidak pantas terdengar sendirian di tempat sepi ini.","\n","^Kegelapan di lorong ini lebih tebal, lebih rakus. Ia menelan cahaya dari pertigaan di belakangmu satu langkah demi langkah, sampai yang tersisa hanyalah selaput hitam yang menutup di sekelilingmu. Lorong ini pendek — kau merasakannya dari cara dinding-dindingnya menutup di kejauhan — tetapi setiap meter terasa seperti ditarik mundur ke dalam sebuah rahang yang perlahan menutup.","\n",{"->":"rec_left_2"},null],"rec_left_2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:leftcorridor","/#","#","^IMAGE:bg_leftcorridor","/#","^Di ujung lorong — tanpa pintu samping, tanpa celah apa pun — berdiri sebuah pintu baja tebal. Logamnya memantulkan sisa cahaya dengan dingin, kusam, dan tak bersahabat. Lorong ini buntu. Kakimu telah membawamu sejauh ia bisa melangkah, dan satu-satunya yang menunggumu di sini hanyalah diamnya baja itu.","\n","ev","str","^Melangkah perlahan ke pintu baja","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Kembali ke pertigaan","/str","/ev",{"*":".^.c-1","flg":20},{"c-0":["^ ",{"->":"rec_left_door"},"\n",{"#f":5}],"c-1":["^ ",{"->":"rec_left_back"},"\n",{"#f":5}]}],null],"rec_left_door":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:steeldoor","/#","#","^IMAGE:bg_steeldoor","/#","#","^SFX:door_creak","/#","^Kau menatap pintu baja itu dari dekat, dan napasmu tercekat. Ia terkunci rapat — tidak ada gagang, tidak ada lubang kunci, bahkan tidak ada celah yang cukup lebar untuk menyelipkan ujung jari. Permukaannya dingin dan licin di bawah sentuhanmu, seperti kulit hewan yang sudah lama mati.","\n","^Lalu kau melihatnya. Goresan-goresan dalam membelah permukaan baja itu, berulang dan sejajar — bekas cakaran. Kau menelan ludah; tidak ada manusia yang cakarnya sanggup menembus logam setebal ini. Sesuatu yang jauh lebih kuat dari manusia pernah mencoba mendobrak... dari sisi lain.","\n",{"->":"rec_left_door_2"},null],"rec_left_door_2":[["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:steeldoor","/#","#","^IMAGE:bg_steeldoor","/#","#","^SFX:door_creak","/#","^Pintu itu diam — diam yang tidak wajar, diam yang seolah sedang menahan napas. Dari celah tipis di bawahnya merembes bau besi berkarat, dan di baliknya... sesuatu yang busuk, samar, seperti daging yang dibiarkan membusuk di ruangan tanpa udara. Bau itu membuat perutmu mual.","\n","ev","str","^Dorong pintu baja itu","/str","/ev",{"*":".^.c-0","flg":20},"ev","str","^Telusuri goresan di permukaan pintu","/str","/ev",{"*":".^.c-1","flg":20},"ev","str","^Kembali ke pertigaan","/str","/ev",{"*":".^.c-2","flg":20},{"c-0":["^ ",{"->":"rec_left_push"},"\n",{"#f":5}],"c-1":["^ ",{"->":"rec_left_scratch"},"\n",{"#f":5}],"c-2":["^ ",{"->":"rec_left_back"},"\n",{"#f":5}]}],null],"rec_left_push":["#","^KICKER:Part 1 : Awal Mula","/#","#","^TAG:[Aman]","/#","#","^AUDIO:steeldoor","/#","#","^IMAGE:bg_steeldoor","/#","#","^SFX:metal_clang","/#","ev","str","^Takut","/str",1,{"x()":"ADD_EMOTION","exArgs":2},"pop","/ev","\n","ev",true,"/ev",{"VAR=":"f_rec_left","re":true},"^Kau menahan napas dan mendorong sekuat tenaga — bahumu menabrak logam yang dingin itu, otot-ototmu menegang sampai gemetar. Pintu itu tidak bergeming sedikit pun, seolah telah dilas mati oleh dunia ini sendiri.","\n","^Lalu — dentum pelan, dalam, yang menggema di dadamu seperti jantung kedua. Hening. Dan dari sisi lain pintu itu... terdengar sesuatu yang bergeser. Pelan. Berat. Menjauh, atau mendekat — kau tidak bisa tahu. Kakimu memutuskan lebih dulu daripada kepalamu: kau mundur, tangan gemetar, napas tercekat di tenggorokan.","\n",{"->":"reception_hub"},null],"rec_left_scratch":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:steeldoor","/#","#","^IMAGE:bg_steeldoor","/#","^Ujung jarimu menelusuri goresan itu, dan kau merasakan logam yang terkoyak — dalam, kasar, tak kenal ampun. Goresan-goresan itu berulang dalam pola sejajar, ritmis, seperti cakaran yang menyerang lagi dan lagi. Terlalu lebar untuk tangan manusia. Terlalu dalam untuk sesuatu yang bukan binatang... atau sesuatu yang lebih buruk dari binatang.","\n","^Dan kemudian darahmu menjadi es. Sudut-sudut sobekannya — kau melihatnya sekarang — menunjuk ke dalam, ke arahmu. Goresan ini tidak dibuat dari sisi luar. Goresan ini berasal dari SISI DALAM pintu. Sesuatu di balik baja itu pernah mencoba... KELUAR.","\n",{"->":"rec_left_door_2"},null],"rec_left_back":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:leftcorridor","/#","#","^IMAGE:bg_leftcorridor","/#","ev",true,"/ev",{"VAR=":"f_rec_left","re":true},"^Kau melangkah mundur perlahan, kaki terseret, tidak pernah melepaskan pandangan dari pintu baja itu. Setiap langkah mundur terasa seperti menarik dirimu keluar dari mulut sesuatu yang sedang tidur.","\n","^Di pertigaan, cahaya menyambutmu dengan samar — dan baru di sana kau menyadari napasmu memburu, keringat dingin membasahi tengkuk. Kau telah kembali. Tetapi di punggungmu, lorong kiri itu tetap menganga, dan kau tidak berani membelakanginya terlalu lama.","\n",{"->":"reception_hub"},null],"rec_papers_1":["#","^KICKER:Part 1 : Awal Mula","/#","#","^AUDIO:reception","/#","#","^IMAGE:bg_reception","/#","#","^SFX:paper_rustle","/#","^Kau mendekati meja resepsionis. Di atasnya: tumpukan kertas berdebu, beberapa terikat tali yang sudah lusuh dan lapuk, tepi-tepinya menguning dimakan waktu. Debu beterbangan di udara saat kau bergerak, menari dalam cahaya samar seperti abu dari sesuatu yang terbakar lama.","\n","^Lembar paling atas menyambutmu dengan tulisan tangan yang besar dan tergesa: 'Eksperimen Subjek ke-X'. Huruf-hurufnya miring, ditekan keras sampai menembus kertas. Jantungmu berdebar begitu keras hingga kau yakin lorong-lorong kosong ini bisa mendengarnya.","\n",{"->":"rec_papers_2"},null],"rec_papers_2":[["#"
